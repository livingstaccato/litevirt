syntax = "proto3";
package litevirt.v1;

option go_package = "github.com/litevirt/litevirt/gen/litevirt/v1;litevirtv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ═══════════ Enums ═══════════

enum VMState {
    VM_CREATING  = 0;
    VM_STARTING  = 1;
    VM_RUNNING   = 2;
    VM_STOPPING  = 3;
    VM_STOPPED   = 4;
    VM_MIGRATING = 5;
    VM_ERROR     = 6;
    VM_UNKNOWN   = 7;
    // VM_PAUSED: the domain is active but not executing, its RAM kept —
    // suspended by the partition pauser or an operator. libvirt reports it
    // "stopped", the same as shut off; the server reads the reason. A client
    // built before it shows the number 8.
    VM_PAUSED    = 8;
}

enum HostState {
    HOST_ACTIVE      = 0;
    HOST_DRAINING    = 1;
    HOST_MAINTENANCE = 2;
    HOST_SUSPECT     = 3;
    HOST_OFFLINE     = 4;
    // Admitted by `lv host add`, its daemon not yet started: down to every
    // observer by construction, never fenced, no placement target. A server
    // on a release before this value reports such a host HOST_OFFLINE; a
    // client before it shows the number 5.
    HOST_JOINING     = 5;
    // Booted into a pending upgrade, or upgrading in place. A server on a
    // release before this value reports such a host HOST_DRAINING; a client
    // before it shows the number 6.
    HOST_UPGRADING   = 6;
    // Fenced by failover (or an operator) and not yet returned. A server on a
    // release before this value reports such a host HOST_OFFLINE; a client
    // before it shows the number 7.
    HOST_FENCED      = 7;
}

enum MigrateStrategy {
    MIGRATE_LIVE = 0;
    MIGRATE_COLD = 1;
    MIGRATE_NONE = 2;
}

enum HostFailurePolicy {
    RESTART_ANY  = 0;
    RESTART_SAME = 1;
    FAILURE_NONE = 2;
}

enum DiffOp {
    DIFF_UNCHANGED = 0;
    DIFF_CREATE    = 1;
    DIFF_UPDATE    = 2;
    DIFF_DELETE    = 3;
}

enum MigratePhase {
    MIGRATE_VALIDATING  = 0;
    MIGRATE_PREPARING   = 1;
    MIGRATE_COPYING     = 2;
    MIGRATE_CONVERGING  = 3;
    MIGRATE_CUTOVER     = 4;
    MIGRATE_COMPLETING  = 5;
    MIGRATE_DONE        = 6;
    MIGRATE_FAILED      = 7;
}

// ═══════════ Spec Types ═══════════

message VMSpec {
    string name        = 1;
    string stack_name  = 2;
    string image       = 3;
    int32  cpu         = 4;
    int32  memory_mib  = 5;
    string machine     = 6;
    string firmware    = 7;
    bool   guest_agent = 8;
    string ip_hint     = 9;

    repeated DiskSpec          disks         = 10;
    repeated NetworkAttachment network       = 11;
    CloudInitSpec              cloud_init    = 12;
    PlacementSpec              placement     = 13;
    MigrationPolicy            migrate       = 14;
    UpdatePolicy               update        = 15;
    ResourceTuning             resources     = 16;
    HealthCheckSpec            healthcheck   = 17;
    HooksSpec                  hooks         = 18;
    LBSpec                     loadbalancer  = 19;
    map<string, string>        labels        = 20;

    string iso  = 21;
    string boot = 22;
    int32  replicas = 23;
    repeated DeviceSpec    devices = 24;
    int32 stop_timeout_sec = 25;   // ACPI shutdown timeout before force-kill (0 = default 30s)
    RestartPolicy restart  = 26;   // auto-restart policy for stopped/crashed VMs
    bool  disable_vnc      = 27;   // true = headless (no VNC graphics device)
    // cpu_mode selects how the guest CPU is derived from the host:
    // host-passthrough | host-model | custom. Create defaults it to host-model
    // (see libvirt.DefaultCPUMode); empty means a spec that predates that
    // default, which still renders with NO <cpu> element — QEMU's qemu64, which
    // carries no SSE4.2/AVX/AVX2.
    string cpu_mode         = 28;
    bool  enable_spice     = 29;   // true = add a SPICE graphics device alongside VNC
    string project          = 30;  // tenancy bucket; "" → "_default"

    // Memory ballooning (#4). When max_memory_mib > memory_mib the domain gets a
    // virtio-balloon and a hot-pluggable maxMemory region; min_memory_mib (>0)
    // sets the floor the host may reclaim to. 0 = classic fixed memory_mib.
    int32 min_memory_mib = 31;
    int32 max_memory_mib = 32;

    // Boot ordering (#10). onboot starts the VM when its host daemon boots;
    // startup_order sequences onboot VMs (lower first); start_delay_sec waits
    // after this VM before starting the next; stop_delay_sec waits after asking
    // this VM to stop during an ordered shutdown.
    bool  onboot          = 33;
    int32 startup_order   = 34;
    int32 start_delay_sec = 35;
    int32 stop_delay_sec  = 36;
    bool  secure_boot     = 37;  // UEFI Secure Boot (q35 + SMM + secboot/MS OVMF)
    bool  tpm             = 38;  // emulated TPM 2.0 device (Windows 11 / BitLocker)
    string uuid           = 39;  // stable domain identity; makes the libvirt swtpm path deterministic
    int32  max_cpu        = 40;  // vCPU hotplug ceiling; >cpu emits <vcpu current=cpu>max_cpu</vcpu> for live CPU add (live_resize)
    // on_host_failure is the host-loss policy as a plain string ("restart-any" |
    // "restart-same" | "none"; "" = legacy/none). It exists because the failover
    // coordinator reads the PERSISTED spec JSON's top-level "on_host_failure" key,
    // and MigrationPolicy.on_host_failure cannot express that: RESTART_ANY is enum
    // value 0, which encoding/json omitempty drops entirely on store, making
    // restart-any indistinguishable from unset. The string field round-trips.
    string on_host_failure = 41;

    // cpu_model names the CPU model for cpu_mode="custom" and MUST be empty for
    // any other mode. Additive and mixed-version safe: an older peer ignores it,
    // and an older entry node simply never sets it (a custom-mode spec is
    // refused at validation rather than rendered without a model).
    string cpu_model = 42;

    // iso_scope is server-owned: which kind of pool the owner resolved iso to
    // at create — "global" (the global ISO library), "pool" (another pool with
    // no project), "project" (a pool the VM's project owns) or "hostpath" (an
    // Admin's absolute path). Every host that resolves iso later (a start, a
    // migration target) refuses a pool of another kind, so a same-named pool
    // elsewhere cannot stand in for it. Empty on VMs created before it existed.
    string iso_scope = 43;

    // 44 was iso_identity, replaced before release by a host-local record of
    // the ISO file each host judged (grpcapi/iso_identity.go).
    reserved 44;
    reserved "iso_identity";

    // USB passthrough (Proxmox "usbN"). Each entry names one host USB device by
    // vendor:product, by physical bus-port, or through a cluster-wide resource
    // mapping. A raw (unmapped) device pins the VM to the host it lives on; a
    // mapped one restricts placement to the hosts the mapping lists. Setting it
    // is refused until release_2026_11_v1 has latched (feature
    // usb_mounts_memory): an older peer would drop the field from a spec it
    // rewrites.
    repeated USBDeviceSpec usb_devices = 60;

    // Memory hot-add (virtio-mem). memory_hotplug_max_mib (> memory_mib) gives
    // the domain a NUMA cell of memory_hotplug_base_mib boot memory plus a
    // virtio-mem device covering the rest, so memory_mib can be raised live up
    // to the max and the change persists and migrates. base is server-owned:
    // the boot cell recorded when hot-add was enabled. 0 = no hot-add. Gated
    // like usb_devices.
    int32 memory_hotplug_max_mib  = 61;
    int32 memory_hotplug_base_mib = 62;

    // cpu_limit caps the VM's total CPU time in host cores (Proxmox cpulimit):
    // 2.5 lets the guest burn at most 2.5 cores however many vCPUs it has.
    // 0 = unlimited. Rendered as the libvirt <cputune> period/quota (a PER-vCPU
    // quota, so the render divides by the vCPU count). Additive; an older peer
    // ignores it, which only means the cap is not applied there.
    double cpu_limit = 45;
    // cpu_shares is the VM's relative CPU weight under contention (libvirt
    // <cputune><shares>; 1024 is the kernel default, range 2..262144).
    // 0 = leave at the default.
    int32  cpu_shares = 46;

    // firewall_id is the VM's firewall identity, the key of its firewall tags.
    // Server-owned once firewall tags land, whose writers strip a client's
    // value (plan task D2b); on this build nothing reads it, and it is stored
    // as sent.
    string firewall_id = 47;
}

// USBDeviceSpec selects one host USB device for passthrough. Exactly one of
// (vendor and product), bus_port, or mapping is set.
message USBDeviceSpec {
    string vendor   = 1;  // USB vendor ID, 4 hex digits, e.g. "046d"
    string product  = 2;  // USB product ID, 4 hex digits, e.g. "c52b"
    string bus_port = 3;  // physical port "<bus>-<port>[.<port>...]", e.g. "1-2" or "3-1.4"
    string mapping  = 4;  // cluster-wide resource mapping whose devices are USB
}

message DiskSpec {
    string name    = 1;
    string size    = 2;
    string bus     = 3;
    string cache   = 4;
    string image   = 5;
    string storage = 6;
    // SCSI controller model for bus=="scsi" (virtio-scsi | lsisas1068 | lsilogic
    // | vmpvscsi | buslogic). Set by VM import to preserve guest bootability;
    // empty = virtio-scsi. Ignored for non-SCSI buses.
    string controller_model = 7;
    // overwrite lets a root disk created from an image on an iscsi pool write
    // the image over a LUN that is not blank (a partition table, filesystem or
    // any earlier data in its first or last MiB). Without it such a LUN is
    // refused. A LUN any VM's disk is never written, whatever this says.
    bool overwrite = 8;
    // TRIM/discard passthrough (libvirt <driver discard=...>): "unmap" passes the
    // guest's TRIM down so thin storage reclaims space; "ignore" drops it. Empty
    // = unset: a create stores the per-storage default (docs/storage.md), an
    // update inherits what is stored, and a disk stored empty renders no attribute
    // (the guest never sees a discard-capable device it did not have).
    string discard = 9;
    // <driver detect_zeroes=...>: "off" | "on" | "unmap". "unmap" turns a write
    // of zeroes into a discard and needs discard "unmap". Empty = unset.
    string detect_zeroes = 10;
    // Per-disk I/O throttle (libvirt <iotune>); nil = unset, an empty message
    // clears every limit. Changeable on a running VM (SetDiskIO).
    DiskIOLimits io = 11;
}

// DiskIOLimits is one disk's I/O throttle. 0 = unlimited. A total_* limit is
// exclusive with the read_*/write_* limit of the same kind (libvirt refuses the
// pair). *_max is the burst ceiling above the sustained rate, held for
// burst_seconds (default 1 when a *_max is set).
message DiskIOLimits {
    int64 total_bytes_sec     = 1;
    int64 read_bytes_sec      = 2;
    int64 write_bytes_sec     = 3;
    int64 total_iops_sec      = 4;
    int64 read_iops_sec       = 5;
    int64 write_iops_sec      = 6;
    int64 total_bytes_sec_max = 7;
    int64 read_bytes_sec_max  = 8;
    int64 write_bytes_sec_max = 9;
    int64 total_iops_sec_max  = 10;
    int64 read_iops_sec_max   = 11;
    int64 write_iops_sec_max  = 12;
    int64 burst_seconds       = 13;
}

message NetworkAttachment {
    string          name            = 1;
    string          model           = 2;
    string          ip              = 3;
    string          gateway         = 4;
    string          mac             = 5;
    repeated int32  trunk           = 6;
    string          ipv6            = 7;
    string          ipv6_gateway    = 8;
    repeated string security_groups = 9;  // SG names bound to this NIC (distributed firewall)
    // virtio-net multiqueue: <driver name='vhost' queues='N'/>. 0 or 1 = off
    // (one queue). Only for the virtio model. Takes effect on the next define.
    int32           queues          = 12;
    // rate_mb_sec caps this NIC's bandwidth in MB/s, both directions (Proxmox
    // rate=). Rendered as the libvirt <bandwidth> average. 0 = unlimited.
    double          rate_mb_sec     = 10;
    // The guard fields are 13-17: 10 and 12 were taken first (rate_mb_sec,
    // queues). 11 is unused.
    // NIC guard (anti-spoofing, docs/firewall.md). Applied when the NIC is
    // created or hot-attached; change it later with SetNICGuard.
    //   spoof_guard: "" = the default for a new NIC (on), "on", or "off".
    //   allowed_addresses: extra source addresses/prefixes the guest may use
    //     beyond the ones litevirt assigns (VIPs, VRRP, static secondaries).
    string          spoof_guard                = 13;
    repeated string allowed_addresses          = 14;
    bool            allow_dhcp_server          = 15;
    bool            allow_router_advertisement = 16;
    // allow_vlan_tags: let the guest send 802.1Q / 802.1ad tagged frames (a
    // trunk). Every other NIC's tagged frames are dropped.
    bool            allow_vlan_tags            = 17;
    // mtu is the guest NIC's MTU: 0 renders none, 1 means the bridge's MTU
    // read when the domain is defined, and any other value must equal the
    // bridge's MTU on the defining host (release feature nic_mtu).
    int32           mtu                        = 18;
}

message CloudInitSpec {
    string userdata      = 1;
    string metadata      = 2;
    string networkconfig = 3;
}

message PlacementSpec {
    // A host pin restricts candidate selection but never bypasses hard
    // constraints (capacity, labels, devices, anti-affinity, or replica caps).
    string                 host          = 1;
    repeated string        anti_affinity = 2;
    repeated string        affinity      = 3;
    map<string, string>    require       = 4;
    map<string, string>    prefer        = 5;
    bool                   spread        = 6;       // legacy; prefer policy
    int32                  max_per_node  = 7;       // 0 = unlimited
    string                 policy        = 8;       // balance | bin-pack | spread-strict | cost-aware
    RebalanceSpec          rebalance     = 9;       // day-2 reconciliation; nil inherits cluster default
    bool                   no_migrate    = 10;      // VM opts out of all live migration
    // failback: after a drain moved this VM off a host, move it back by live
    // migration once that host is undrained (docs/migration-failover.md).
    bool                   failback      = 11;
}

// RebalanceSpec: day-2 reconciliation policy. See docs/placement.md.
message RebalanceSpec {
    string         mode      = 1;     // off | dry-run | auto
    int32          threshold = 2;     // min imbalance % to trigger a proposal (default 15)
    string         cooldown  = 3;     // "5m" — min interval per VM
    RebalanceBudget budget   = 4;
}

message RebalanceBudget {
    int32  max_concurrent = 1;
    int32  max_per_hour   = 2;
    string window         = 3;        // named cluster time window (e.g. "off-hours")
}

message MigrationPolicy {
    MigrateStrategy    strategy          = 1;
    string             max_downtime      = 2;
    bool               auto_converge     = 3;
    bool               with_storage      = 4;
    HostFailurePolicy  on_host_failure   = 5;
    int32              priority          = 6;
    string             fence_strategy    = 7;
    int32              bandwidth_mib_sec = 8;
    int32              timeout_sec       = 9;
}

message UpdatePolicy {
    string strategy            = 1;
    int32  max_unavailable     = 2;
    int32  max_surge           = 3;
    string order               = 4;
    string health_wait         = 5;
    bool   rollback_on_failure = 6;
    string pause_between       = 7;
}

message ResourceTuning {
    bool           hugepages     = 1;
    repeated int32 cpu_pinning   = 2;
    string         numa_topology = 3;  // deprecated: use numa_policy
    int32          io_threads    = 4;
    NUMAPolicy     numa_policy   = 5;
}

message NUMAPolicy {
    int32  preferred_node = 1;  // -1 = auto-detect from device topology
    bool   strict         = 2;  // fail if preferred node unavailable
    string clique_hint    = 3;  // prefer devices in this NVLink/xGMI clique
}

message HealthCheckSpec {
    string type     = 1;
    string target   = 2;
    string interval = 3;
    string timeout  = 4;
    int32  retries  = 5;
    string action   = 6;
}

message HooksSpec {
    string pre_start    = 1;
    string post_start   = 2;
    string pre_stop     = 3;
    string post_stop    = 4;
    string pre_migrate  = 5;
    string post_migrate = 6;
}

message LBSpec {
    bool            enabled         = 1;
    string          vip             = 2;
    repeated LBPort ports           = 3;
    string          algorithm       = 4;
    LBHealthSpec    health          = 5;
    bool            sticky_sessions = 6;
    repeated string hosts           = 7;
    bool            snat            = 8;
}

message LBPort {
    int32     listen         = 1;
    int32     target         = 2;
    string    protocol       = 3;
    LBTlsSpec tls            = 4;
    bool      redirect_https = 5;
}

message LBTlsSpec {
    string cert = 1;
    string key  = 2;
}

message LBHealthSpec {
    bool   use_vm_healthcheck = 1;
    string path               = 2;
    string interval           = 3;
    string type               = 4; // "tcp" | "http" (default: tcp)
}

message RestartPolicy {
    string condition    = 1; // "none" | "on-failure" | "always"
    string delay        = 2; // delay before restart e.g. "5s", "1m"
    int32  max_attempts = 3; // 0 = unlimited
    string window       = 4; // reset attempt counter after this duration e.g. "1h"
}

// ═══════════ PCI Device Types ═══════════

message DeviceSpec {
    string type        = 1;  // gpu | network | nvme | infiniband | pci
    string vendor      = 2;  // PCI vendor ID e.g. "10de"
    string model       = 3;  // optional model string match
    int32  count       = 4;  // number of devices requested (default 1)
    string address     = 5;  // exact PCI address e.g. "0000:41:00.0"
    bool   sriov       = 6;  // request an SR-IOV VF instead of PF
    string parent      = 7;  // SR-IOV: allocate from this PF
    string mig_profile = 8;  // GPU MIG profile e.g. "1g.5gb", "3g.20gb"
    int32  namespace   = 9;  // NVMe namespace ID (0 = whole controller)
    string mapping     = 10; // cluster-wide resource-mapping name (#14): resolve to a
                             // concrete PCI address on the target host at allocation
                             // time, so a passthrough VM can land on any equivalent host
}

// ═══════════ Resource Mappings (#14) ═══════════

// ResourceMappingDevice is one host's concrete device under a named mapping.
message ResourceMappingDevice {
    string host_name = 1;
    string address   = 2;  // PCI address on that host, e.g. "0000:41:00.0"
    string vendor    = 3;  // optional vendor ID for display/validation
    string device    = 4;  // optional device ID / human name
}

// ResourceMapping is a cluster-wide alias for an equivalent device available on
// one or more hosts. A VM requesting devices by mapping name can be placed on or
// migrated to any host that has an entry here.
message ResourceMapping {
    string name        = 1;
    string description = 2;
    repeated ResourceMappingDevice devices = 3;
}

// ═══════════ Notifications (#5) ═══════════

// NotificationTarget is a configured delivery destination.
message NotificationTarget {
    string id      = 1;
    string name    = 2;
    string type    = 3;  // webhook | slack
    string config  = 4;  // JSON (url, …)
    bool   enabled = 5;
}

// NotificationRoute selects which event patterns (at which min severity) go to a target.
message NotificationRoute {
    string id            = 1;
    string event_pattern = 2;  // glob: "backup.*", "host.fenced", "*"
    string target_id     = 3;
    string min_severity  = 4;  // info | warn | error
    bool   enabled       = 5;
}

// FirewallRule is a cluster- or host-tier rule (the non-NIC firewall planes).
// host_name is set only on host-tier rules.
message FirewallRule {
    string id         = 1;
    string host_name  = 2;  // host-tier only; empty for cluster-tier
    string direction  = 3;  // ingress | egress
    string proto      = 4;  // tcp | udp | icmp | all
    string port       = 5;  // "80" | "8000-9000" | ""
    string cidr       = 6;  // CIDR or "@<ipset>"
    string action     = 7;  // accept | drop | reject
    int32  priority   = 8;
    string comment    = 9;
    string stack_name = 10; // set when created from a compose file
    bool   log        = 11; // log each packet the rule matches; action stays the plain verdict
}

// IpSet is a named CIDR list, referenced by rules as cidr = "@<name>".
message IpSet {
    string          id         = 1;
    string          name       = 2;
    repeated string cidrs      = 3;
    string          stack_name = 4;
}

// FirewallDefault is the default-deny policy for one scope ('cluster' or a host name).
message FirewallDefault {
    string scope        = 1;  // 'cluster' | <host name>
    bool   default_deny = 2;
    string stack_name   = 3;
}

// SecurityGroup is a named set of per-NIC rules, bound to NICs by name.
message SecurityGroup {
    string id         = 1;
    string name       = 2;
    string stack_name = 3;  // empty = cluster-wide
    string created_at = 4;
    string project    = 5;  // owning project; empty = global (docs/design/security-group-projects.md)
}

// SecurityGroupRule is one rule of a security group.
message SecurityGroupRule {
    string id        = 1;
    string sg_id     = 2;
    string direction = 3;  // ingress | egress
    string proto     = 4;  // tcp | udp | icmp | all
    string port      = 5;  // "80" | "8000-9000" | ""
    string cidr      = 6;  // CIDR or "@<ipset>"; empty = any
    string action    = 7;  // accept | drop | reject
    int32  priority  = 8;  // lower runs first
    bool   log       = 9;  // log each packet the rule matches; action stays the plain verdict
}

// FirewallSynfloodPolicy is the SYN-flood protection policy of one scope.
message FirewallSynfloodPolicy {
    string scope      = 1;  // "cluster" | "host/<name>"
    string mode       = 2;  // on | off
    uint32 rate       = 3;  // new SYNs per second per (guest NIC, source address)
    uint32 burst      = 4;  // packets
    string set_by     = 5;
    string updated_at = 6;
    bool   inherited  = 7;  // a host with no row of its own: the cluster policy applies
    // A host's entry only: its SYN-flood drops per family since its last
    // reload (the lv-sf 4 and lv-sf 6 counters), asked of the host itself.
    // error says why they could not be read; then the counts mean nothing.
    uint64 drops_v4   = 8;
    uint64 drops_v6   = 9;
    string error      = 10;
    // A host's entry only: what that host has in force, from its last
    // firewall pass: on | ipv4-only | ipv6-only (the kernel refused the
    // other family's rules) | observe (counted, not dropped) | guards-only (no
    // bridge conntrack: nothing rendered) | no-guest-nics (no per-NIC table
    // yet) | unavailable (the kernel refused the SYN-flood rules, or the
    // first per-NIC table) | off. A refused per-NIC table keeps the previous
    // pass's value. Empty from a daemon that predates it.
    string in_force   = 11;
}

// FirewallLogPolicy is the firewall log policy of one scope.
message FirewallLogPolicy {
    string scope          = 1;  // "cluster" | <host name>
    bool   default_policy = 2;  // log the default verdict
    uint32 rate           = 3;  // per-NIC log budget, records per second
    uint32 burst          = 4;
    string set_by         = 5;
    string updated_at     = 6;
    bool   inherited      = 7;  // a host with no row of its own: the cluster policy applies
}

// FirewallLogEntry is one logged packet.
message FirewallLogEntry {
    string host      = 1;
    uint64 seq       = 2;   // per-host sequence, the follow cursor
    string time      = 3;   // RFC 3339
    string workload  = 4;
    string mac       = 5;
    string device    = 6;
    string side      = 7;   // in | out
    string rule_id   = 8;   // the rule id, or "default"
    string tier      = 9;
    string verdict   = 10;  // accept | drop | reject | would-drop
    string family    = 11;  // ip | ip6
    string proto     = 12;
    string src       = 13;
    uint32 sport     = 14;
    string dst       = 15;
    uint32 dport     = 16;
    uint32 length    = 17;
    string tcp_flags = 18;
}

// FirewallTagGroup is a named selector over firewall tags.
message FirewallTagGroup {
    string                      name            = 1;
    map<string, string>         match           = 2;  // ANDed; an empty value means "has the key"
    repeated string             networks        = 3;  // limits the group binding; empty = every network
    repeated string             security_groups = 4;
    string                      set_by          = 5;
    string                      updated_at      = 6;
    repeated FirewallTagMember  members         = 7;  // only when asked for
}

// FirewallTagMember is one workload a tag group matches.
message FirewallTagMember {
    string          kind         = 1;  // vm | container
    string          workload     = 2;
    string          host         = 3;
    repeated string addresses    = 4;
    string          address_note = 5;  // why a member has no address
}

// FirewallTags is one workload's firewall tags.
message FirewallTags {
    string              kind       = 1;  // vm | container
    string              workload   = 2;
    string              host       = 3;
    string              fw_id      = 4;  // the workload's firewall identity
    map<string, string> tags       = 5;
    string              set_by     = 6;
    string              updated_at = 7;
    // orphan: no live workload holds fw_id; the row an earlier incarnation of
    // this name left, not applied (only listed when a workload is named).
    bool                orphan     = 8;
    // Set only in a tag set's answer when the workload's identity was a copy
    // (another live workload held it too): the identity replaced, and the
    // tags its row held, now cleared from both workloads.
    string              replaced_fw_id = 9;
    map<string, string> dropped_tags   = 10;
    // unreadable: the workload's tags row cannot be read (malformed). It
    // grants no membership, and its NICs are held at drop where a tag group
    // binds security groups (tags shows none).
    bool                unreadable     = 11;
    // Set only in a tag set's answer: the networks on which the workload has
    // no allocated address while a tag group it is a member of covers them.
    // A tag: rule never matches its traffic there (a VM is leased an address
    // only on a NetBox-bound network); the group's bindings still apply.
    repeated string     unaddressed_networks = 12;
}

message PCIDevice {
    string host_name       = 1;
    string address         = 2;  // "0000:41:00.0"
    string vendor_id       = 3;  // "10de"
    string device_id       = 4;  // "2236"
    string vendor_name     = 5;  // "NVIDIA Corporation"
    string device_name     = 6;  // "A100 PCIe 40GB"
    string type            = 7;  // gpu | network | nvme | infiniband | other
    int32  iommu_group     = 8;
    bool   sriov_capable   = 9;
    int32  sriov_vfs_total = 10;
    int32  sriov_vfs_free  = 11;
    string driver          = 12; // current driver: "vfio-pci" | "nvidia" etc
    string vm_name         = 13; // assigned VM, empty if free
    int32  numa_node       = 14;
    string pcie_root_port  = 15; // PCIe root port ancestor
    string pcie_bridge     = 16; // immediate parent bridge
    string link_clique     = 17; // NVLink/xGMI peer group ID
    repeated string link_peers = 18; // peer GPU addresses in clique
}

// ═══════════ Hot-plug Types ═══════════

message AttachDeviceRequest {
    string vm_name = 1;
    DiskSpec          disk       = 2;
    NetworkAttachment nic        = 3;
    DeviceSpec        pci_device = 4;
    string idempotency_key = 5;
}

message DetachDeviceRequest {
    string vm_name     = 1;
    string disk_name   = 2;
    string nic_mac     = 3;
    string pci_address = 4;
    string idempotency_key = 5;
}

// ═══════════ Runtime / Response Types ═══════════

message VM {
    string                         name         = 1;
    string                         stack_name   = 2;
    string                         host_name    = 3;
    VMSpec                         spec         = 4;
    VMState                        state        = 5;
    string                         state_detail = 6;
    int32                          cpu_actual   = 7;
    int32                          mem_actual_mib = 8;
    repeated VMInterface           interfaces   = 9;
    repeated VMDisk                disks        = 10;
    google.protobuf.Timestamp      created_at   = 11;
    google.protobuf.Timestamp      updated_at   = 12;
    string                         vnc_address  = 13;
    bool                           is_template  = 14;  // a template: can't start; clone source
    // health is the VM's healthcheck verdict for its CURRENT incarnation, as
    // its owning host published it: healthy | unhealthy | unknown. Empty when
    // the VM defines no healthcheck (then running is healthy). unknown covers
    // no verdict yet, a verdict from before a restart/recreate/migration, a
    // stopped VM, and an owner host that is offline, fenced or in maintenance.
    // Set by InspectVM/GetVM; not by ListVMs.
    string                         health        = 15;
    string                         health_detail = 16; // why, in words: the probe's last failure reason, etc.
    // stranded_disks are the VM's host-local disks a failover left on another
    // host: the VM was restarted elsewhere on a disk rebuilt from its image,
    // and its real data is there (condition vm_disk_stranded). Each is kept
    // while the VM exists. Set by InspectVM/GetVM; not by ListVMs.
    repeated VMStrandedDisk        stranded_disks = 17;
    // failover_held says why automatic failover is holding this VM down
    // rather than promoting its replica (e.g. its only replica is not
    // point-in-time), with the command that promotes it by hand. Empty when
    // nothing is held. Set by InspectVM/GetVM.
    string                         failover_held = 18;
    // pit_overlay_held says why the VM is held on a point-in-time copy
    // overlay that could not be verified against its disk, with the admin
    // command that resolves it (lv resolve-pit-overlay). Empty otherwise.
    string                         pit_overlay_held = 19;
    // promoted_partial says, when the VM's newest promotion recovered it
    // without its whole replica set, which disks were not recovered (and
    // where their real data is) or were recovered from an earlier run than
    // the root disk. Empty when the newest promotion was complete, or there
    // was none. Set by InspectVM/GetVM.
    string                         promoted_partial = 20;
    // shared_disk_withheld says, when the VM's domain was last built from its
    // disk rows (a start by the reconciler or onboot, an operator's start or
    // restart that re-judged it, a redefine) without a shared disk whose row
    // names another host not proven powered off, which disks, why, and how
    // to attach them. Empty when the last such build withheld none. Set by
    // InspectVM/GetVM.
    string                         shared_disk_withheld = 21;
    // vnc_password_required: the VM's VNC console (vnc_address, on the
    // host's 127.0.0.1) requires a password (docs/ui.md "Console passwords").
    // Reach it through the web UI or `lv vnc <vm> --listen`, which present it.
    bool                           vnc_password_required = 22;
    // vnc_unknown says, when it is not empty, that libvirt on the VM's host
    // did not answer the read of its VNC console in time (or answered it
    // with an error): vnc_address is then empty, or, when the address was
    // read, vnc_password_required is false without saying the console has
    // no password. Empty when both were read, or the VM has no console to
    // read (not running, or on another host). Set by InspectVM/GetVM.
    string                         vnc_unknown = 23;
}

message VMStrandedDisk {
    string host  = 1;  // the host holding it
    string disk  = 2;
    string path  = 3;  // the disk's path on that host
    string copy  = 4;  // where that host set it aside; "" while it is still at path (host down)
    string since = 5;  // RFC3339
}

message VMInterface {
    string network_name = 1;
    int32  ordinal      = 2;
    string mac          = 3;
    string ip           = 4;
    string tap_device   = 5;
}

message VMDisk {
    string name           = 1;
    string host_name      = 2;
    string path           = 3;
    int64  size_bytes     = 4;
    string backing_image  = 5;
    string storage_type   = 6;
    string storage_volume = 7;
}

message HardwareDevice {
  oneof device {
    HardwareDisk disk = 1;
    HardwareNIC  nic  = 2;
    HardwarePCI  pci  = 3;
  }
}

message HardwareDisk {
  string device_id       = 1; // = disk_name
  string target          = 2; // e.g. vdb
  string bus             = 3; // virtio|scsi|sata
  string controller_model = 4;
  int64  size_bytes      = 5;
  string storage_type    = 6; // driver: local|nfs|ceph
  string storage_volume  = 7;
  bool   delete_with_vm  = 8;
  string state           = 9;
}

message HardwareNIC {
  string mac             = 1; // stable external handle
  string network         = 2;
  string model           = 3;
  int32  ordinal         = 4;
  string security_groups = 5;
  string state           = 6;
}

message HardwarePCIMember {
  string member_id        = 1;
  string resolved_address = 2;
  string xml_alias        = 3;
  int32  ordinal          = 4;
}

message HardwarePCI {
  string device_id                = 1;
  string selector_kind            = 2; // address|mapping|sriov|type
  DeviceSpec desired              = 3;
  repeated HardwarePCIMember members = 4;
  string state                    = 5;
}

message Host {
    string                         name          = 1;
    string                         address       = 2;
    HostState                      state         = 3;
    int32                          cpu_total     = 4;
    int32                          mem_total_mib = 5;
    // disk_total_gib and disk_used_gib are one measurement: statfs (what `df`
    // reports) summed over this host's storage pools, each filesystem counted
    // once. Their ratio is the host's real disk fill. When no pool row carries
    // capacity yet, total falls back to the figure the host recorded at startup
    // and used is 0 (unknown, not empty).
    int64                          disk_total_gib = 6;
    int32                          cpu_used      = 7;
    int32                          mem_used_mib  = 8;
    int64                          disk_used_gib = 9;
    int32                          vm_count      = 10;
    map<string, string>            labels        = 11;
    google.protobuf.Timestamp      created_at    = 12;
    google.protobuf.Timestamp      updated_at    = 13;
    repeated PCIDevice             pci_devices   = 14;
    string                         version       = 15;
    repeated StoragePool           storage_pools = 16;
    string                         fence_strategy = 17;
    string                         ipmi_address   = 18;
    string                         watchdog_dev   = 19;
    string                         region         = 20;  // federation: failure-domain label
    // Serial of the host's mTLS certificate. Not secret — it is the public
    // identifier of a public certificate — and `lv host rm` needs it to revoke that
    // certificate at the moment of removal, after which the row is tombstoned and
    // the serial is no longer readable.
    string                         cert_serial    = 21;
    // Sum of the DECLARED sizes of every disk of every VM on this host, stopped
    // VMs included: what has been promised, not what is consumed. Thin
    // provisioning lets it exceed disk_total_gib by design, so it is not a
    // numerator for disk_total_gib. Daemons before this field carried this
    // figure in disk_used_gib.
    int64                          disk_allocated_gib = 22;
    // Set only in UndrainHost's reply: what the undrain did about failback.
    // failback_started: a background failback run was started on the answering
    // daemon (follow it with FailbackHost follow=true). failback_note says why
    // not, or what to do, in words; empty when there is nothing to say.
    bool                           failback_started = 23;
    string                         failback_note    = 24;
    // The host's Redfish BMC, when it has one: the endpoint, the
    // ComputerSystem id and the auth mode. Never the user, password or CA.
    string                         redfish_endpoint  = 25;
    string                         redfish_system_id = 26;
    string                         redfish_auth      = 27;
    // Whether a Redfish CA bundle is configured (the bundle itself is not
    // returned); false means the system roots.
    bool                           redfish_ca_configured = 28;
    // Set by InspectHost only. Every in-flight capacity claim counted against
    // this host, and their sums: reserved_cpu and reserved_mem_mib are the
    // figures admission subtracts from this host's free capacity.
    repeated HostReservation       reservations     = 29;
    int32                          reserved_cpu     = 30;
    int32                          reserved_mem_mib = 31;
    // Set by InspectHost when some reservations could not be read: names each
    // such operation, and why only to a caller who may vm.read cluster-wide.
    // The readable reservations are still listed.
    string                         reservations_error = 32;
    // reserved_cpu and reserved_mem_mib cover only the listed reservations:
    // true whenever reservations_error is set.
    bool                           reservations_partial = 33;
    // Set by InspectHost: the host's resource pressure, from the answering
    // daemon's own sampler for itself, and for another host from that host's
    // latest answer to this daemon's readiness probe. level "unknown" when it
    // never answered with one (an older build, pressure.enabled false).
    HostPressure                   pressure             = 34;
    // When the probe that carried `pressure` was sent (RFC 3339); "" for the
    // answering daemon itself and when unknown.
    string                         pressure_observed_at = 35;
}

// HostPressure is a host's resource pressure (docs/configuration.md,
// "Resource pressure"). Diagnostic and placement-advisory only: nothing reads
// it as a reason to fence, recover or release anything.
message HostPressure {
  // ok | warn | degrade | critical, the worst over the resources; "unknown"
  // only where a reader fills it in for a host that did not say.
  string level = 1;
  // Each resource above ok, e.g. "data_dir.space", "pool.default.inodes".
  repeated string resources = 2;
  // RFC 3339: when the host entered its current level.
  string since = 3;
  // 4 and 5 are left for a later phase (exiting, workloads_live).
  // detail is every resource's state. DIAGNOSTIC ONLY: on the readiness
  // probe it is served to a caller holding a host certificate only, as
  // not_ready_reason is, because it carries paths and sizes.
  repeated PressureResource detail = 6;
  // The shortest projected time until a filesystem resource has nothing
  // free at its fill rate over the trend window; 0 when none is filling.
  int64 time_to_full_sec = 7;
  // When the host's sampler last completed a sample (RFC 3339, as
  // Host.pressure_observed_at); "" before the first.
  string sampled_at = 8;
  // The levels are the last ones known, not current: the sampler has not
  // completed a sample for more than three sample intervals, or its latest
  // read of the host's pool list did not return in time.
  bool stale = 9;
}

// PressureResource is one graded resource of a host.
message PressureResource {
  string name  = 1; // e.g. "data_dir.space", "pool.default.space", "fds.daemon", "memory.daemon"
  string level = 2; // ok | warn | degrade | critical
  string since = 3; // RFC 3339, start of the current level
  // free and total in unit ("bytes", "inodes" or "fds"); for the daemon's
  // memory and fds, free is the limit less what is in use.
  uint64 free  = 4;
  uint64 total = 5;
  string unit  = 6;
  double free_pct = 7;
  int64  time_to_full_sec = 8; // 0 when not filling
  string error = 9;            // why the latest sample failed; the level is the last known
}

// One in-flight capacity claim counted against a host.
message HostReservation {
    string                    operation_id       = 1;
    string                    method             = 2;  // the RPC that made it: ResizeVMLive, CreateVM, MigrateVM, ...
    // "resize", "create", "admission-lease", "transfer-lease", or the
    // operation kind of a journal (vm_replace, drain_cold_move).
    string                    kind               = 3;
    // The workload name and its project; both empty when the caller may not
    // vm.read it. The amounts, operation id and state are always shown.
    string                    vm                 = 4;
    string                    project            = 5;
    int32                     vcpu               = 6;
    int32                     memory_mib         = 7;
    google.protobuf.Timestamp created_at         = 8;
    int64                     age_seconds        = 9;
    // in-flight, admitting, auto-expires, journal, releasable, stale, or
    // release-blocked (see docs/diagnostics.md, "Host reservations").
    string                    state              = 10;
    string                    detail             = 11;
    int64                     header_owner_epoch = 12;
    bool                      admitted           = 13;
    bool                      provisional        = 14;
    // A tombstoned release row holds the key its release would be written at:
    // it stays counted and nothing releases it.
    bool                      release_blocked    = 15;
}

message Image {
    string                         name         = 1;
    string                         format       = 2;
    string                         source_url   = 3;
    string                         checksum     = 4;
    int64                          size_bytes   = 5;
    repeated string                hosts        = 6;
    google.protobuf.Timestamp      created_at   = 7;
    string                         status       = 8;  // "pulling", "ready", "error"
    float                          progress_pct = 9;
}

message Snapshot {
    string                         id         = 1;
    string                         vm_name    = 2;
    string                         host_name  = 3;
    string                         name       = 4;
    string                         state      = 5;
    int64                          size_bytes = 6;
    google.protobuf.Timestamp      created_at = 7;
    string                         type          = 8;  // "disk" | "memory" (#3)
    int64                          vmstate_bytes = 9;  // size of the saved RAM image (memory snapshots)
}

message User {
    string                         username   = 1;
    string                         role       = 2;
    google.protobuf.Timestamp      created_at = 3;
    // disabled and expires_at are the account's lifecycle (schema v64,
    // user_lifecycle). A disabled or expired account cannot log in, and its
    // sessions and API tokens stop authenticating. expires_at is RFC3339 UTC,
    // empty for an account that never expires.
    bool                           disabled   = 4;
    string                         expires_at = 5;
    // status is "active", "disabled" or "expired", judged by the answering
    // daemon's clock.
    string                         status     = 6;
}

message Token {
    string                         id         = 1;
    string                         username   = 2;
    string                         name       = 3;
    string                         token      = 4;
    google.protobuf.Timestamp      expires_at = 5;
    google.protobuf.Timestamp      created_at = 6;
}

message LoadBalancer {
    string            name        = 1;
    string            vip         = 2;
    string            algorithm   = 3;
    string            active_host = 4;
    repeated string   lb_hosts    = 5;
    repeated LBBackend backends   = 6;
    string            state       = 7;
    string            stack_name  = 8;  // empty for standalone LBs
    repeated LBPort   ports       = 9;  // port mappings
    optional bool     snat        = 10; // rewrites its network's guest egress to the VIP; absent = unknown (the lookup failed)
}

message LBBackend {
    string vm_name     = 1;
    string address     = 2;
    string status      = 3;
    int32  response_ms = 4;
    string last_error  = 5;
}

// LBBackendAddress is an explicit backend for standalone LBs.
message LBBackendAddress {
    string name    = 1;  // user-friendly name
    string address = 2;  // IP or IP:port
}

// LBBackendStats holds per-backend metrics from HAProxy stats socket.
message LBBackendStats {
    string name              = 1;  // server name in HAProxy
    string address           = 2;  // IP:port
    string status            = 3;  // UP, DOWN, DRAIN, MAINT
    int64  current_sessions  = 4;  // scur
    int64  total_sessions    = 5;  // stot
    int64  bytes_in          = 6;  // bin
    int64  bytes_out         = 7;  // bout
    int64  request_rate      = 8;  // rate
    int64  error_conn        = 9;  // econ
    int64  error_resp        = 10; // eresp
    int32  response_2xx      = 11; // hrsp_2xx
    int32  response_4xx      = 12; // hrsp_4xx
    int32  response_5xx      = 13; // hrsp_5xx
    int64  avg_response_ms   = 14; // rtime
    int64  avg_queue_ms      = 15; // qtime
}

// LBFrontendStats holds per-frontend metrics.
message LBFrontendStats {
    int32  listen_port       = 1;
    int64  current_sessions  = 2;
    int64  total_sessions    = 3;
    int64  bytes_in          = 4;
    int64  bytes_out         = 5;
    int64  request_rate      = 6;
}

// LBStatsResponse wraps per-frontend and per-backend stats.
message LBStatsResponse {
    string                     name      = 1;
    repeated LBFrontendStats   frontends = 2;
    repeated LBBackendStats    backends  = 3;
}

message LBKeepalivedRequest {
    string name = 1;  // LB name
}

message LBKeepalivedResponse {
    bool running = 1;  // keepalived for this LB is running on the responding host
}

// VMStats holds live resource utilization for a single VM.
message VMStats {
    string name             = 1;
    double cpu_pct          = 2;  // CPU usage percentage (0-100 * nVCPU)
    int64  mem_rss_bytes    = 3;  // actual memory usage (RSS)
    int64  mem_total_bytes  = 4;  // allocated memory
    int64  disk_rd_bytes    = 5;  // cumulative disk read bytes
    int64  disk_wr_bytes    = 6;  // cumulative disk write bytes
    int64  disk_rd_reqs     = 7;  // cumulative disk read ops
    int64  disk_wr_reqs     = 8;  // cumulative disk write ops
    int64  net_rx_bytes     = 9;
    int64  net_tx_bytes     = 10;
}

// HostResourceStats holds aggregated live resource utilization for a host.
message HostResourceStats {
    string           host_name      = 1;
    double           cpu_pct        = 2;  // aggregate CPU usage across all VMs
    int64            mem_used_bytes = 3;  // aggregate memory usage
    int64            mem_total_bytes = 4;
    int64            disk_rd_bytes  = 5;
    int64            disk_wr_bytes  = 6;
    repeated VMStats vm_stats       = 7;  // per-VM breakdown
}

message ClusterEvent {
    string                         action    = 1;
    string                         target    = 2;
    string                         detail    = 3;
    string                         username  = 4;
    google.protobuf.Timestamp      timestamp = 5;
}

message StoragePool {
    string name        = 1;
    string driver      = 2; // "local" | "nfs" | "ceph" | "iscsi"
    string source      = 3; // driver-specific (NFS: "server:/path", Ceph: pool name, iSCSI: IQN)
    string target      = 4; // local mount/directory path
    string host        = 5; // host this pool is on
    int64  total_gib   = 6;
    int64  used_gib    = 7;
    string state       = 8; // "active" | "error" | "unmounted"
    int64  total_bytes = 9;
    int64  used_bytes  = 10;
    string project     = 11; // owning tenant; empty = global/shared
}

// ── Live firmware migration (vTPM / Secure Boot) ──

// FirmwareRuntime is the firmware code a host runs a live firmware move with:
// the source reports the code its guest's processes run, the target its
// installed code.
message FirmwareRuntime {
    string libvirt               = 1;
    string qemu                  = 2;
    string swtpm                 = 3;
    string libtpms               = 4;
    string ovmf_fingerprint      = 5;  // "layout:<hex> ovmf:<hex>": the firmware layout (dataDir and OVMF paths) and the OVMF files' content
    bool   live_firmware_enabled = 6;  // migration.live_firmware on this host
}

// FirmwareApplicability is which firmware state a VM carries, each side
// deriving it from its own row: tpm (a vTPM) and uefi (a UEFI NVRAM that
// carries Secure Boot or TPM state).
message FirmwareApplicability {
    bool tpm  = 1;
    bool uefi = 2;
}

// TargetDomain is what the target host's libvirt holds for the VM's name,
// read when the target answers.
message TargetDomain {
    bool   present = 1;
    string state   = 2;  // libvirt state: running | paused | shutoff | ...; empty when not present
    string reason  = 3;  // libvirt state reason; empty when not present
    string uuid    = 4;  // the domain's uuid; empty when not present
}

// FirmwareVerdict is the target's answer to a firmware hand-over check.
enum FirmwareVerdict {
    FIRMWARE_VERDICT_UNSPECIFIED = 0;  // never sent; an empty answer
    FIRMWARE_VERDICT_BAD_REQUEST = 1;  // a hash the hold needs is empty
    FIRMWARE_VERDICT_NOT_HELD    = 2;  // no hold for this attempt and uuid
    FIRMWARE_VERDICT_NOT_RUNNING = 3;  // the domain is absent or inactive
    FIRMWARE_VERDICT_TARGET_RAN  = 4;  // the domain is active and running
    FIRMWARE_VERDICT_MATCH       = 5;  // paused, and its state equals the source's
    FIRMWARE_VERDICT_MISMATCH    = 6;  // paused, and its state differs or is missing
}

// FirmwareAbortMode is when, and why, a source aborts a live firmware move's
// target.
enum FirmwareAbortMode {
    FIRMWARE_ABORT_MODE_UNSPECIFIED        = 0;
    FIRMWARE_ABORT_MODE_PRE_CUTOVER        = 1;  // the guest is still running on the source
    FIRMWARE_ABORT_MODE_DISCARD_UNVERIFIED = 2;  // after cutover, the source drops the target's copy
}
