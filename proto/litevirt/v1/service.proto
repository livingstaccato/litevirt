    rpc ResetFirewallWouldDrops(ResetFirewallWouldDropsRequest) returns (FirewallEnforcementStatus);
    // ArmNICFirewall: see ArmNICFirewallRequest.
    rpc ArmNICFirewall(ArmNICFirewallRequest) returns (google.protobuf.Empty);
    // ResumeHeldVM: see ResumeHeldVMRequest.
    rpc ResumeHeldVM(ResumeHeldVMRequest) returns (google.protobuf.Empty);
    // SetNetworkGuardConfig: see SetNetworkGuardConfigRequest.
    rpc SetNetworkGuardConfig(SetNetworkGuardConfigRequest) returns (NetworkInfo);

    // ── Backup snapshots ──
    rpc BackupSnapshot(BackupSnapshotRequest)       returns (stream BackupSnapshotProgress);
    rpc RestoreFromBackup(RestoreFromBackupRequest) returns (stream RestoreFromBackupProgress);
    // Single-file restore: browse a backup and extract files from it. The
    // filesystem is read inside a throwaway restore VM, never on the host
    // (docs/design/backup-file-restore.md). Same permission as a full restore
    // of the VM or container; each extraction is audited.
    rpc ListBackupFiles(ListBackupFilesRequest) returns (ListBackupFilesResponse);
    rpc RestoreBackupFiles(RestoreBackupFilesRequest) returns (stream RestoreBackupFilesChunk);

    // ── Peer streaming backup transport (PR 4) ──
    // Move ONE manifest + only its missing chunks between two daemons over peer
    // mTLS, so backup/restore/migrate no longer need a shared NFS repo. Peer-only
    // (host cert CN); chunks travel as plaintext (re-encrypted at rest on the
    // destination). HasChunks is the batched dedup probe; PushBackup streams the
    // chunks (sub-chunk framed) then the manifest LAST.
    rpc HasChunks(HasChunksRequest)   returns (HasChunksResponse);
    rpc PushBackup(stream PushBackupFrame) returns (PushBackupResponse);

    // ── Backup repository maintenance ──
    // What `lv backup repo verify|gc|prune|sync` do to a local path, done by the
    // daemon to a repo it holds, under RBAC and on the audit record. The web
    // UI's /backups actions call these. Verbs: backup.verify, backup.gc,
    // backup.prune, backup.sync, all at `/`, legacy floor operator.
    // SetBackupRepoCompression (verb backup.compression, same place and floor)
    // creates a repo with zstd chunk compression, or turns zstd on for an
    // existing one, through the release token's backup_zstd gate: it is the
    // daemon-side half of `lv backup repo init|set-compression`.
    rpc VerifyBackupRepo(VerifyBackupRepoRequest)                 returns (VerifyBackupRepoResponse);
    rpc GarbageCollectBackupRepo(GarbageCollectBackupRepoRequest) returns (GarbageCollectBackupRepoResponse);
    rpc PruneBackupRepo(PruneBackupRepoRequest)                   returns (PruneBackupRepoResponse);
    rpc SyncBackupRepo(SyncBackupRepoRequest)                     returns (SyncBackupRepoResponse);
    rpc SetBackupRepoCompression(SetBackupRepoCompressionRequest) returns (SetBackupRepoCompressionResponse);
    // The /backups page's listing. Verb backup.read at `/`, legacy floor viewer;
    // a read, so not audited.
    rpc ListBackupRepoSnapshots(ListBackupRepoSnapshotsRequest)   returns (ListBackupRepoSnapshotsResponse);

    // ── Containers ──
    rpc CreateContainer(CreateContainerRequest) returns (Container);
    rpc StartContainer(StartContainerRequest)   returns (google.protobuf.Empty);
    rpc StopContainer(StopContainerRequest)     returns (google.protobuf.Empty);
    rpc DeleteContainer(DeleteContainerRequest) returns (google.protobuf.Empty);
    rpc ExecContainer(ExecContainerRequest)     returns (ExecContainerResponse);
    rpc ListContainers(ListContainersRequest)   returns (ListContainersResponse);
    rpc InspectContainer(InspectContainerRequest) returns (ContainerDetail);
    rpc ProbeContainerBackups(ProbeContainerBackupsRequest) returns (ProbeContainerBackupsResponse);
    // A container's scheduled replicas in a repo's replica namespace on one
    // host: a peer (failover), or a caller who may read its backups.
    rpc ListContainerReplicas(ListContainerReplicasRequest) returns (ListContainerReplicasResponse);
    // Remove SET-ASIDE container replicas (admin): the only way one goes.
    rpc RemoveContainerReplicas(RemoveContainerReplicasRequest) returns (RemoveContainerReplicasResponse);
    // Restore one replica as the container, stopped (admin; never a second copy).
    rpc RestoreContainerReplica(RestoreContainerReplicaRequest) returns (RestoreContainerReplicaResponse);
    rpc PullOCIImage(PullOCIImageRequest)       returns (google.protobuf.Empty);
    rpc BackupContainer(BackupContainerRequest)   returns (stream BackupContainerProgress);
    rpc RestoreContainer(RestoreContainerRequest) returns (stream RestoreContainerProgress);
    rpc MigrateContainer(MigrateContainerRequest) returns (stream MigrateContainerProgress);
    rpc SnapshotContainer(SnapshotContainerRequest)             returns (ContainerSnapshot);
    rpc ListContainerSnapshots(ListContainerSnapshotsRequest)   returns (ListContainerSnapshotsResponse);
    rpc RevertContainerSnapshot(RevertContainerSnapshotRequest) returns (google.protobuf.Empty);
    rpc DeleteContainerSnapshot(DeleteContainerSnapshotRequest) returns (google.protobuf.Empty);
    rpc ConvertContainerToTemplate(ConvertContainerToTemplateRequest) returns (Container);
    rpc CloneContainer(CloneContainerRequest)                         returns (Container);
    rpc ConvertContainer(ConvertContainerRequest)                     returns (Container);
    rpc PrepareContainerTarget(PrepareContainerTargetRequest)         returns (google.protobuf.Empty);

