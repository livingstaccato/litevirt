    rpc SetFirewallDefault(SetFirewallDefaultRequest)               returns (google.protobuf.Empty);
    rpc ListFirewallDefaults(ListFirewallDefaultsRequest)           returns (ListFirewallDefaultsResponse);

    // ── Firewall extras: SYN-flood protection, logging, tag groups ──
    rpc GetFirewallSynflood(GetFirewallSynfloodRequest)             returns (GetFirewallSynfloodResponse);
    rpc SetFirewallSynflood(SetFirewallSynfloodRequest)             returns (FirewallSynfloodPolicy);
    rpc GetFirewallLogPolicy(GetFirewallLogPolicyRequest)           returns (GetFirewallLogPolicyResponse);
    rpc SetFirewallLogPolicy(SetFirewallLogPolicyRequest)           returns (FirewallLogPolicy);
    rpc ListFirewallLog(ListFirewallLogRequest)                     returns (ListFirewallLogResponse);
    rpc ListFirewallTagGroups(ListFirewallTagGroupsRequest)         returns (ListFirewallTagGroupsResponse);
    rpc SetFirewallTagGroup(SetFirewallTagGroupRequest)             returns (FirewallTagGroup);
