syntax = "proto3";
package litevirt.v1;

option go_package = "github.com/litevirt/litevirt/gen/litevirt/v1;litevirtv1";

import "litevirt/v1/types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ═══════════ Request / Response Messages ═══════════

// ── Hosts ──
message ListHostsRequest   { map<string, string> label_filter = 1; }
message ListHostsResponse  { repeated Host hosts = 1; }
message InspectHostRequest { string name = 1; }
message DrainHostRequest   { string name = 1; int32 parallel = 2; }
// One VM's drain result. strategy is how the VM moved, or the move that was
// tried: MIGRATE_LIVE or MIGRATE_COLD. MIGRATE_NONE means the drain did not
// try to move it (refused or skipped first; error says why), not the VMSpec
// "never migrate" policy.
message DrainProgress      { string vm_name = 1; string target_host = 2;
    MigrateStrategy strategy = 3; float progress_pct = 4;
    string status = 5; string error = 6; }
message UndrainHostRequest { string name = 1; }
// FailbackHost moves VMs a drain of the host moved away back to it, by live
// migration, one at a time. Without all, only VMs that opted in (their
// placement.failback, or the cluster failback policy) are considered.
// dry_run reports what would move and why each other VM stays.
message FailbackHostRequest {
    string name    = 1;
    bool   all     = 2;
    bool   dry_run = 3;
    // follow attaches to the run on this daemon for the host (the one an
    // undrain started, running or finished) and streams its results, instead
    // of starting one. all and dry_run are ignored.
    bool   follow  = 4;
}
// FailbackProgress is one VM's failback result. status: moved | would-move |
// skipped | failed; reason says why for the last two.
message FailbackProgress {
    string vm_name  = 1;
    string from_host = 2;
    string status   = 3;
    string reason   = 4;
}
message FailbackPolicyStatus {
    bool   enabled    = 1;
    string set_by     = 2;
    string updated_at = 3;
    // settable: this host may write the policy (failover_scope_v1 latched).
    bool   settable   = 4;
}
message SetFailbackPolicyRequest { bool enabled = 1; }
// Ordered shutdown of a host's running VMs (honors startup_order desc +
// stop_delay_sec between VMs). Explicit operator action — NOT run on daemon
// SIGTERM / restart. This is the consumer of vms.stop_delay_sec.
message ShutdownHostWorkloadsRequest { string name = 1; }
message ShutdownProgress { string vm_name = 1; string status = 2; string error = 3; }
message SetHostLabelsRequest { string name = 1;
    map<string, string> labels = 2; repeated string remove = 3; }
message FenceHostRequest   {
    string name = 1;
    bool confirmed = 2;
    // confirm_manual_only: do NOT execute a fence; only record a
    // 'manual-confirmed' row in fencing_log and mark the host fenced.
    // Used by `lv host fence-confirm` after the operator has powered the
    // host off externally. Required by the failover coordinator's split-brain
    // guard before VMs are rescheduled when fence_strategy = "manual".
    bool confirm_manual_only = 3;
}
// dead removes a host that is fenced proof-grade and gone for good
// (`lv host rm --dead`, docs/design/recovery-claims.md §3.12): the daemon
// re-checks the fence and that the host is no longer a voter, and does not
// require its workloads to be drained — they are the stranded ones, and their
// rows stay for the recovery claims to supersede.
//
// expected_cert_serial is the serial `lv host rm` revoked before calling. The
// daemon refuses the removal when the row names another serial (a re-admission
// landed in between). Empty skips the check: an older CLI sends none.
message RemoveHostRequest  { string name = 1; bool force = 2; bool dead = 3; string expected_cert_serial = 4; }
// RemoveHostResponse names what was removed: the serial and incarnation of the
// row the removal tombstoned. Replaces google.protobuf.Empty, which is
// wire-compatible: an older daemon's empty response reads as zero values, and
// an older CLI ignores the fields.
message RemoveHostResponse { string cert_serial = 1; int64 incarnation = 2; }
message PublishCRLRequest  { string crl_pem = 1; }
// version is the published CRL's number, echoed back because the daemon has
// verified it by then and the caller has not. Whether the answering node had to
// install it is deliberately absent: `lv host rm` usually runs on a box that
// shares a pki directory with its daemon, so that answer would be "no" in the
// ordinary case and mean nothing about the cluster.
message PublishCRLResponse { int64 version = 1; }
// RevokeReplacedCertificateRequest carries a CRL the CA machine minted with the
// replaced serial of host added (`lv host renew-cert`). The daemon publishes it
// at once when that is safe for the voter chain, and otherwise records it as a
// revocation owed and publishes it as soon as it is.
message RevokeReplacedCertificateRequest {
    string host    = 1;
    string serial  = 2;   // lower-case hex
    string crl_pem = 3;   // must verify against the cluster CA and list serial
}
// revoked: published now. held: recorded as owed (reason says why); the
// cluster publishes it once the newest voter generation still verifies with
// the serial revoked.
message RevokeReplacedCertificateResponse {
    bool   revoked = 1;
    bool   held    = 2;
    string reason  = 3;
    int64  version = 4;
}
message FenceResult        { string host_name = 1; string method = 2;
    string result = 3; string detail = 4; }
// GetClusterHealth is THE health read: the durable condition set, evaluator
// coverage, observer→target connectivity, and per-host capacity assessments,
// rolled up into one overall state. Every consumer (CLI, REST, MCP, UI,
// dashboard) reads this; there is no per-signal health RPC.
message GetClusterHealthRequest {
    // include_resolved adds recently-resolved conditions (kept 30 days) to the
    // response — the operator's "what happened last week" view.
    bool include_resolved = 1;
}
message HealthCondition {
    string evaluator    = 1;
    string code         = 2;   // e.g. vm_dual_run, runtime_owner_mismatch
    string subject_kind = 3;   // vm | container | vip | host | cluster
    string subject_id   = 4;
    string lifecycle    = 5;   // observed | confirmed | resolved
    string severity     = 6;   // info | warning | critical
    repeated string hosts = 7; // involved hosts
    string evidence     = 8;   // canonical structured evidence (JSON)
    int32  observe_count = 9;
    int32  clean_count   = 10;
    string first_seen    = 11; // RFC3339
    string last_seen     = 12;
    string confirmed_at  = 13; // "" until confirmed
    string resolved_at   = 14; // "" until resolved
    string reporter      = 15;
}
// ResolveHealthConditionRequest names one open condition by its identity, as
// `lv health` prints it: code and subject. evaluator is needed only when two
// evaluators hold an open condition under the same code and subject.
message ResolveHealthConditionRequest {
    string code         = 1;
    string subject_kind = 2;
    string subject_id   = 3;
    string evaluator    = 4;
    string reason       = 5;   // the operator's note, recorded in the audit row
    // accept_stale_uefi_vars is the admin's explicit acceptance, for
    // nvram_flush_failed, that the UEFI vars stores the condition names may
    // be stale (`--accept-stale-uefi-vars`). That code is refused without it.
    bool   accept_stale_uefi_vars = 6;
}
message ResolveHealthConditionResponse {
    HealthCondition condition = 1;   // the row as resolved
}
message HealthEvaluatorStatus {
    string evaluator = 1;
    string last_scan = 2;      // RFC3339
    string coverage  = 3;      // complete | partial | unreachable | unsupported
    string reporter  = 4;
    string detail    = 5;
}
// One observer→target connectivity edge (the peer mTLS probe mesh).
message ConnectivityEdge {
    string observer = 1;
    string target   = 2;
    string status   = 3;       // healthy | suspect | failing
    int32  consecutive_failures = 4;
    string last_seen = 5;      // RFC3339
}
message HostCapacityAssessment {
    string host_name = 1;
    int32  db_cpu = 2;         // database-allocated
    int32  db_mem_mib = 3;
    int32  extra_cpu = 4;      // runtime-only workloads on top
    int32  extra_mem_mib = 5;
    int32  effective_cpu = 6;  // union accounting
    int32  effective_mem_mib = 7;
    bool   complete = 8;       // false = placement must treat as unknown
    string detail = 9;
    string sampled_at = 10;    // RFC3339
    int32  db_ct_mem_mib = 11; // the part of db_mem_mib running containers hold
}
message ClusterHealth {
    // HEALTHY: no active conditions, complete fresh coverage.
    // DEGRADED: warning-level conditions, or coverage/staleness gaps.
    // CRITICAL: any active critical condition.
    // UNKNOWN: no evaluator has ever completed a scan.
    string overall = 1;
    repeated HealthCondition conditions = 2;
    repeated HealthEvaluatorStatus evaluators = 3;
    repeated ConnectivityEdge connectivity = 4;
    repeated HostCapacityAssessment capacity = 5;
    string generated_at = 6;   // RFC3339
    // Why overall is not HEALTHY: one line per cause, empty when it is.
    repeated string reasons = 7;
}

message RescanHostRequest  { string name = 1; }
message RescanHostResponse { int32 added = 1; int32 removed = 2;
    int32 total = 3; repeated PCIDevice devices = 4; }
message ListHostDevicesRequest  { string name = 1; string type_filter = 2; }
message ListHostDevicesResponse { repeated PCIDevice devices = 1; }

// SupersededDisksRequest is `lv host superseded-disks <host>`: the disk copies
// a failover set aside on that host (<path>.superseded-<time>), and, with
// purge (admin), the removal of every one neither retained nor held.
//
// remove_paths and restore_path (admin) act on named copies only. A client
// sends them WITH purge set and older_than_sec at supersededNamedOnlySec
// (9e9 s, ~285 years): an older host, which does not know these fields, then
// still requires admin at the entry and purges nothing (no copy is that old),
// instead of answering a viewer, or purging every copy that is not held. The
// client tells such a host by its answer: no copy marked removed, no
// restored path.
message SupersededDisksRequest {
    string host           = 1;  // "" = the host answering
    bool   purge          = 2;  // remove every copy that is neither retained nor held
    int64  older_than_sec = 3;  // purge only copies set aside at least this long ago
    repeated string remove_paths = 4;  // remove exactly these copies, retained or not (never a held one)
    string restore_path   = 5;  // put this copy back as its VM's disk (the VM stopped on this host)
}
message SupersededDisk {
    string path         = 1;  // the copy
    string disk_path    = 2;  // the disk path it was set aside from
    string set_aside_at = 3;  // RFC3339
    int64  size_bytes   = 4;
    string vm_name      = 5;  // the VM whose disk is at disk_path now; "" when none
    string vm_state     = 6;
    string held         = 7;  // why it is kept even from a named removal; "" when not held
    bool   removed      = 8;  // removed by this request
    string retained     = 9;  // why the sweep and a bare purge keep it (its VM exists); "" when not retained
    bool   kept         = 10; // a disk a deleted VM was kept with, moved off its path by a create (<path>.kept-<time>): listed only, never purged, removed or restored
    bool   seed         = 11; // with kept: a cloud-init seed (it can hold user-data), not a disk
    bool   earlier_vm   = 12; // with kept and vm_name: the file is an earlier VM's of that name, not the VM of that name that exists now
    bool   uefi_vars    = 13; // with kept: the UEFI vars of a deleted VM's superseded definition its host undefined (<vars>.superseded-<time>), not a disk
}
message SupersededDisksResponse {
    string                  host           = 1;
    repeated SupersededDisk disks          = 2;
    int32                   retention_days = 3;  // superseded_disk_retention_days there; 0 = kept until removed
    string                  restored       = 4;  // the copy restore_path put back; "" when none
    string                  restored_to    = 5;  // the disk path it is now
    string                  set_aside      = 6;  // where the file it replaced was set aside; "" when there was none
}

// KeptDisksRequest is `lv host kept-disks <host>`: the disk chains VM deletes
// kept on that host (its kept-disk notes, <data_dir>/kept-disks/<vm>.json, and
// its record <data_dir>/kept-disks.json), and, with release (admin), the
// removal of one deleted VM's chains or of the one chain a file is in, with
// their note and record entries. A release is refused, removing nothing,
// while anything still references a file it would remove. An older host does
// not know the RPC and answers Unimplemented: nothing is removed there.
message KeptDisksRequest {
    string host         = 1;  // "" = the host answering
    string release      = 2;  // a deleted VM's name, or a file of a kept chain (absolute path); "" lists only
    bool   dry_run      = 3;  // with release: answer what it would remove, and why it is refused, removing nothing
    repeated string expect_paths = 4;  // with release (required unless dry_run): the files the caller confirmed; refused, removing nothing, when the release would remove any other set
    repeated string expect_snapshots = 5;  // with release: the deleted VM's snapshot records the caller confirmed it drops (KeptDiskChain.snapshots); refused when they differ
}
message KeptDiskFile {
    string path       = 1;
    int64  size_bytes = 2;
    bool   under      = 3;  // a file a kept layer above it backs on
    bool   gone       = 4;  // named by a note or record, and no longer there: a release only forgets it
}
message KeptDiskChain {
    string vm_name   = 1;  // the deleted VM it was kept with
    repeated KeptDiskFile files = 2;  // what a release removes, every overlay before what it backs on
    repeated string stands_on   = 3;  // the files below it that are not the VM's own (an image): a release leaves them
    string missing_base = 4;  // the backing file the chain names that does not exist; "" when whole
    string kept_at   = 5;  // RFC3339: when the delete recorded it, or when its note was last written
    string reason    = 6;
    repeated string records = 7;  // the note and the record file naming it
    string held      = 8;  // why a release is refused now; "" when it may be released
    bool   released  = 9;  // removed by this request
    string host      = 10; // the host its files are on, when not the host answering (a record of another host's disk): listed only
    repeated string snapshots = 11; // the deleted VM's snapshot records on this host a release of the VM drops with its files (no VM of the name exists, and each memory image is gone or released too)
}
message KeptDisksResponse {
    string host    = 1;
    repeated KeptDiskChain chains = 2;
    bool   dry_run = 3;  // the chains marked released were not removed: a dry run
}
message ConfigureHostRequest {
    string name = 1;
    string fence_strategy = 2;  // ssh | ipmi | redfish | watchdog | manual | best-effort
    string ipmi_address = 3;
    string ipmi_user = 4;
    string ipmi_pass = 5;
    string watchdog_dev = 6;
    // Role: "worker" (default) runs VMs and votes; "witness" votes only.
    // Witnesses are tiebreakers for even-N clusters; placement excludes them
    // and VM creation against a witness is rejected. See operating-model.md.
    string role = 7;
    // Region: failure-domain label (DC/rack/AZ). federation.
    // Default "default"; explicitly setting to "" is normalized to default.
    string region = 8;
    // Per-host capacity policy overrides. All optional: unset leaves the host's
    // current value alone, and clears back to the cluster default via a negative
    // reserve / zero ratio.
    //
    // A ratio of 0 means "inherit the cluster default" (a 0 ratio is never
    // meaningful). Reserves are optional because 0 IS meaningful — "hand guests
    // every last MiB" — and must stay distinguishable from "not configured".
    optional double cpu_overcommit = 9;
    optional double mem_overcommit = 10;
    optional int32 cpu_reserve = 11;
    optional int32 mem_reserve_mib = 12;
    // Clear the host's IPMI address, user and password. An empty ipmi_* field
    // means "leave alone", so this is the only way to remove them. Refused
    // together with any ipmi_* field, and while the host would be left fencing
    // by "ipmi" (pass another fence_strategy with it). A server that predates
    // the field ignores it: alone it answers "no fields to update", and a
    // client must check the returned host's ipmi_address is empty.
    bool clear_ipmi = 13;
    // Redfish BMC settings, for fence_strategy "redfish". As for ipmi_*, an
    // empty field means "leave alone", and the rest of the host's settings are
    // kept. redfish_endpoint is the BMC's base URL, https://host[:port];
    // redfish_system_id picks the ComputerSystem when the BMC has several;
    // redfish_auth is "session" (default) or "basic"; redfish_ca_pem is the
    // PEM bundle the BMC's certificate must chain to (empty: the system
    // roots). They are stored on the sensitive lane, never on the hosts row,
    // and are the release feature redfish_fence: refused with
    // FailedPrecondition until every host runs a build that knows it. A
    // server that predates them ignores them and refuses fence_strategy
    // "redfish"; a client must check the returned host's redfish_endpoint.
    string redfish_endpoint  = 14;
    string redfish_user      = 15;
    string redfish_pass      = 16;
    string redfish_system_id = 17;
    string redfish_auth      = 18;
    string redfish_ca_pem    = 19;
    // Clear the host's Redfish settings. Refused together with any redfish_*
    // field, and while the host would be left fencing by "redfish".
    bool clear_redfish = 20;
    // Unset one Redfish setting, keeping the rest: the system id (back to
    // "the BMC's only ComputerSystem") or the CA bundle (back to the system
    // roots). An empty field cannot say this, since it means "leave alone".
    // Each is refused together with a value for the same setting.
    bool clear_redfish_system_id = 21;
    bool clear_redfish_ca        = 22;
}

// ── VMs ──
message CreateVMRequest  { VMSpec spec = 1;
    // Optional client-supplied retry key. A lost-response retry carrying the same
    // key replays the original result instead of creating a second VM — but the
    // record is node-local, so this holds only when the retry reaches the SAME
    // entry node (pin retries to one endpoint for exactly-once). A retry that lands
    // on a different node relies on resource-name uniqueness as a best-effort
    // backstop, which is not linearizable in this masterless design. Reusing a key
    // with a different request is a client bug (→ 409).
    string idempotency_key = 2;
    // allow_overcommit skips HOST capacity admission for this create (project
    // quota still applies). For deliberate density on a host the operator knows
    // can take it; the bypass is audited so it is never silent.
    bool allow_overcommit = 3; }
message ListVMsRequest   { string stack_name = 1; string host_name = 2;
    map<string, string> label_filter = 3;
    // Keyset pagination (additive; mixed-version safe — an old server ignores these
    // and returns the full list, an old client ignores next_page_token). page_size
    // 0 = unpaginated (legacy behavior). page_token is the opaque cursor returned as
    // next_page_token by the previous page.
    int32 page_size = 4; string page_token = 5; }
message ListVMsResponse  { repeated VM vms = 1; string next_page_token = 2; }
message InspectVMRequest { string name = 1; }
message ListVMHardwareRequest  { string vm_name = 1; }
message ListVMHardwareResponse {
    repeated HardwareDevice devices = 1;
    string hardware_adoption_state = 2;  // pending | adopted | blocked
    string hardware_adoption_error = 3;  // reason when blocked
}
message StartVMRequest   { string name = 1;
    // allow_overcommit skips HOST capacity admission for this start. Requires the
    // vm.overcommit verb; the bypass is audited.
    //
    // Unlike CreateVMRequest this says nothing about project quota, because start
    // does not evaluate quota at all: a project allocation counts whether the
    // workload is running or stopped, so charging it again on start would refuse a
    // simple stop/start of any VM over half its quota. There is no quota check
    // here to bypass.
    bool allow_overcommit = 2; }
message StopVMRequest    { string name = 1; bool force = 2; int32 timeout = 3; }
message RestartVMRequest { string name = 1; }
message DeleteVMRequest    {
    string name = 1;
    bool keep_disks = 2;
    // Binds the delete to the VM its caller saw; every host the delete
    // reaches checks its own row under the VM's lock and deletes nothing on a
    // mismatch (FailedPrecondition). Empty = unbound (an operator's delete).
    // expected_stack: the row must record this stack (vms.stack_name, stamped
    // when the stack created it) — a stack teardown deletes only its members.
    string expected_stack = 3;
    // expected_created_at: the row must be this incarnation (vms.created_at,
    // exactly as recorded).
    string expected_created_at = 4;
    // force: destroy a running VM as part of the delete (lv rm --force), on the
    // VM's host and only after every check that can refuse the delete has
    // passed — so a refused delete leaves a running VM running. Run through the
    // same stop path as StopVM{force} (hooks, operator-stop record). Without it
    // a running VM is still destroyed by the delete itself, as before.
    bool force = 5;
}

// RepairVMOwner re-stamps a VM's ownership (host_name + running state) with a
// fresh timestamp on the host that actually runs it — the narrow, audited repair
// for an equal-timestamp LWW ownership split that a stationary VM can't self-heal
// (a bystander node holds a stale host_name at the same updated_at). Requires the
// vm.repair-owner permission on the VM's path (enforced before forwarding). It is
// forwarded to `host` and applied ONLY if that host positively confirms the VM is
// running locally; it rewrites only the VM's DB row (never touches the domain).
message RepairVMOwnerRequest  { string name = 1; string host = 2; }
message RepairVMOwnerResponse { string host = 1; string previous_host = 2; }

// CheckVMRuntime reports the responding host's LOCAL libvirt view of a VM and
// nothing else — it never consults or forwards through the cluster DB (the DB
// host_name is the disputed value being corroborated against ground truth).
// Peer-only (host-cert mTLS). `state` ∈ {absent, defined_stopped, running,
// unknown}. The runtime owner-assert reconciler queries this on every
// workload-capable peer (worker hosts that aren't fenced) before reclaiming a
// VM it runs locally.

// CheckVIPParticipant asks a peer whether it could HOLD or BECOME MASTER of a VIP: it
// renders a keepalived config whose virtual_ipaddress includes vip (a VRRP participant —
// master OR backup) OR the vip address is assigned on its kernel. This is the by-VIP
// ownership signal Phase 2 gates on; a kernel-address-only check would miss a BACKUP
// (holds no address yet can take over). Used for the fresh-claim absence proof and the
// removed-holder release verify. Peer-only (mTLS).
message CheckVIPParticipantRequest  { string vip = 1; }
message CheckVIPParticipantResponse { bool claims = 1; }

// RelayCheckVIPParticipant asks a REACHABLE peer to probe a THIRD host {target_host, vip}
// on the caller's behalf — for the fresh-VIP absence proof when the caller can't reach the
// target directly (e.g. a permanent directional network segmentation, but the relay can).
// The relay does a FRESH capability Ping + FRESH CheckVIPParticipant against the target and
// returns a tri-state; it decides NOTHING and keeps NO cache/durable proof. The caller
// accepts a NO_CLAIMS (absence) only from a quorum-visible reachable relay, and only for the
// current VIP proof check — every other outcome is fail-closed. Peer-only (mTLS).
enum RelayVIPResult {
    RELAY_VIP_UNKNOWN   = 0; // relay couldn't reach/verify the target → caller fails closed
    RELAY_VIP_CLAIMS    = 1; // target still renders a config for / holds the VIP
    RELAY_VIP_NO_CLAIMS = 2; // target provably does not claim the VIP
}
message RelayCheckVIPParticipantRequest  { string target_host = 1; string vip = 2; }
message RelayCheckVIPParticipantResponse { RelayVIPResult result = 1; }

// CheckLBPresent asks a peer whether it is a CONFIGURED PARTICIPANT for an LB — i.e. it
// has a rendered keepalived config or a running keepalived for lb_name. Like
// CheckVIPParticipant but keyed by LB NAME (used to resolve the true participant set for
// implicit/legacy hosts=[] LBs before a move). Peer-only (mTLS).
message CheckLBPresentRequest  { string lb_name = 1; }
message CheckLBPresentResponse {
    bool present = 1;
    // vrrp_unicast_serving: the answering host runs keepalived for this LB
    // from a unicast VRRP config, has not refused the LB's unicast
    // transport, and can hold the VIP: it still holds its source address on
    // the device it sends from, and the VIP's device is up with carrier. An
    // earlier build leaves it false. A host that cannot render the transport
    // stops its own keepalived only when a peer reports this.
    bool vrrp_unicast_serving = 2;
}

// CheckContainerRuntime is the container analogue of CheckVMRuntime: it reports
// the responding host's LOCAL LXC view of a container ({absent, defined_stopped,
// running, unknown}) and never consults the DB. Peer-only. The container runtime
// re-key reconciler queries it on every workload-capable peer before reclaiming a
// container it runs locally (a PK re-key, since container ownership is part of
// the primary key).

// GetRuntimeInventory returns the responding host's LOCAL ground-truth runtime view —
// the ONE runtime source every consumer reads: the dual-run detector, owner assertion,
// owner-epoch readiness, capacity sampling, and health evidence. It never consults the
// cluster DB (the DB is exactly the disputed value its callers corroborate against);
// database comparison is the caller's job. Peer-only (host-cert mTLS).
//
// An empty filter returns the full inventory. A (kind, name) filter returns just that
// workload's entry — the targeted form owner assertion uses, cheap enough to call per
// workload on every peer.
message GetRuntimeInventoryRequest {
    // Optional workload filter: kind "vm" | "container" plus the workload name.
    // Both empty = full inventory.
    string kind = 1;
    string name = 2;
    // containers_only, with kind "container" and a name, asks about that one
    // container alone: the host lists its containers and probes only that one,
    // and touches neither libvirt nor the VIPs nor any other container. The
    // answer's containers_complete then says whether its absence is proven, and
    // complete is false (the rest of the host was not looked at). On a host
    // whose lxc tooling probe fails, a container directory left on disk under
    // that name is reported, as a container in state defined_stopped with a
    // probe_error saying it cannot run there; so is such a directory on a host
    // with tooling whose lxc-ls does not list it (it holds no config). A
    // directory that cannot be stat'd leaves containers_complete false. A
    // previous build ignores the
    // field and answers with its full inventory filtered to the name.
    bool containers_only = 3;
}
// One workload as the local runtime actually sees it.
message RuntimeWorkload {
    string kind  = 1;               // "vm" | "container"
    string name  = 2;
    string state = 3;               // running | defined_stopped | absent | unknown
    // A VM domain in a disk-writing state (RUNNING or BLOCKED) — the signal the
    // dual-run detector groups on. Two hosts must never both be writing one disk.
    bool disk_holder = 4;
    // The runtime's own configured size — libvirt's current vcpu/memory for a VM,
    // cgroup limits for a container. NOT the database's opinion.
    int32 cpu        = 5;
    int32 memory_mib = 6;
    // The host-local owner-epoch marker: its value, and whether it could be read.
    // marker_status: valid | missing | corrupt | unreadable. A marker that cannot
    // be read is never epoch 0 — garbage read as the zero generation would
    // authorize exactly the stale actions the marker exists to refuse.
    int64  owner_epoch_marker = 7;
    string marker_status      = 8;
    // A container with no cpu AND no memory limit: it consumes unbounded host
    // resources that capacity accounting cannot attribute, so its presence makes
    // the host's capacity observation INCOMPLETE.
    bool uncapped = 9;
    // Per-item probe failure (state read failed, config unreadable). The item is
    // still listed — presence is real — but its details are unreliable.
    string probe_error = 10;
    // A container's on-disk owner record (the project it was stamped for), read
    // only for a containers_only ask. owner_status: "" not read (a previous
    // build, or not asked) | missing (no record: an earlier build made it) |
    // valid | unreadable. owner_project is set only when valid.
    string owner_project = 11;
    string owner_status  = 12;
    // owner_error is why owner_status is unreadable (the record's read error).
    string owner_error   = 13;
}
message RuntimeInventory {
    string host = 1;
    repeated RuntimeWorkload workloads = 2;
    // VIP addresses assigned on this host's KERNEL (bare IPs; not a keepalived-pid
    // signal — a VRRP backup renders config but holds no address).
    repeated string kernel_assigned_vips = 3;
    int32 unresolved_tie_count = 4;
    // complete is false when ANY local probe errored (libvirt list/state, container
    // list/state, LB-config read, the kernel `ip` dump, or a marker read). Positive
    // entries are still real, but ABSENCE is unreliable: a caller must never treat
    // an incomplete inventory as proof a workload is gone.
    bool complete = 5;
    repeated string errors = 6;
    string sampled_at = 7;          // RFC3339
    // Unresolved ties restricted to the tables that carry an owner epoch. A
    // subset of unresolved_tie_count, and the one an ownership reader cares
    // about: a contested lease term is an unresolved tie but is not evidence
    // about any workload's owner epoch. Absent from this message until v53,
    // which meant a peer with several ownership ties decoded as a clean one —
    // the fail-OPEN answer for a latch that never re-opens.
    int32 ownership_tie_count = 8;
    // containers_complete is true when the host's container listing succeeded
    // (or it runs no containers and holds no directory of the name asked), so a
    // container name absent from workloads is proven absent whatever the VM,
    // marker or VIP probes said. False from a previous build: complete is then
    // all there is.
    bool containers_complete = 9;
}

// OrphanProofRequest asks ONE host whether anything on it still claims an
// address candidate. The three identifiers are the components of the NetBox
// identity the sweeper is considering reclaiming; any of them may be empty,
// which simply drops that half of the question.
message OrphanProofRequest {
    string vm_uuid = 1;
    string mac     = 2;
    string address = 3;   // bare host form, no prefix length
}
// OrphanProofResponse is one host's answer. It is NEGATIVE evidence: complete
// is false when ANY probe errored (libvirt enumeration, a domain state or XML
// read, or a local row query), and an INCOMPLETE proof proves nothing — a
// caller must abort the reclamation rather than read absence into it. The
// holds_* flags are only ever positive statements and remain trustworthy.
message OrphanProofResponse {
    string host = 1;
    bool complete = 2;
    repeated string errors = 3;
    bool holds_uuid = 4;
    bool holds_mac = 5;
    bool holds_address = 6;
}

// MembershipHost is one `hosts` row a responder holds, reduced to what a
// membership proof reads: the identity, plus the role the proof's exclusions
// turn on.
//
// A TOMBSTONED row is included and is NOT marked as one. That is the contract:
// soft-deleting a host row does not power a machine off, so a tombstone names a
// candidate exactly like a live row and nothing downstream may branch on the
// difference. It is also why this is a message rather than a bare name — a
// caller that had only names could not apply the witness exclusion to a host it
// learned here, and re-deriving that exclusion from a second source is how two
// proofs come to differ.
message MembershipHost {
    string name = 1;
    // role as the row records it ("worker" or "witness"), empty when it records
    // none. Empty is NOT the statement that a host is a witness.
    string role = 2;
}

// MembershipViewResponse is one host's WHOLE candidate universe: every `hosts`
// row it holds INCLUDING TOMBSTONED ONES, plus the gossip members only its own
// memberlist can name. Gossip is the sole source that can name a host with no
// `hosts` row anywhere, so a proof that must not miss a claimant cannot be
// closed without it.
//
// It is deliberately UNFILTERED. The responder states what it knows and applies
// no eligibility rule of its own; the caller applies the proof's exclusions to
// every candidate itself, whichever source named it, so they exist at one site
// and cannot drift.
//
// complete is false when this node's own enumeration was not whole — its `hosts`
// read failed, or its table does not even carry its own row, which is an
// unhydrated database rather than a small cluster. An INCOMPLETE view is not
// evidence of absence: a caller must withhold rather than read a short list as
// this node's membership. gossip_members EXCLUDES the responder itself, exactly
// as memberlist membership does, and is legitimately empty on a node with no
// gossip layer.
message MembershipViewResponse {
    string host = 1;
    repeated MembershipHost hosts = 2;
    repeated string gossip_members = 3;
    bool complete = 4;
    repeated string errors = 5;
}

// RekeyBindingRequest re-stamps every NetBox object a bound network owns with
// the cluster's CURRENT fingerprint, then resumes the binding. It names the
// litevirt network rather than the prefix id because that is what an operator
// reading a suspension message has in hand.
message RekeyBindingRequest {
    string network = 1;
}

// ResumeBindingRequest lifts a suspension once the drift behind it has been
// repaired in NetBox. Unlike a re-key it rewrites nothing: it re-runs every
// bind-time check against the PINNED prefix facts and only clears the flag when
// all of them agree again. A prefix whose CIDR now differs from the one the
// binding recorded therefore stays suspended — re-CIDRing a bound prefix is not
// supported.
message ResumeBindingRequest {
    string network = 1;
}

// CloneVM creates a new VM from a template or an existing VM (optionally a
// snapshot of it). mode "" → storage-aware auto (linked on shared storage,
// full on local); "linked" / "full" force a mode. The clone gets a fresh
// identity (new MACs + regenerated cloud-init instance-id/hostname/SSH keys).
message CloneVMRequest {
    string source       = 1;  // template or VM name to clone from
    string target       = 2;  // new VM name
    string mode         = 3;  // "" (auto) | "linked" | "full"
    string snapshot     = 4;  // optional: clone from this snapshot of the source
    string project      = 5;  // tenancy bucket for the clone ("" → source's)
    // target_host is not used (an older design's placement pin); see
    // destination_host.
    string target_host  = 6;
    string ip           = 7;  // optional static IP for the clone's first NIC
    bool   start        = 8;  // start the clone after creation
    // target_pool: the storage pool, on the host the clone ends up on, that
    // holds the clone's disks. Empty means that host's default disk directory.
    string target_pool  = 9;
    // destination_host is the host the clone ends up on, as target_host was
    // meant to be: empty keeps it on the source's host. Field 6 stays
    // ignored, as it always was, so a client that sets it is not newly refused.
    string destination_host = 10;
}
message ConvertToTemplateRequest { string name = 1; bool revert = 2; }
message ExecVMRequest      { string name = 1; repeated string command = 2; }
message ExecVMResponse     { int32 exit_code = 1; bytes stdout = 2; bytes stderr = 3; }
message ConsoleInput       { bytes data = 1; }
message ConsoleOutput      { bytes data = 1; }
message SetVMIPRequest     { string name = 1; string ip = 2; string network_name = 3; }
message SetBootOrderRequest { string name = 1; string boot_order = 2; }
                             // boot_order: "disk" | "cdrom" | "network"
message RebuildVMRequest   { string name = 1; }
message CutoverVMRequest   { string vm_name = 1; }
// UpdateVMRequest reconfigures an existing VM. Fields split by apply-semantics:
//   - LIVE metadata (applied while running, no redefine): restart, onboot,
//     startup_order, start_delay_sec, stop_delay_sec. The reconciler/vmcheck read
//     these fresh each sweep.
//   - REDEFINE (require the VM stopped — they regenerate the domain XML):
//     cpu, memory_mib, cpu_mode, disable_vnc, machine, firmware, guest_agent,
//     min_memory_mib, max_memory_mib.
// Presence: int32/string scalars use 0/"" = unchanged; `optional` fields use
// nil = unchanged (so a real 0/false can be set); restart nil = unchanged and
// restart.condition=="none" clears the policy. Optional fields are additive and
// ignored by older daemons (forward-compatible in a mixed-version cluster).
message UpdateVMRequest    { string name = 1; int32 cpu = 2;
    int32 memory_mib = 3; bool disable_vnc = 4; string cpu_mode = 5;
    RestartPolicy restart = 6;
    optional bool  onboot          = 7;
    optional int32 startup_order   = 8;
    optional int32 start_delay_sec = 9;
    optional int32 stop_delay_sec  = 10;
    string         machine         = 11;
    string         firmware        = 12;
    optional bool  guest_agent     = 13;
    optional int32 min_memory_mib  = 14;
    optional int32 max_memory_mib  = 15;
    optional bool  secure_boot     = 16;
    optional bool  tpm             = 17;
    bool           force           = 18;  // allow toggling secure_boot/tpm even when firmware state exists
    string         idempotency_key = 19;  // cross-entry-node dedup of a retried update (D4 semantics)
    optional int32 max_cpu         = 20;  // set the vCPU hotplug ceiling (live_resize; latched)
    optional bool  allow_restart   = 21;  // permit a stop→redefine→start for a change that can't apply live
    string         cpu_model       = 23;  // CPU model for --cpu-mode custom; empty for any other mode
    // redefine_hardware regenerates the domain from the stored spec's disk and
    // NIC tuning (discard, detect_zeroes, queues) with no other change — the
    // compose reconfigure persists the tuning first, then sets this.
    bool           redefine_hardware = 30;
    // disk_tuning / nic_queues carry the discard, detect_zeroes and queue changes
    // themselves, so the OWNING host applies them to its own spec under the VM
    // lock and writes the spec only after the domain has them. Both imply
    // redefine_hardware.
    repeated DiskTuningUpdate disk_tuning = 31;
    repeated NICQueuesUpdate  nic_queues  = 32;
    // Noisy-neighbour limits: applied LIVE (config + running domain), no restart.
    optional double cpu_limit      = 24;  // cap in host cores; 0 clears the cap
    optional int32  cpu_shares     = 25;  // relative CPU weight; 0 restores the default
    repeated NICRateUpdate nic_rate = 26; // per-NIC bandwidth caps

    // allow_overcommit skips HOST capacity admission for a --restart-if-needed
    // reconfigure that GROWS the VM (project quota still applies). Audited.
    bool allow_overcommit = 22;

    // usb_devices replaces the VM's USB passthrough list when set_usb_devices is
    // true (an empty list with set_usb_devices clears it). A redefine-class
    // change: the VM must be stopped, or pass allow_restart.
    repeated USBDeviceSpec usb_devices = 40;
    bool set_usb_devices = 41;
    // memory_hotplug_max_mib sets the virtio-mem hot-add ceiling (0 turns
    // hot-add off). Redefine-class, like usb_devices.
    optional int32 memory_hotplug_max_mib = 42;
    // nic_mtu sets each listed NIC's MTU (NetworkAttachment.mtu). It takes
    // effect on the next define, like nic_queues.
    repeated NICMTUUpdate nic_mtu = 27;
    // nic_by_list_position: the ordinal of every nic_queues, nic_rate and
    // nic_mtu update names the NIC at that position in the VM's NIC list, not
    // the entry at that position in its stored spec. lv update sets it. Unset
    // (an older client, a stack deploy) every ordinal is a spec index, as it
    // always was. An entry node forwards it only to an owner whose Ping
    // advertises nic_list_position; for an older owner it translates each
    // position to the spec index, or refuses where it cannot.
    bool nic_by_list_position = 43;
}
// DiskTuningUpdate changes one disk's discard / detect_zeroes (an empty value
// leaves it as stored).
message DiskTuningUpdate { string name = 1; string discard = 2; string detect_zeroes = 3; }
// The NIC of a NICQueuesUpdate, NICRateUpdate or NICMTUUpdate is named by
// ordinal: the index of its entry in the VM's stored spec, or, with
// UpdateVMRequest.nic_by_list_position, its 0-based position in the VM's NIC
// list (the VM's live NICs in ordinal order, as `lv inspect` lists them under
// spec.network). Neither is the NIC's ordinal, which is never reused: a NIC
// detached and attached again takes a new one. By position, the owner finds
// the NIC's spec entry by its MAC (an entry that records no MAC, by the NIC's
// ordinal), and a position past the end of the list names the spec entry at
// that index when no live NIC carries it.
//
// NICQueuesUpdate changes one NIC's virtio-net queue count (1 turns
// multiqueue off).
message NICQueuesUpdate  { int32 ordinal = 1; int32 queues = 2; }
// NICRateUpdate sets (or, at 0, clears) one NIC's bandwidth cap in MB/s.
message NICRateUpdate { int32 ordinal = 1; double rate_mb_sec = 2; }
// NICMTUUpdate sets one NIC's MTU: 0 removes it, 1 means the bridge's MTU.
message NICMTUUpdate { int32 ordinal = 1; int32 mtu = 2; }
// SetVMMemory (#4) sets the running balloon target (and persists it). target_mib
// must be within [min_memory_mib, max_memory_mib] of the VM's spec; a live VM is
// ballooned via virtio without a redefine.
message SetVMMemoryRequest  { string name = 1; int32 target_mib = 2;
    string idempotency_key = 3; }  // cross-entry-node dedup of a retried balloon (D4 semantics)
// SetVMLabelsRequest replaces the full label set (the request is authoritative —
// an empty map clears all tags).
message SetVMLabelsRequest  { string name = 1; map<string, string> labels = 2; }
// PatchVMSpecRequest names fields of desired to write onto a VM's stored spec.
// Peer only: a deploy that entered on another host forwards its spec patch to
// the VM's owner, so every edit of one VM's spec is made on one host.
message PatchVMSpecRequest {
    string name = 1;
    VMSpec desired = 2;
    // fields: the compose live-metadata field names, plus "cpu" and "memory"
    // for a size a live resize already applied.
    repeated string fields = 3;
}
message ResizeDiskRequest  { string vm_name = 1; string disk_name = 2;
    string size = 3; }  // size: new total size e.g. "40G"

// SetDiskIO replaces one disk's I/O throttle. A running VM is throttled live
// and the persistent definition updated; the limits are stored in the VM's spec
// so a restart, redefine or migration carries them. An empty limits message
// clears every limit.
message SetDiskIORequest { string vm_name = 1; string disk_name = 2;
    DiskIOLimits limits = 3; }

// ── VNC Proxy ──
message VNCData { bytes data = 1; }

// ── Stacks ──
message DeployStackRequest { string compose_yaml = 1; string target_vm = 2;
    int32 scale_override = 3; string scale_vm = 4; bool dry_run = 5;
    string expected_hash = 6;
    // allow_weaken lets the deploy restore a NIC's declared security groups,
    // or a declared guard that is looser than the one enforced now, over a
    // runtime change (lv sg bind, lv firewall nic-guard set). Without it such
    // a restore is withheld and reported. Default false: an older client
    // never weakens.
    bool allow_weaken = 7; }
message DeployProgress     { string phase = 1; string vm_name = 2;
    string host_name = 3; float progress_pct = 4;
    string detail = 5; string error = 6; }
message DeleteStackRequest { string name = 1; bool keep_disks = 2; }
message DeleteProgress     { string vm_name = 1; string status = 2; string error = 3; }
message ListStacksResponse { repeated StackSummary stacks = 1; }
message StackSummary       { string name = 1; string state = 2; int32 vm_count = 3;
    int32 running = 4; int32 stopped = 5; int32 error = 6;
    google.protobuf.Timestamp created_at = 7; }
message DiffStackRequest    { string compose_yaml = 1;
    // allow_weaken plans as DeployStackRequest.allow_weaken would.
    bool allow_weaken = 2; }
message DiffStackResponse   { repeated DiffEntry entries = 1; }
message DiffEntry           { string vm_name = 1; DiffOp operation = 2; string detail = 3; }
message ExportStackRequest  { string name = 1; }
message ExportStackResponse { string name = 1; string compose_yaml = 2; string compose_hash = 3; }

// ── Migration ──
message MigrateVMRequest { string vm_name = 1; string target_host = 2;
    MigrateStrategy strategy = 3; bool with_storage = 4;
    // expect_drain_record makes the migration conditional on a drain record:
    // the host that OWNS the VM when it runs must be expect_host, at owner
    // epoch expect_owner_epoch, and its own replica must still hold a live
    // drain record naming it and target_host (the host the drain moved the VM
    // off). Failback sets it, so the check is made by the owner under the VM's
    // lock, not by the daemon that decided on a replica that may lag. Any
    // difference refuses with FailedPrecondition and moves nothing.
    bool   expect_drain_record = 5;
    string expect_host         = 6;
    int64  expect_owner_epoch  = 7;
    // expect_placement_gen is the VM's placement generation the drain recorded.
    // Every change of the VM's host advances it in the same batch, so the owner,
    // which cannot own the VM without having the generation of the move that
    // made it the owner, compares its own current value: any placement change
    // since the drain, however the record travelled, refuses the move.
    int64  expect_placement_gen = 8; }
message MigrateProgress  { MigratePhase phase = 1; float memory_pct = 2;
    float disk_pct = 3; int64 memory_remaining = 4; int64 disk_remaining = 5;
    string status = 6; int64 downtime_ms = 7; string error = 8;
    int64 duration_ms = 9; int64 setup_ms = 10; int64 transfer_ms = 11; }

// ── Storage motion ──
//
// MoveVolume copies a VM's disk from one storage pool to another and
// hot-swaps the libvirt source so the VM keeps running. Cross-host
// moves are NOT in scope here — use MigrateVM(with_storage=true) for
// that. MoveVolume is same-host, pool-to-pool.
message MoveVolumeRequest {
    string vm_name      = 1;
    // disk_name targets one logical disk on the VM (e.g. "root", "data").
    string disk_name    = 2;
    // target_pool is the destination pool name as it appears in the
    // host config / compose volumes block.
    string target_pool  = 3;
    // delete_source removes the original after a successful cutover.
    // Default false so an operator can manually verify before reaping.
    bool   delete_source = 4;
}
message MoveVolumeProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        COPY          = 1;  // streaming bytes from old to new path
        MIRROR        = 2;  // libvirt blockdev-mirror in flight
        CUTOVER       = 3;  // brief pivot to the new disk
        CLEANUP       = 4;  // optional source delete
        DONE          = 5;
    }
    Phase  phase            = 1;
    float  copy_pct         = 2;  // 0..100
    int64  bytes_copied     = 3;
    int64  bytes_total      = 4;
    string status           = 5;  // human-readable
    string error            = 6;
}

// ReplicateVolume copies a VM disk into a target pool WITHOUT cutting
// over the VM. The VM keeps using its source pool; the target receives
// a point-in-time snapshot suitable for DR / off-site replication.
//
// Semantically:
//   1. Quiesce / snapshot the source disk (best-effort for file-based
//      pools, atomic for ZFS/RBD when those backends land).
//   2. Stream the snapshot bytes to the target pool.
//   3. Optionally schedule periodic incremental syncs.
//
// First cut: full-copy only, file-based pools, VM may be running but
// the snapshot consistency depends on whether the guest agent flushes.
message ReplicateVolumeRequest {
    string vm_name      = 1;
    string disk_name    = 2;
    string target_pool  = 3;
    // target_path names the destination file instead of the daemon-derived
    // "<vm>-<disk>-copy-<time>-<id>.qcow2". Admin only, and never an existing
    // file.
    string target_path  = 4;
}
message ReplicateVolumeProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        SNAPSHOT      = 1;
        COPY          = 2;
        DONE          = 3;
    }
    Phase  phase        = 1;
    float  copy_pct     = 2;
    int64  bytes_copied = 3;
    int64  bytes_total  = 4;
    string status       = 5;
    string error        = 6;
    string target_path  = 7;  // populated when DONE
}

// MigrateStackVolumes moves every disk of every VM in a stack to a
// different storage pool. It is an orchestration layer over MoveVolume:
// it enumerates the stack's VMs, resolves a per-disk target pool, runs a
// preflight, then rolls the moves out one VM at a time (default) so a
// stateful service (e.g. a postgres cluster) keeps serving. Each per-disk
// move uses the same online (running VM → blockdev-mirror) / offline
// (stopped VM → qemu-img convert) machinery as MoveVolume, dispatched to
// the VM's owning host. File-based pools only (local/dir/nfs/btrfs).
message MigrateStackVolumesRequest {
    string stack_name   = 1;
    // default_pool applies to any disk not matched by a placement rule.
    string default_pool = 2;
    // placements override default_pool. Resolution is most-specific-wins:
    // a (vm_name, disk_name) rule beats a (vm_name) rule beats default_pool.
    repeated VolumePlacement placements = 3;
    // delete_source removes each original after its successful cutover.
    bool   delete_source = 4;
    // parallel bounds how many VMs migrate at once. 0 or 1 => rolling,
    // one VM at a time (preserves availability + bounds pool I/O).
    int32  parallel      = 5;
    // order optionally fixes the VM processing sequence (e.g. replicas
    // before primary). Must be a subset of the stack's VMs; unlisted VMs
    // run after, in default order.
    repeated string order = 6;
    // dry_run resolves + preflights the plan and streams it back without
    // moving any data.
    bool   dry_run       = 7;
    // health_wait_seconds caps the inter-VM health gate. 0 => default.
    uint32 health_wait_seconds = 8;
}
message VolumePlacement {
    string vm_name     = 1;  // required
    string disk_name   = 2;  // empty => all disks of vm_name
    string target_pool = 3;  // required
}
message StackVolumeProgress {
    string vm_name   = 1;
    string disk_name = 2;
    string host_name = 3;
    enum Stage {
        PLANNING    = 0;  // dry-run / preflight plan line
        PER_DISK    = 1;  // a disk move is in flight (see phase/copy_pct)
        HEALTH_GATE = 2;  // waiting for the VM to be healthy before next
        VM_DONE     = 3;  // all of this VM's disks migrated
        COMPLETE    = 4;  // whole stack finished (terminal summary)
        SKIPPED     = 5;  // disk already on target / nothing to do
        ERROR       = 6;
    }
    Stage  stage        = 4;
    // phase mirrors the inner MoveVolumeProgress.Phase as a string
    // (COPY|MIRROR|CUTOVER|CLEANUP|DONE) while stage == PER_DISK.
    string phase        = 5;
    float  copy_pct     = 6;
    int64  bytes_copied = 7;
    int64  bytes_total  = 8;
    // rollout-level counters for an aggregate progress bar.
    int32  vms_total    = 9;
    int32  vms_done     = 10;
    string status       = 11;  // human-readable
    string error        = 12;
}

// ── Images ──
message PullImageRequest   { string name = 1; string source_url = 2;
    string format = 3; string checksum = 4; string target_host = 5; }
message PullProgress       { string host_name = 1; float progress_pct = 2;
    string status = 3; string error = 4; }
message ListImagesResponse { repeated Image images = 1; }
message DeleteImageRequest { string name = 1; string host_name = 2; }
message ImportImageRequest { string name = 1; string format = 2;
    bytes chunk = 3; bool final = 4; string checksum = 5; }
message ImportImageResponse { string name = 1; int64 size_bytes = 2;
    string checksum = 3; }
message PushImageRequest   { string name = 1; string target_host = 2; }
// PruneImagesRequest removes, on one host, the image-store files no disk there
// is built on. Each image's current file is kept, unless the image's catalog
// row is deleted (lv image rm): then its current file goes too, when nothing
// anywhere uses it. name empty: every image. host_name empty: the host serving
// the call. deleted_image: the caller has just deleted image name; the host
// waits (bounded) for its own catalog to show the delete before it decides.
// An older host ignores it and keeps the current file.
// version: one file of image name (its file name, its path, or the digest
// after '@'): only that file is judged, and it is removed although the store
// may be shared with other hosts — the operator asserts no other host's disk
// is built on it. Every other keep still applies. A host that honours it
// echoes it in the response's version; an older host does not (it would
// prune the whole image), so a caller probes with dry_run first.
message PruneImagesRequest { string name = 1; string host_name = 2; bool dry_run = 3;
    bool deleted_image = 4; string version = 5; }
// kept: each file the host kept, and why.
// removes_deleted_images: the host's build removes a deleted image's current
// file (false from an older build, which always keeps it).
// version: the request's version, when this build honoured it.
message PruneImagesResponse { string host_name = 1; repeated string removed = 2; int64 freed_bytes = 3;
    repeated KeptImageFile kept = 4; bool removes_deleted_images = 5; string version = 6; }
message KeptImageFile { string path = 1; string reason = 2; }
message RemoveImageRequest { string name = 1; }
// hosts: each host's outcome; failed: the hosts that could not be asked, and
// why (their files are kept; lv image prune removes them later).
message RemoveImageResponse { repeated PruneImagesResponse hosts = 1;
    repeated RemoveImageHostError failed = 2; }
message RemoveImageHostError { string host_name = 1; string error = 2; }
message PushImageProgress  { string status = 1; float progress_pct = 2;
    string error = 3; }
message BuildImageRequest  { string vm_name = 1; string image_name = 2; }
message BuildImageResponse { string name = 1; int64 size_bytes = 2; }

// ── Backup ──
message BackupVMRequest    { string vm_name = 1; }
message BackupChunk        { bytes data = 1; int64 total_bytes = 2;
    string checksum = 3; }
message RestoreVMRequest   { string name = 1; bytes chunk = 2;
    bool final = 3; int32 cpu = 4; int32 memory_mib = 5;
    string network = 6; }

// ── Import ──
// Client-streams a source artifact (OVA / OVF-dir tar / .vma / Proxmox bundle)
// in chunks (first frame carries the metadata fields); the server streams back
// unpack/convert/define progress. source_path/disk_map refer to files already
// staged on the DESTINATION host (skip upload); both are confined to a staging
// root unless the caller is admin.
message ImportVMRequest {
    string source_format = 1;            // auto|ova|ovf|proxmox|vma
    string name = 2;
    string target_host = 3;
    string target_pool = 4;
    string project = 5;
    map<string, string> net_map = 6;     // foreign-network -> bridge
    bool preserve_mac = 7;
    bool start = 8;
    bool inspect = 9;
    string source_path = 10;             // destination-host staged file/dir; else use chunk
    bytes chunk = 11;
    bool final = 12;
    map<string, string> disk_map = 13;   // e.g. scsi0=/staged/disk.qcow2 (Proxmox .conf)
    // spoof_guard: "" guards each imported NIC on a network with a subnet
    // (confined to it), "off" imports them unguarded (cluster-root network
    // authority).
    string spoof_guard = 14;
}
message ImportVMProgress {
    string phase = 1;                    // unpack|parse|convert|define|done
    float convert_pct = 2;
    string current_disk = 3;
    string mapped_spec_json = 4;         // populated on inspect + final
    repeated string warnings = 5;
    string error = 6;
}

// ── Snapshots ──
// with_memory (#3): also capture guest RAM/CPU state so a revert lands the
// running VM at the exact snapshot instant. Falls back to disk-only for a
// stopped VM.
message CreateSnapshotRequest  { string vm_name = 1; string name = 2; bool with_memory = 3; }
message ListSnapshotsRequest   { string vm_name = 1; }
message ListSnapshotsResponse  { repeated Snapshot snapshots = 1; }
message RestoreSnapshotRequest { string vm_name = 1; string snapshot_name = 2; }
message DeleteSnapshotRequest  { string vm_name = 1; string snapshot_name = 2; }

// ── Networks ──
message CreateNetworkRequest {
    string name       = 1;
    string type       = 2;  // bridge | vxlan | isolated | sriov
    string iface      = 3;  // bridge/interface name on host
    int32  vlan       = 4;
    int32  vni        = 5;
    string underlay   = 6;
    bool   learning   = 7;
    int32  port       = 8;
    string subnet     = 9;
    bool   dhcp       = 10;
    string pf         = 11; // SR-IOV physical function
    bool   spoof_check = 12;
    string project    = 13; // owning tenant; empty = global/shared (usable by all)
    int32  netbox_prefix_id = 14; // bind to a NetBox prefix; 0 = unbound
    // gateway: the network's router when it is not litevirt's own (an
    // upstream router on an external or VLAN bridge). reserved_addresses:
    // further infrastructure addresses. No guest NIC may claim either.
    string gateway = 15;
    repeated string reserved_addresses = 16;
}
message GetNetworkRequest      { string name = 1; }
message DeleteNetworkRequest   { string name = 1; bool force = 2; }
message ListNetworksResponse   { repeated NetworkInfo networks = 1; }
message NetworkInfo {
    string name       = 1;
    string stack_name = 2;
    string type       = 3;
    string iface      = 4;
    string subnet     = 5;
    string gateway    = 6;
    bool   dhcp       = 7;
    int32  vni        = 8;
    int32  vm_count   = 9;
    string project    = 10; // owning tenant; empty = global/shared
}

// ── Load Balancers ──

message ListLBResponse        { repeated LoadBalancer lbs = 1; }
message InspectLBRequest      { string name = 1; }
message DisableBackendRequest { string lb_name = 1; string backend = 2; }
message EnableBackendRequest  { string lb_name = 1; string backend = 2; }

// ApplyLBRequest tells a host to configure HAProxy + keepalived locally.
// Used for multi-host LB: the orchestrating host sends this to each LB peer.
message ApplyLBRequest {
    string lb_name     = 1;
    string vip         = 2; // e.g. "10.0.100.50/24"
    string algorithm   = 3;
    repeated LBBackend backends = 4; // resolved backend IPs
    repeated LBPort    ports    = 5;
    repeated string    hosts    = 6; // all designated LB hosts (for VRRP priority)
    // proof authorizes a gated LB apply / VIP takeover (split-brain hardening, v38);
    // nil pre-activation. The LB host validates it (dest==self, action==lb_apply) and
    // claims it single-use before applying.
    RuntimeActionProof proof = 7;
    // snat: whether this LB rewrites its network's guest egress to the VIP
    // (compose `snat:`). Absent — a caller on an earlier build — applies
    // SNAT, as every ApplyLB did before the field existed.
    optional bool snat = 8;
    // stack_name: the stack whose LB this is ("" for an explicit LB), so the
    // VIP goes on that stack's network when the LB's row has not replicated
    // here yet.
    string stack_name = 9;
    // A stack LB's health check and sticky sessions, which a forwarded apply
    // serves as the coordinator's own apply does (TLS and redirects travel in
    // ports). Absent — a caller on an earlier build — none, as before.
    LBHealthSpec health          = 10;
    bool         sticky_sessions = 11;
}

// RemoveLBRequest tells a host to tear down a local LB instance.
message RemoveLBRequest {
    string lb_name = 1;
}

message CreateLBRequest {
    string                      name         = 1;
    string                      vip          = 2;  // "10.0.100.50/24"
    string                      algorithm    = 3;  // roundrobin | leastconn | source
    repeated LBPort             ports        = 4;
    repeated string             hosts        = 5;  // hosts to run HAProxy+keepalived on
    repeated LBBackendAddress   backends     = 6;  // explicit backend addresses
    repeated string             vm_backends  = 7;  // VM names to resolve to IPs
    // snat: rewrite the guest egress of the host-isolated network the VIP is
    // placed on to the VIP (compose `snat:`). Default false: no outbound NAT.
    bool                        snat         = 8;
}

message UpdateLBRequest {
    string                      name              = 1;
    string                      vip               = 2;  // empty = no change
    string                      algorithm         = 3;  // empty = no change
    repeated LBPort             ports             = 4;  // empty = no change
    repeated string             hosts             = 5;  // empty = no change
    repeated LBBackendAddress   add_backends      = 6;
    repeated string             remove_backends   = 7;  // by name
    repeated string             add_vm_backends   = 8;
    repeated string             remove_vm_backends = 9;
    // snat: set the explicit LB's outbound NAT (CreateLBRequest.snat).
    // Absent = no change. A stack LB's comes from its compose file.
    optional bool               snat              = 10;
}

message DeleteLBRequest {
    string name = 1;
}

message LBStatsRequest {
    string name = 1;
}

message DrainBackendRequest {
    string lb_name = 1;
    string backend = 2;  // server name
}

message DrainBackendResponse {
    string status             = 1;  // "draining"
    int64  active_connections = 2;
}

// ── Users & Auth ──
message LoginRequest       {
    string username  = 1;
    string password  = 2;
    string realm     = 3;  // optional; defaults to "local"
    string totp_code = 4;  // optional second-factor; required if user has 2FA enrolled
    string user_agent= 5;  // captured for ListSessions display

    // OIDC code-flow callback fields. When `realm` names an OIDC realm,
    // the UI/CLI begins the flow with BeginOIDCLogin on THIS node, sends the
    // browser to its auth_url, receives a `code` on the flow's redirect, and
    // calls Login on the same node with these fields set. Username/Password
    // are unused for OIDC.
    string oidc_code         = 6;
    string oidc_state        = 7;
    // Optional; when set it must equal the redirect the flow began with (the
    // exchange always replays that one, never a caller-chosen URL).
    string oidc_redirect_uri = 8;
    // oidc_pending resumes an OIDC login that verified at the IdP and stopped
    // for litevirt's second factor (LoginResponse.oidc_pending): send it with
    // realm and totp_code instead of the spent code. Single-use per success,
    // node-local, valid for 5 minutes and 5 attempts.
    string oidc_pending      = 9;
    // oidc_binding: the secret BeginOIDCLoginResponse.binding returned to whoever
    // began the flow; required with oidc_code + oidc_state. Never in a URL.
    string oidc_binding      = 10;
    // client_address: the end client's address, recorded on the session
    // (ListSessions ip) and keying the login throttle. Honoured only from a
    // caller presenting a cluster HOST certificate over loopback — this node's
    // own web UI or REST gateway, which pass the browser's address (the HTTP
    // peer, or from a trusted_proxies peer the forwarded client). Any other
    // caller, the distributable lv-cli certificate included, is recorded by its
    // own address. An address that is not an IP literal is ignored.
    string client_address    = 11;
}
message LoginResponse      {
    string token         = 1;  // bearer; opaque session id (prefix "lvs_") on success
    string username      = 2;
    string role          = 3;
    string expires_at    = 4;  // RFC3339; hard expiry of the session
    bool   requires_2fa  = 5;  // if true, token is empty; client must re-call Login with totp_code
    // requires_2fa_enrollment: the login policy requires a second factor for
    // this realm and the account has none. token is an ENROLLMENT-ONLY session:
    // it can enroll a factor for its own account (EnrollTOTP, WebAuthn
    // registration), call Whoami and Logout, and nothing else. Enrolling ends
    // it; log in again with the new factor.
    bool   requires_2fa_enrollment = 6;
    // oidc_pending: set with requires_2fa on an OIDC login. The code is spent,
    // so the second factor is sent with this handle (LoginRequest.oidc_pending)
    // to the same node. It authenticates nothing on its own.
    string oidc_pending = 7;
}
message ListRealmsResponse { repeated string realms = 1; }

// BeginOIDCLogin starts an authorization-code + PKCE login on this node.
// client: "web" (default; the realm's redirect_url, the node's UI callback) or
// "cli" (the realm's cli_redirect_url, a loopback listener). The redirect is
// always the realm's configured one; a caller cannot name its own.
message BeginOIDCLoginRequest {
    string realm  = 1;  // "oidc:<name>"
    string client = 2;  // "web" | "cli"
    // client_address: the end client's address, for the per-address bound on
    // in-progress logins. Honoured only from a loopback caller (this node's
    // web UI or REST gateway); any other caller is bounded by its own address.
    string client_address = 3;
}
message BeginOIDCLoginResponse {
    string auth_url     = 1;  // send the user's browser here
    string state        = 2;  // single-use; the callback must carry it back
    string redirect_uri = 3;  // where the IdP will send the browser
    string expires_at   = 4;  // RFC3339; the flow is refused after this
    // binding: a per-flow secret that redeeming the flow (LoginRequest.oidc_binding)
    // must present. Keep it out of URLs and logs.
    string binding      = 5;
}
message CreateUserRequest  { string username = 1; string password = 2; string role = 3; }
message ListUsersResponse  { repeated User users = 1; }
// exact: match username as stored, byte for byte, instead of by normalized
// name — the way to remove one of two accounts that differ only in case or
// surrounding spaces, which every normalized lookup refuses (admin, audited).
// exact_id: with exact, the id of the one account to delete, as
// ListUserVariants reports it — an exact delete refuses without it.
message DeleteUserRequest  { string username = 1; bool exact = 2; string exact_id = 3; }
message MarkUserExternalRequest { string username = 1; }
// ListUserVariants lists every live account whose name normalizes like
// username (case and surrounding spaces), with what an operator needs to
// choose which one an exact delete removes. Admin only.
message ListUserVariantsRequest { string username = 1; }
message UserVariant {
    string id         = 1;  // stable id to pass as DeleteUserRequest.exact_id
    string username   = 2;  // as stored, byte for byte
    string created_at = 3;
    string role       = 4;
    string realm      = 5;
    string last_login = 6;  // newest session created_at, "" if none here
    int32  factors    = 7;
    int32  tokens     = 8;
}
message ListUserVariantsResponse { repeated UserVariant variants = 1; }
// ClearIdentityBindingRequest drops the directory identity an external-realm
// account is bound to, so its next login binds afresh (an entry re-created in
// the directory). Admin only, audited.
message ClearIdentityBindingRequest { string username = 1; string realm = 2; }
message WhoamiResponse     {
    string username = 1; string role = 2; string realm = 3; string expires_at = 4;
    // requires_2fa_enrollment: this is an enrollment-only session (see
    // LoginResponse.requires_2fa_enrollment).
    bool requires_2fa_enrollment = 5;
}
// SetUserAccountRequest changes an account's lifecycle. An unset field is left
// as it is, so disabling and setting an expiry from two places cannot undo each
// other. expires_at is RFC3339; "" clears the expiry (never expires).
message SetUserAccountRequest {
    string username = 1;
    optional bool   disabled   = 2;
    optional string expires_at = 3;
}
// LoginPolicy is the cluster-wide mandatory second-factor policy.
// require_2fa is "off" (no row, the default), "all", or a comma-separated list
// of realm names ("local,ldap:corp"). A value this build does not understand is
// reported as stored and enforced as "all".
message LoginPolicy {
    string          require_2fa      = 1;
    repeated string realms           = 2;  // the realms it covers; empty with all_realms=false = off
    bool            all_realms       = 3;
    string          set_by           = 4;
    string          updated_at       = 5;
    bool            settable         = 6;  // the login_policy release feature is available here
    int32           sessions_revoked = 7;  // SetLoginPolicy only: sessions ended in newly covered realms
    string          self_enroll_by   = 8;  // RFC3339; "" = enrollment needs an admin-issued code
    repeated string warnings         = 9;  // e.g. a covered realm that is not configured on this node
}
// SetLoginPolicyRequest: by default an enrollment-only session can enroll its
// first factor only with an admin-issued enrollment code (IssueEnrollmentCode).
// allow_self_enroll with enroll_by (RFC3339, in the future) lets it enroll
// without one until enroll_by; after it, a code is required again.
message SetLoginPolicyRequest { string require_2fa = 1; bool allow_self_enroll = 2; string enroll_by = 3; }
// IssueEnrollmentCode mints a single-use, short-lived code with which an
// enrollment-only session of username may enroll its first factor. Admin only.
// ttl_seconds 0 = one hour; at most 24 hours. The code is shown once and
// stored hashed.
message IssueEnrollmentCodeRequest  { string username = 1; int64 ttl_seconds = 2; }
// issued_on: the node the code is bound to; it can be used only through that
// node.
message IssueEnrollmentCodeResponse { string code = 1; string expires_at = 2; string issued_on = 3; }
// CheckPermissionsRequest names permission gates (see grpcapi permGates), not
// raw verbs, so the question cannot drift from the one the RPC asks.
message CheckPermissionsRequest  { repeated string gates = 1; }
// allowed maps every requested gate name to whether it admits the caller.
message CheckPermissionsResponse { map<string, bool> allowed = 1; }
// ChangePasswordRequest: username empty = the caller themselves; a non-empty
// username requires admin. old_password is verified for self-service changes.
message ChangePasswordRequest { string username = 1; string old_password = 2; string new_password = 3; }
// ResetAdminPasswordRequest is `lv user reset-admin` over the host's local root
// channel: loopback mTLS presenting THIS host's own certificate, and no bearer.
// The CLI mints the password and sends only its bcrypt hash, so the plaintext
// never leaves the process that writes the password file. os_user is the
// invoking account as the CLI reports it (SUDO_USER when set); it is recorded
// in the audit row as a claim, not as an authenticated identity.
// clear_two_factor also removes every second factor and recovery code of the
// admin account (`lv user reset-admin --clear-2fa`); refused until the
// login_policy release feature opens.
// username names the admin-role account to reset (`lv user reset-admin
// --user`); empty is "admin". It is how an operator gives an account the admin
// floor reinstated its first credential: the floor never brings back a deleted
// account's old password.
message ResetAdminPasswordRequest { string password_hash = 1; string os_user = 2; bool clear_two_factor = 3; string username = 4; }
// ResetAdminPasswordResponse names the account the daemon reset, as stored. A
// daemon that predates the field answers with an empty name: it reset "admin"
// whatever the request named, and the CLI says so. note, when set, is for the
// operator: the reset left something in place they must know about (a cut-off
// dated in the future it could not correct), and what clears it.
message ResetAdminPasswordResponse { string username = 1; string note = 2; }
message CreateTokenRequest {
    string username = 1;
    string name     = 2;
    string expires  = 3;
    // Optional path prefixes the token may operate under. Empty list = no
    // scoping (token inherits the user's full permissions). The path-based
    // RBAC engine then enforces verb permissions normally.
    repeated string scope_paths = 4;
}
message RevokeTokenRequest { string id = 1; }

// BindSecurityGroupsRequest replaces the SG names attached to one VM
// NIC. — runtime mutation without VM redeploy. The next
// reconciler tick on the owning host re-renders the firewall ruleset
// to match.

// ── Backup snapshots ──
//
// Repo location model: the daemon you call owns the repo. If the named VM lives
// on another host, that called daemon (the repo sink) has the owning daemon read
// the disk locally and streams the manifest back over peer mTLS — so no shared
// repo and no "re-run against the owning daemon" is needed (PR 4). A remote backup
// requires a configured logical repo name (an absolute repo_path is local-only).

message BackupSnapshotRequest {
    string vm_name   = 1;
    string disk_name = 2;  // empty = root disk
    string repo_path = 3;  // host-local directory (must be initialised)
    string timestamp = 4;  // RFC3339; empty = now
    // incremental requests a dirty-bitmap-driven push relative to the
    // most-recent manifest for (vm_name, disk_name) in repo_path. The
    // daemon resolves the parent manifest itself; callers don't pin it
    // explicitly so the chain can grow without operator bookkeeping.
    // When no parent exists OR when libvirt reports the bitmap is
    // unusable (e.g. lost across a daemon restart that wasn't paired
    // with a persisted bitmap), the daemon falls back to a full push
    // and surfaces the reason via BackupSnapshotProgress.status.
    bool   incremental = 5;
    // quiesce (#2) controls in-guest filesystem freeze for an application-
    // consistent backup: "auto" (default/empty) freezes via the guest agent
    // when the VM advertises one, else proceeds crash-consistent; "off" forces
    // crash-consistent. A freeze failure never fails an otherwise-good backup.
    string quiesce = 6;
    // sink_host (PR 4) is an INTERNAL field — clients do NOT set it. The repo-
    // owning "sink" daemon sets it (to its own hostname) when it forwards a remote
    // backup to the owning daemon, telling the owner to read the disk locally and
    // PushBackup-stream the manifest back to sink_host (resolved there as a logical
    // repo name). The owner accepts it only from that peer over mTLS (host-cert CN
    // == sink_host); a non-peer request that sets it is rejected. Leave empty.
    string sink_host = 7;
    // bwlimit_bytes_per_sec caps how fast this job reads the disk and, for a
    // remote backup, sends chunks to the sink. 0 = no job limit. The daemon
    // also applies the target repo's limit (daemon config backup_bwlimits);
    // the lower of the two wins. An older daemon ignores the field.
    int64 bwlimit_bytes_per_sec = 8;
}
message BackupSnapshotProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        SNAPSHOT      = 1;
        COPY          = 2;
        DONE          = 3;
    }
    Phase  phase           = 1;
    int64  bytes_processed = 2;
    int64  bytes_new       = 3;
    int32  chunks_total    = 4;
    int32  chunks_deduped  = 5;
    string status          = 6;
    string manifest_ts     = 7;  // populated on DONE
    string error           = 8;
    // bytes_read is the bytes actually read off the source disk. For an
    // incremental (or a sparse full) this is ≪ bytes_processed; the gap is
    // the read-I/O the dirty bitmap / allocation map saved.
    int64  bytes_read      = 9;
}

// ── Peer streaming backup transport (PR 4) ──
//
// RepoTarget identifies the DESTINATION repo a transfer writes into, resolved in
// the SERVER's own config — never an arbitrary caller-supplied path. Exactly one
// of repo_name / staging_token is set: repo_name is a configured logical repo;
// staging_token addresses a per-transfer internal staging repo at
// <DataDir>/restore-staging/<token>/ (created on demand, used by CT
// migrate/restore so the target never needs the source's repo over NFS).
message RepoTarget {
    string repo_name      = 1;
    string staging_token  = 2;
}

message HasChunksRequest {
    RepoTarget      target    = 1;
    repeated string chunk_ids = 2;  // bounded batch
}
message HasChunksResponse {
    repeated bool present = 1;  // aligned 1:1 with request chunk_ids
}

// PushBackupFrame is one frame of a PushBackup stream. The stream is: one header,
// then chunk sub-frames (a 4 MiB chunk spans multiple ≤1 MiB transport frames),
// then manifest sub-frames LAST. The receiver reassembles one chunk at a time,
// verifies its BLAKE3 == chunk_id before writing, and writes the manifest only
// after every chunk it references is confirmed present.
message PushBackupFrame {
    oneof frame {
        PushBackupHeader  header   = 1;
        PushChunkFrame    chunk    = 2;
        PushManifestFrame manifest = 3;
    }
}
message PushBackupHeader {
    RepoTarget target = 1;
}
message PushChunkFrame {
    string chunk_id   = 1;  // BLAKE3 hex of the PLAINTEXT chunk
    int64  total_size = 2;  // full plaintext size of this chunk (<= ChunkSize)
    int64  offset     = 3;  // byte offset of this sub-frame within the chunk
    bytes  data       = 4;  // sub-frame payload (transport-capped)
    bool   final      = 5;  // last sub-frame for this chunk_id
}
message PushManifestFrame {
    bytes data  = 1;  // manifest JSON, sub-framed
    bool  final = 2;  // last manifest sub-frame
}
message PushBackupResponse {
    int32 chunks_written = 1;
    int32 chunks_deduped = 2;
    int64 bytes_written  = 3;
}

// ListBackupFilesRequest names one backup (as RestoreFromBackup does) and a
// path in it: "/" lists the backup's volumes (filesystems the restore VM
// mounted: partitions, the whole disk, or "rootfs" of a container archive),
// "/<volume>/<dir>" lists a directory.
message ListBackupFilesRequest {
    string repo_path = 1;
    string name      = 2;  // VM or container name, as in the manifest
    string disk_name = 3;  // "root" for a VM's root disk, "rootfs" for a container
    string timestamp = 4;  // exact RFC3339
    string path      = 5;  // empty = "/"
}
message BackupFileEntry {
    string name        = 1;
    string type        = 2;  // file | dir | symlink | other
    int64  size        = 3;
    uint32 mode        = 4;  // permission bits
    int64  mtime_unix  = 5;
    string link_target = 6;  // a symlink's target, shown only; never followed
}
message ListBackupFilesResponse {
    string path                    = 1;
    repeated BackupFileEntry entries = 2;
    bool   truncated               = 3;  // more entries than one listing returns
    int32  skipped                 = 4;  // entries left out (invalid or non-UTF-8 names)
}
// RestoreBackupFilesRequest selects paths ("/<volume>/<path>") to extract.
// The answer is a tar archive streamed in chunks; nothing is written on the
// daemon's host.
message RestoreBackupFilesRequest {
    string repo_path = 1;
    string name      = 2;
    string disk_name = 3;
    string timestamp = 4;
    repeated string paths = 5;
    int64  max_bytes = 6;  // 0 = the daemon's limit; can only lower it
}
message RestoreBackupFilesChunk {
    bytes  data      = 1;  // the next bytes of the tar archive
    bool   done      = 2;  // last frame: the counts below are final
    int32  entries   = 3;
    int64  bytes     = 4;  // file bytes in the archive
    int32  skipped   = 5;  // entries refused (names, types, links)
    bool   truncated = 6;  // stopped at a size or entry limit
    string status    = 7;
}

message RestoreFromBackupRequest {
    string repo_path     = 1;
    string vm_name       = 2;  // manifest selector
    string disk_name     = 3;
    string timestamp     = 4;  // exact RFC3339 of manifest
    // target_path names the file to write, admin only, and never an existing
    // file. Empty: the daemon picks a fresh file under <data_dir>/disks and
    // reports it in the DONE frame.
    string target_path   = 5;
    // in_place restores over the disk the VM's own record names (vm_name,
    // disk_name). The VM must be in the backup's project, on this host and
    // stopped. Exclusive with target_path.
    bool   in_place      = 6;
}
message RestoreFromBackupProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        RESTORE       = 1;
        DONE          = 2;
    }
    Phase  phase         = 1;
    int64  bytes_written = 2;
    int32  chunks_done   = 3;
    int32  chunks_total  = 4;
    string status        = 5;
    string error         = 6;
    string target_path   = 7;  // the file written, on DONE
}

// ── Backup repository maintenance ──
//
// Verify, garbage-collect, prune and sync act on a repo the DAEMON you call
// holds. `repo` (and SyncBackupRepoRequest.destination) is a registered repo
// name — daemon config `backup_repos:` or a cluster-registered compose repo — or
// an absolute path, which only an admin may pass (resolveBackupRepoPath). Each
// RPC is checked at `/` with its own backup.* verb and writes one audit row.

message VerifyBackupRepoRequest {
    string repo = 1;
}
message VerifyBackupRepoResponse {
    int64           chunks_checked = 1;
    repeated string mismatched     = 2;  // chunk ids whose content disagrees with their id
    repeated string missing        = 3;  // chunk ids a manifest references that are absent
}

// SetBackupRepoCompression: only zstd is gated, so only zstd is asked for;
// turning compression off, or creating an uncompressed repo, needs no daemon.
message SetBackupRepoCompressionRequest {
    string repo        = 1;  // a registered repo name, or an absolute path (admin)
    string compression = 2;  // "zstd"
    bool   init        = 3;  // create the repo (it must not exist) instead of converting one
    bool   encrypted   = 4;  // with init: mark the new repo AES-256-GCM encrypted
}
message SetBackupRepoCompressionResponse {
    string path           = 1;
    string compression    = 2;
    int32  schema_version = 3;
    string host           = 4;  // the host whose disk now holds the repo
}
message GarbageCollectBackupRepoRequest {
    string repo = 1;
}
message GarbageCollectBackupRepoResponse {
    int64 manifests_scanned     = 1;
    int64 chunks_referenced     = 2;
    int64 chunks_on_disk        = 3;
    int64 chunks_deleted        = 4;
    int64 chunks_retained_young = 5;  // unreferenced, but inside the grace window
    int64 manifests_invalid     = 6;  // their chunks are retained
    int64 bytes_reclaimed       = 7;
}

// BackupRepoSnapshot is one manifest as a prune plan names it.
message BackupRepoSnapshot {
    string timestamp   = 1;
    string vm_name     = 2;
    string disk_name   = 3;
    int64  total_size  = 4;
    int32  chunk_count = 5;  // set by ListBackupRepoSnapshots
    string based_on    = 6;  // incremental parent timestamp; empty for a full snapshot
}

// ListBackupRepoSnapshots lists the snapshots in a repo the daemon holds. A
// repo holds every project's backups, so it is checked at `/` (verb
// backup.read, legacy floor viewer), and `repo` resolves exactly as for the
// maintenance RPCs: a registered name, or an absolute path only for an admin.
message ListBackupRepoSnapshotsRequest {
    string repo = 1;
}
message ListBackupRepoSnapshotsResponse {
    string                      encryption = 1;
    repeated BackupRepoSnapshot snapshots  = 2;
}

message PruneBackupRepoRequest {
    string repo         = 1;
    int32  keep_last    = 2;
    int32  keep_daily   = 3;
    int32  keep_weekly  = 4;
    int32  keep_monthly = 5;
    int32  keep_yearly  = 6;
    // false (the default) only plans: nothing is deleted and no audit row is
    // written. true deletes the manifests the plan drops.
    bool   apply        = 7;
}
message PruneBackupRepoResponse {
    repeated BackupRepoSnapshot keep    = 1;
    repeated BackupRepoSnapshot delete  = 2;
    bool                        applied = 3;
}

message SyncBackupRepoRequest {
    string source      = 1;
    string destination = 2;
}
message SyncBackupRepoResponse {
    int64 manifests_copied = 1;
    int64 chunks_copied    = 2;
    int64 chunks_skipped   = 3;  // already present at the destination
    int64 bytes_copied     = 4;
}

// ── Containers ──

message Container {
    string host_name    = 1;
    string name         = 2;
    string state        = 3;  // stopped | starting | running | stopping | error | unknown
    string image        = 4;  // origin reference (oci://… or alpine:3.19)
    int32  cpu_limit    = 5;
    int32  memory_mib   = 6;
    string created_at   = 7;
    string updated_at   = 8;
    RestartPolicy restart = 9;   // auto-restart policy (nil/condition="none" = never)
    string state_detail = 10;    // stop cause / intent, e.g. "operator-stop"
    string project      = 11;    // tenancy bucket (default "_default")
    // Security as recorded at create or convert. A container an earlier build
    // created records none, and is privileged with legacy confinement.
    bool privileged     = 12;
    string confinement  = 13;    // "default" | "legacy"
    int64 idmap_base    = 14;    // first host id of its range (unprivileged only)
    repeated ContainerMount  mounts  = 30;  // host bind mounts recorded at create
    repeated ContainerDevice devices = 31;  // host devices recorded at create
}

message ContainerNetwork {
    string name   = 1;  // unique within container (eth0, eth1, …)
    string bridge = 2;  // host bridge to attach to
    string ip     = 3;  // optional static IP
    string mac    = 4;  // optional fixed MAC
    // network_name names the litevirt-managed logical network this NIC attaches
    // to. When set (or when `bridge` resolves to exactly one known network) the
    // NIC is MANAGED: it gets a container_interfaces row, IPAM, DNS, and SG
    // enforcement. A bare `bridge` that resolves to no/many networks is a
    // legacy-unmanaged raw attachment (no managed state). (v35)
    string network_name = 5;
    repeated string security_groups = 6;  // SG names bound to this NIC (managed NICs only)
}

message CreateContainerRequest {
    string host_name = 1;
    string name      = 2;
    string template  = 3;  // "download" | path-to-rootfs
    string distro    = 4;  // for download template
    string release   = 5;
    string arch      = 6;
    int32  cpu       = 7;
    int32  memory_mib= 8;
    repeated ContainerNetwork networks = 9;
    map<string, string> labels = 10;
    string image     = 11;
    RestartPolicy restart = 12;  // auto-restart policy (nil/condition="none" = never)
    string project   = 13;       // tenancy bucket (default "_default")
    string on_host_failure = 14; // host-loss relocation policy: ''/'none' | 'image-recreate'
    string idempotency_key = 15; // same-entry-node retry key (see CreateVMRequest.idempotency_key)
    // privileged creates the container without a user namespace, as earlier
    // builds did. Admin only. The default is unprivileged: a range of its own.
    bool privileged = 16;
    // confinement is "default" (LXC's generated AppArmor profile without
    // nesting, its common seccomp policy and the standard capability drop
    // list) or "legacy" (the generated profile with nesting, as earlier
    // builds wrote; admin only). Empty means "default".
    string confinement = 17;
    // mounts bind-mounts host paths into the container and devices passes host
    // device nodes through (Proxmox mpN / devN). Both require the admin role,
    // and each host path must resolve, on the host, under a prefix that host's
    // containers.bind_mount_paths / containers.device_paths allows. Refused
    // until release_2026_11_v1 has latched (feature usb_mounts_memory).
    repeated ContainerMount  mounts  = 30;
    repeated ContainerDevice devices = 31;
}

// ContainerMount bind-mounts a host path into a container. Read-only unless
// read_write is set; nosuid and nodev always. The host path is resolved on the
// host (symlinks followed) and must stay under an allowed prefix, and it is
// checked again at every start.
message ContainerMount {
    string host_path      = 1;
    string container_path = 2;  // absolute path inside the container
    bool   read_write     = 3;
}

// ContainerDevice passes one host device node (character or block) into a
// container: the node is bind-mounted and the cgroup allows its major:minor.
message ContainerDevice {
    string host_path      = 1;  // e.g. /dev/ttyUSB0
    string container_path = 2;  // "" = the same path inside the container
}

// PrepareContainerTargetRequest is a migrate's preflight on the TARGET (peer
// only): before the source is stopped, the target ensures root's subordinate
// range covers the container's id range (LXC refuses to start it otherwise).
message PrepareContainerTargetRequest {
    int64 idmap_base = 1;
    int64 idmap_size = 2;
    // The container being migrated and its source host: its own recorded
    // range is the one requested, so only OTHER containers' ranges conflict.
    string name = 3;
    string source_host = 4;
}

// ConvertContainerRequest changes a STOPPED container's security settings in
// place (lv ct convert). unprivileged moves a privileged container into an id
// range of its own (or an unprivileged one into a fresh range); confinement
// sets "default" or "legacy" (admin only). An empty field keeps the setting.
message ConvertContainerRequest {
    string host_name = 1;
    string name = 2;
    bool unprivileged = 3;
    string confinement = 4;
    // set_host_access replaces the container's host bind mounts and device
    // nodes with mounts/devices (empty clears them): how an admin re-applies
    // what a restore did not carry. Adding any needs the admin role.
    bool set_host_access = 5;
    repeated ContainerMount  mounts  = 6;
    repeated ContainerDevice devices = 7;
}

message StartContainerRequest  { string host_name = 1; string name = 2; }
message StopContainerRequest {
    string host_name = 1;
    string name = 2;
    int32 timeout_sec = 3;
    // force lets the stop go ahead on a host in write quarantine, which cannot
    // record it on the container's row: the stop is first recorded in a local
    // marker on that host, then the container is stopped, and the host records
    // it on the row once the quarantine lifts. Without it such a stop is refused
    // (FailedPrecondition). Out of quarantine it changes nothing. A server older
    // than the field ignores it.
    bool force = 4;
}
message DeleteContainerRequest {
    string host_name = 1;
    string name = 2;
    // force deletes a running container (lxc-destroy -f stops it first).
    // Without it a running container is refused: stop it, then delete it.
    bool force = 3;
}

message ExecContainerRequest {
    string host_name = 1;
    string name      = 2;
    repeated string argv = 3;
}
message ExecContainerResponse {
    bytes stdout    = 1;
    bytes stderr    = 2;
    int32 exit_code = 3;
}

message ListContainersRequest  { string host_name = 1; // empty = every host
    int32 page_size = 2; string page_token = 3; } // keyset pagination (see ListVMsRequest)
message ListContainersResponse { repeated Container containers = 1; string next_page_token = 2; }

message PullOCIImageRequest {
    string host_name = 1;
    string image     = 2;  // OCI reference
    string dest      = 3;  // rootfs directory to extract into
    string tag       = 4;  // optional tag override
    // Inline registry credentials. Two uses: (a) the entry node writes the
    // RESOLVED credential here before forwarding so the running host can
    // authenticate (a forwarded peer runs under the daemon identity and cannot
    // resolve per-user creds itself); (b) ad-hoc `lv ct pull --username`. When
    // empty, the entry node resolves from stored credentials (per-user, then
    // global).
    string username = 5;
    string password = 6;
    // project owns the pulled library item (a bare dest): a non-admin may
    // create containers from it only in this project. Empty is "_default".
    string project = 7;
}

// BackupContainerRequest pushes a container's rootfs (and its LXC config) into a
// backup repo as a full, content-addressed manifest. Call the repo-owning daemon:
// if the container lives elsewhere, that daemon has the owning daemon archive
// locally and streams the manifest back over peer mTLS (PR 4) — no shared repo
// needed; an empty host_name is resolved by name.
message BackupContainerRequest {
    string name      = 1;
    string host_name = 2;  // empty = resolve by name
    string repo_path = 3;  // host-local directory (must be initialised)
    string timestamp = 4;  // RFC3339; empty = now
    // sink_host (PR 4): INTERNAL — clients do NOT set it. See
    // BackupSnapshotRequest.sink_host: the repo-owning sink daemon sets it when
    // forwarding to the owner, which accepts it only from that peer over mTLS
    // (CN == sink_host). Leave empty.
    string sink_host = 5;
    // bwlimit_bytes_per_sec: see BackupSnapshotRequest.bwlimit_bytes_per_sec.
    int64 bwlimit_bytes_per_sec = 6;
}

message BackupContainerProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        FREEZE        = 1;  // quiescing the container for a consistent read
        COPY          = 2;  // streaming rootfs chunks into the repo
        DONE          = 3;
    }
    Phase  phase           = 1;
    int64  bytes_processed = 2;
    int64  bytes_new       = 3;
    int32  chunks_total    = 4;
    int32  chunks_deduped  = 5;
    string status          = 6;
    string manifest_ts     = 7;  // populated on DONE
    string error           = 8;
}

// RestoreContainerRequest rebuilds a container from a manifest alone (the embedded
// spec + the archived rootfs/config), so it works even after the source is gone.
// Runs on the target host (where the container will live); host_name empty = the
// daemon you call. start brings it up after restore.
message RestoreContainerRequest {
    string repo_path = 1;
    string name      = 2;  // manifest selector
    string timestamp = 3;  // exact RFC3339 of manifest
    string host_name = 4;  // target host; empty = this daemon
    bool   start     = 5;  // start the container after restore
    // staging_token (PR 4): when set, the target resolves the repo as its OWN
    // internal per-transfer staging repo (<DataDir>/restore-staging/<token>/)
    // that the coordinator PushBackup-streamed the manifest into — so the target
    // never needs the source's repo over NFS. Empty = resolve repo_path normally.
    string staging_token = 6;
    // proof is the full single-use relocation proof for a coordinator-driven
    // restore-relocation (split-brain hardening, v38) — carried in-request so the
    // target validates + claims it without depending on proof-row gossip timing.
    // nil for an operator-driven restore.
    RuntimeActionProof proof = 7;
    // owner_id, restored_from_owner_id and restored_from_ts are the lineage of
    // the container a failover coordinator relocates, read from the row it
    // marked: the relocated container keeps them, not the lineage of the
    // backup it is rebuilt from. The target honours them only on a peer
    // relocation (a carried proof, or the relocation token over a peer cert);
    // any other restore ignores them. Empty (an older coordinator, or a row
    // with no owner_id) = the target reads the relocating row itself.
    string owner_id               = 8;
    string restored_from_owner_id = 9;
    string restored_from_ts       = 10;
    // source_create_spec is the moving container's create spec as the peer
    // that drives a move read it off the container's row: the cold migrate's
    // source (its own row) or the failover coordinator (the row it marked).
    // A peer move takes the container's NICs, host mounts and devices and
    // privilege from that row, never from the archive, and the target's own
    // replica need not have the row yet. Honoured only on a peer move (a
    // verified migrate-from, or a peer relocation); any other restore
    // ignores it. Empty (an earlier build, or a row with no spec) = the
    // target reads the row from its own replica.
    string source_create_spec = 11;
    // without_host_access restores the container without the host mounts and
    // devices its backup records (lv ct restore --without-host-access),
    // audited: the disaster-recovery way out while the release gate cannot
    // grant usb_mounts_memory (a host down for good, or in release
    // probation), since an admin's restore that keeps them refuses rather
    // than drop them. An admin re-applies them later with lv ct convert
    // --mount/--device. Honoured only on an operator restore; a peer move
    // ignores it.
    bool without_host_access = 12;
}

message RestoreContainerProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        RESTORE       = 1;  // materialising rootfs from chunks
        IMPORT        = 2;  // laying down the container + config
        DONE          = 3;
    }
    Phase  phase         = 1;
    int64  bytes_written = 2;
    int32  chunks_done   = 3;
    int32  chunks_total  = 4;
    string status        = 5;
    string error         = 6;
}

// MigrateContainerRequest cold-migrates a container to another host by reusing
// the backup→restore data path: the source archives the (stopped) container into
// repo_path locally, then STREAMS the manifest to the target over peer mTLS (into
// a per-transfer staging repo), so repo_path need only exist on the SOURCE. (An
// older target that predates peer streaming falls back to re-opening repo_path by
// name, which then must be reachable from both hosts.) No CRIU / live migration —
// the container is stopped for the transfer and restarted on the target if it was
// running.
message MigrateContainerRequest {
    string name        = 1;
    string source_host = 2;  // empty = resolve by name
    string target_host = 3;
    string repo_path   = 4;  // source-local staging repo (streamed to the target)
}

message MigrateContainerProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        VALIDATING    = 1;
        STOPPING      = 2;  // cold: stop the container before transfer
        ARCHIVING     = 3;  // push rootfs+config into the staging repo
        RESTORING     = 4;  // target rebuilds from the repo
        FINALIZING    = 5;  // re-key owner, remove source copy
        DONE          = 6;
        FAILED        = 7;
    }
    Phase  phase           = 1;
    int64  bytes_processed = 2;
    string status          = 3;
    string error           = 4;
}

// ── Container snapshots ──
// A point-in-time snapshot of a container (freeze+tar of its on-disk dir,
// stored host-local). The container analogue of Snapshot.
message ContainerSnapshot {
    string id         = 1;
    string ct_name    = 2;
    string host_name  = 3;
    string name       = 4;
    string state      = 5;
    int64  size_bytes = 6;
    string type       = 7;  // "tar" (COW variants later)
    string created_at = 8;
}

// ── Container inspect ──
// InspectContainer is the container analogue of InspectVM: one container's
// row plus what only its host knows (the LXC config's privilege mode, the
// rootfs and its size) and its snapshots and backup index entries.
message InspectContainerRequest {
    string name      = 1;
    string host_name = 2;  // disambiguates a name used on two hosts; empty = resolve
    // measure_rootfs walks the rootfs to report its size. Off by default: the
    // walk is bounded but costs I/O on the owner, so it runs only on request
    // (and a recent result is reused).
    bool   measure_rootfs = 3;
}

// One NIC as the container's host records it.
message ContainerInterfaceDetail {
    string name            = 1;  // eth0, eth1, …
    string network_name    = 2;  // managed logical network ("" = raw bridge)
    string bridge          = 3;
    string ip              = 4;
    string mac             = 5;
    string veth            = 6;
    repeated string security_groups = 7;
}

// One container_backups index entry. `available` is decided at read time on
// the container's host: false when the repo cannot be opened there (moved,
// unmounted or deleted). The entry is reported, never removed.
message ContainerBackupRef {
    string repo               = 1;
    int64  total_bytes        = 2;
    string updated_at         = 3;
    bool   available          = 4;
    string unavailable_reason = 5;
    // status: "available" (a host holds this container's backup in the repo),
    // "not_found" (every host answered and none holds one), "unknown" (some
    // host could not be asked), "foreign" (the repo holds backups of a
    // same-named container in another project), or "other_lineage" (it holds
    // backups of another container of this name in this project, which
    // failover will not restore). Only "available" entries are shown to a
    // caller without the admin role.
    string status             = 6;
    string location           = 7;  // host that holds the backup (status "available")
    string latest_timestamp   = 8;  // newest backup of this container in the repo
}

// ProbeContainerBackups is peer-only: InspectContainer asks each host whether
// it can open each repo (resolving a logical name in its own config) and
// whether the repo holds a backup of this container — same name, project and
// lineage (owner_id), read from the manifest's embedded spec.
message ProbeContainerBackupsRequest {
    string name    = 1;
    string project = 2;
    repeated string repos = 3;
    // owner_id is the container's lineage (its create spec's owner_id). A
    // manifest of the same project but another lineage is not this
    // container's: failover would not restore it. Empty (an older peer, or a
    // container from before owner ids) matches by project, as before.
    string owner_id = 4;
    // restored_from_owner_id / restored_from_ts: the parent lineage of a
    // restore that was given a new owner_id, and the backup it came from.
    // That lineage's manifests up to restored_from_ts are this container's
    // too. Empty (an older peer, or no parent) adds nothing.
    string restored_from_owner_id = 5;
    string restored_from_ts       = 6;
}
message ContainerBackupProbe {
    string repo             = 1;
    bool   opened           = 2;
    bool   attributed       = 3;  // a manifest of this name, project and lineage
    bool   foreign          = 4;  // manifests of this name, other projects only
    string latest_timestamp = 5;
    string detail           = 6;  // why it could not be opened (admin-facing)
    int64  latest_total_bytes = 7;  // size of the newest attributed manifest
    // unreadable: the repo exists here but could not be read (permissions, a
    // corrupt manifest of this name, the caller's deadline). Not evidence of
    // absence: the entry stays "unknown".
    bool   unreadable       = 8;
    // other_lineage: manifests of this name and project, but of another
    // container of the name (a deleted predecessor, or a copy restored beside
    // it). Failover will not restore them, so they are not attributed.
    bool   other_lineage    = 9;
}
message ProbeContainerBackupsResponse {
    repeated ContainerBackupProbe results = 1;
}

// ContainerReplica is one scheduled replica of a container, held in a backup
// repo's replica namespace on the replica host (docs/backups.md, "Container
// replication").
message ContainerReplica {
    string timestamp    = 1;
    // The host the replica was taken on, and that host's container row's
    // created_at: one segment of the container's history.
    string source       = 2;
    string incarnation  = 3;
    int64  owner_epoch  = 4;
    int64  total_size   = 5;
    // Set aside: superseded by a later replica that is not proven to contain
    // it. Kept, never promoted automatically, removed only by an operator.
    bool   set_aside        = 6;
    string set_aside_reason = 7;
    string stream       = 8;
    string owner_id     = 9;
    // The placement it was taken in (the source row's placement id; "" for a
    // row an earlier build wrote), and when it was captured (after the freeze;
    // the timestamp is only its name).
    string placement    = 10;
    string captured_at  = 11;
    // No schedule targets this host and repo for the container any more: the
    // replica is kept, never settled, and an operator may remove it.
    bool   orphaned     = 12;
}
message ListContainerReplicasRequest {
    string host    = 1; // the replica host ("" = the receiver)
    string repo    = 2; // the schedule's target repo on that host
    string project = 3;
    string name    = 4;
}
message ListContainerReplicasResponse {
    repeated ContainerReplica replicas = 1;
}
message RemoveContainerReplicasRequest {
    string host    = 1;
    string repo    = 2;
    string project = 3;
    string name    = 4;
    // The set-aside replicas to remove, by timestamp. A replica that is not
    // set aside is refused.
    repeated string timestamps = 5;
}
message RemoveContainerReplicasResponse {
    int32 removed = 1;
}
// Restore a replica as the container, stopped, on the host that holds it
// (admin). Refused while a live container of that name exists in the project:
// it would be a second runnable copy.
message RestoreContainerReplicaRequest {
    string host      = 1;
    string repo      = 2;
    string project   = 3;
    string name      = 4;
    string timestamp = 5;
}
message RestoreContainerReplicaResponse {
    string host = 1;
}

message ContainerDetail {
    Container container = 1;
    // privilege is "privileged" or "unprivileged", read from the container's
    // LXC config on its host (an lxc.idmap makes it unprivileged), or
    // "unknown" when the host could not be asked.
    string privilege     = 2;
    string template      = 3;   // create spec: template / distro / release / arch
    string distro        = 4;
    string release       = 5;
    string arch          = 6;
    bool   is_template   = 7;
    repeated ContainerInterfaceDetail interfaces = 8;
    string rootfs_path   = 9;
    int64  rootfs_bytes  = 10;  // -1 = not measured
    repeated ContainerSnapshot snapshots = 11;
    repeated ContainerBackupRef backups  = 12;
    // host_detail is false when the container's host could not be reached and
    // the host-local fields (privilege, rootfs, backup availability) are unknown.
    bool   host_detail   = 13;
    // stranded_rootfs are this container's own rootfs left on another host by
    // a relocation off it (condition ct_rootfs_stranded): the relocated copy
    // was recreated from its image or restored from a backup, and that data
    // is there. Nothing removes it automatically.
    repeated ContainerStrandedRootfs stranded_rootfs = 14;
}

message ContainerStrandedRootfs {
    string host     = 1;  // the host holding it
    string path     = 2;  // its rootfs there; "" until that host is back and has looked
    string since    = 3;  // RFC3339
    string how      = 4;  // image-recreate | backup-restore: how the container was relocated
    string moved_to = 5;
}

message SnapshotContainerRequest       { string name = 1; string host_name = 2; string snapshot = 3; }
message ListContainerSnapshotsRequest  { string name = 1; string host_name = 2; }
message ListContainerSnapshotsResponse { repeated ContainerSnapshot snapshots = 1; }
message RevertContainerSnapshotRequest { string name = 1; string host_name = 2; string snapshot = 3; }
message DeleteContainerSnapshotRequest { string name = 1; string host_name = 2; string snapshot = 3; }

// ── Container templates + clones (B4) ──
message ConvertContainerToTemplateRequest { string name = 1; string host_name = 2; bool revert = 3; }
message CloneContainerRequest {
    string source    = 1;
    string target    = 2;
    string host_name = 3;  // source's host; empty = resolve by name
    string project   = 4;  // clone's tenancy project; empty = source's
    bool   start     = 5;  // start the clone after creation
    // The entry node's ruling that the caller may not hold a privileged mode
    // or legacy confinement (not an admin): the clone lands unprivileged, in
    // an id range of its own with its files shifted, with default
    // confinement, and is audited. Set by the node the caller reached before
    // it forwards, since the source's host sees only the peer. Setting it
    // can only lower what the clone holds.
    bool   unprivileged = 6;
}

// FirewallStatus is the post-Reconcile snapshot the daemon hands back
// from ReloadFirewall.
message FirewallStatus {
    string host_name      = 1;
    int32  rules_total    = 2;  // every rule across cluster + host + sg + nic-extra tiers
    int32  nics_bound     = 3;  // count of NICs with at least one SG attached
    int32  security_groups= 4;  // count of distinct SGs visible to this host
    string last_error     = 5;  // empty when the last apply succeeded
    string last_applied_at= 6;  // RFC3339; empty if never
}

// NICGuard is one VM NIC's anti-spoofing policy.
message NICGuard {
    string          vm_name                    = 1;
    string          mac                        = 2;
    string          network_name               = 3;
    // mode: "on", "off", or "unset" — a NIC with no policy, which is
    // unguarded (every NIC created before guards existed).
    string          mode                       = 4;
    repeated string allowed_addresses          = 5;
    bool            allow_dhcp_server          = 6;
    bool            allow_router_advertisement = 7;
    bool            allow_vlan_tags            = 14;
    // For a container NIC: its host and name (vm_name is then empty).
    string          container_host             = 15;
    string          container_name             = 16;
    // note: why the guard cannot be enforced on this NIC, when it cannot
    // (a macvtap NIC bypasses the bridge).
    string          note                       = 17;
    // effective_ipv4 / effective_ipv6: the source addresses the guard lets
    // the NIC send from, as the owning host renders them. Empty with
    // ipv4_unrestricted / ipv6_unrestricted set means litevirt knows no
    // address space of that family for the NIC and leaves it open.
    repeated string effective_ipv4             = 8;
    repeated string effective_ipv6             = 9;
    bool            ipv4_unrestricted          = 10;
    bool            ipv6_unrestricted          = 11;
    string          set_by                     = 12;
    string          updated_at                 = 13;
}

message SetNICGuardRequest {
    string          vm_name                    = 1;
    // The NIC: by mac, or by network_name when the VM has one NIC on it.
    string          mac                        = 2;
    string          network_name               = 3;
    string          mode                       = 4;  // "on" | "off"
    repeated string allowed_addresses          = 5;  // replaces the list
    bool            allow_dhcp_server          = 6;
    bool            allow_router_advertisement = 7;
    bool            allow_vlan_tags            = 8;
    // For a container NIC, name it here instead of vm_name.
    string          container_host             = 9;
    string          container_name             = 10;
}

message GetFirewallEnforcementRequest {
    bool local_only = 1;  // this host only (a peer's fan-out leg)
}

message SetFirewallEnforcementRequest {
    string mode = 1;  // "enforce" | "observe"
}

message FirewallEnforcementStatus {
    string mode       = 1;  // the replicated policy: enforce | observe
    string set_by     = 2;
    string updated_at = 3;
    repeated FirewallHostEnforcement hosts = 4;
}

message FirewallHostEnforcement {
    string host_name    = 1;
    // applied_mode: what the host has in force: enforce | observe |
    // guards-only (bridge conntrack unavailable) | "" (no guest NIC).
    string applied_mode = 2;
    string error        = 3;
    // would_drops: what the per-NIC rules would have dropped, totalled per
    // workload, NIC, side and rule since would_drop_since (RFC 3339) — across
    // table reloads and daemon restarts, until `lv firewall enforce
    // reset-counters`.
    repeated FirewallWouldDrop would_drops = 4;
    string would_drop_since = 5;
}

message FirewallWouldDrop {
    string device   = 1;  // the tap or veth it is on now; "" when not on this host now
    string workload = 2;
    string side     = 3;  // in | out | state | vlan
    string rule     = 4;
    uint64 packets  = 5;
    uint64 bytes    = 6;
    string mac      = 7;
}

message ResetFirewallWouldDropsRequest {
    bool local_only = 1;  // this host only (a peer's fan-out leg)
}

// ArmNICFirewallRequest asks a host to put a VM's per-NIC firewall — its NIC
// guards above all — in force before the VM runs there (a migration target,
// before the guest is handed over). Peer only.
message ArmNICFirewallRequest {
    string vm_name = 1;
    // resume: the guest arrived paused (its taps are named only at start);
    // put its NIC firewall in force under them, then let it run.
    bool   resume  = 2;
    // paused_handover: the guest will arrive paused for its guards (the
    // arming before a move). The target records, on its own disk, that it
    // holds the guest for them, and lets it run once they are in force even
    // if the source's resume never arrives. An older target ignores it.
    bool   paused_handover = 3;
    // handover_uncommitted: the guest the target holds for a paused hand-over
    // arrived, but the source could not commit the move's ownership (the VM's
    // row still names the source). The target keeps it paused and says so in
    // firewall.nic.held. Nothing is armed or resumed. An older target ignores
    // it.
    bool   handover_uncommitted = 4;
}

// ResumeHeldVMRequest asks the VM's host to let a guest it holds paused for
// its NIC guards run: it puts the guards in force first, and refuses while
// they cannot be (`lv firewall nic-guard resume`).
message ResumeHeldVMRequest {
    string vm_name = 1;
}

// SetNetworkGuardConfigRequest changes what a network keeps from its NICs:
// its router, reserved addresses and the trunk VLANs it allows. Each set_*
// says the field is being set (an empty value clears it). network.update.
message SetNetworkGuardConfigRequest {
    string          name                   = 1;
    bool            set_gateway            = 2;
    string          gateway                = 3;
    bool            set_reserved_addresses = 4;
    repeated string reserved_addresses     = 5;
    bool            set_allowed_vlans      = 6;
    repeated int32  allowed_vlans          = 7;
}

message ListNICGuardsRequest {
    string vm_name = 1;  // empty = every VM
}

message ListNICGuardsResponse {
    repeated NICGuard guards = 1;
}

message BindSecurityGroupsRequest {
    string vm_name        = 1;
    string network_name   = 2;  // matches vm_interfaces.network_name
    repeated string security_groups = 3;
}

message Session {
    // id: a display HANDLE, the first 12 characters of the session id — never
    // the session id itself, which is the bearer secret (lvs_<id>). It is what
    // RevokeSession takes. A daemon older than this field returned the full id.
    string id           = 1;
    string username     = 2;
    string realm        = 3;
    string ip           = 4;
    string user_agent   = 5;
    string created_at   = 6;
    string last_used_at = 7;
    string expires_at   = 8;
    // current: this is the session the request was made with. Set by the
    // daemon, so a client never compares its own bearer with a listed id.
    bool   current      = 9;
}
message ListSessionsRequest  { string username = 1; }  // empty = caller's own
message ListSessionsResponse { repeated Session sessions = 1; }
// id: the full session id, or an unambiguous prefix of at least 8 characters
// (a ListSessions handle). A prefix resolves only among the sessions the caller
// may revoke: its own, or anyone's for an admin.
message RevokeSessionRequest { string id = 1; }

// 2FA enrollment & management.
message TwoFactor {
    string method       = 1;  // "totp" | "webauthn"
    string label        = 2;
    string enrolled_at  = 3;
    string last_used_at = 4;
}
message ListTwoFactorsRequest  { string username = 1; }  // empty = caller's own
message ListTwoFactorsResponse { repeated TwoFactor factors = 1; }
// enrollment_code: required from an enrollment-only session unless the
// policy's self-enrollment window is open (IssueEnrollmentCode).
message EnrollTOTPRequest      { string username = 1; string label = 2; string enrollment_code = 3; }
message EnrollTOTPResponse {
    string otpauth_url    = 1;  // for QR code rendering
    string secret_base32  = 2;  // for manual entry
    repeated string recovery_codes = 3; // shown once; user must save them
    // session_ended: the call came from an enrollment-only session, which the
    // enrollment ended. Log in again with the new factor.
    bool session_ended = 4;
}
message DisableTwoFactorRequest { string username = 1; string method = 2; string label = 3; }

// Role binding management. The path-based RBAC engine
// (`internal/auth/permissions.go`) reads role_bindings to decide what
// every authenticated caller can do. Principals are `user:<name>` or
// `group:<group>@<realm>`. Paths are RBAC scopes like `/` (cluster
// root), `/projects/acme`, `/projects/acme/vms/web-1`. Propagate=true
// means the binding applies to the path AND every descendant scope.
message RoleBinding {
    string id         = 1;
    string path       = 2;
    string role       = 3;
    string principal  = 4;
    bool   propagate  = 5;
    string updated_at = 6;
}
message GrantRoleRequest {
    string path       = 1;
    string role       = 2;
    string principal  = 3;
    bool   propagate  = 4;
    // refuse_inert_principal: refuse (FailedPrecondition) a grant that would
    // be stored as a bare user:<name> principal. No caller is ever matched as
    // a bare user principal (callers are user:<name>@<realm>), so such a
    // binding grants nothing. Without it a bare principal is stored verbatim
    // while auth.rbac_realm is off (legacy behavior); with auth.rbac_realm on
    // the realm grammar already rejects or resolves it.
    bool   refuse_inert_principal = 5;
}
message GrantRoleResponse { RoleBinding binding = 1; }

message RevokeRoleRequest { string id = 1; }
message RevokeRoleResponse {}

message ListRoleBindingsRequest  { string principal = 1; } // empty = all
message ListRoleBindingsResponse { repeated RoleBinding bindings = 1; }

// NormalizeRoleBindings rewrites legacy bare `user:<name>` bindings to the
// canonical realm-qualified form (`user:<name>@<realm>`) so they enforce. It is
// a deliberate, idempotent one-time admin job — run once after auth.rbac_realm
// is enabled fleet-wide and the rbac_realm_v1 capability has latched.
message NormalizeRoleBindingsRequest {
    bool dry_run = 1; // when true, report what WOULD change without writing
}
message NormalizeRoleBindingsResponse {
    int32 normalized = 1; // bare bindings rewritten to canonical form
    int32 skipped    = 2; // bare bindings whose realm could not be resolved
}

// GetVMOperation / AbortVMOperation are the F1 admin recovery surface for an
// operation wedged on a VM's mutation barrier (active_operation_id). Inspect
// shows the operation + reduced state; abort force-clears the barrier via the
// owner/generation CAS so the VM is mutable again (deliberate, admin-only).
message GetVMOperationRequest { string vm_name = 1; }
message OperationStepInfo {
    string step_name  = 1;
    int64  owner_epoch = 2;
    string created_at = 3;
}
message GetVMOperationResponse {
    bool   has_active      = 1;
    string operation_id    = 2;
    string operation_kind  = 3;
    string current_state   = 4;
    bool   faulted         = 5; // conflicting terminals recorded — a safety fault
    int64  vm_owner_epoch  = 6;
    int64  spec_generation = 7;
    bool   header_missing  = 8; // barrier points at a GC'd/absent operation header
    repeated OperationStepInfo steps = 9;
}
message AbortVMOperationRequest {
    string vm_name = 1;
    bool   force   = 2; // required — an abort is never implicit
    // operation_id, when set, scopes the abort: it is refused unless the VM's
    // active operation is exactly this one. Empty aborts whatever is active.
    string operation_id = 3;
}
message AbortVMOperationResponse {
    bool   aborted               = 1;
    string previous_operation_id = 2;
    string detail                = 3;
}

// ReleaseHostReservation releases a host capacity reservation whose operation
// is no longer running (admin; see docs/diagnostics.md, "Host reservations").
message ReleaseHostReservationRequest {
    string operation_id = 1;
    bool   force        = 2; // required — a release is never implicit
}
message ReleaseHostReservationResponse {
    bool   released   = 1; // false with detail "already released" is idempotent success
    string host       = 2; // the target host that released it
    string vm         = 3; // empty when the caller may not vm.read it
    int32  vcpu       = 4;
    int32  memory_mib = 5;
    string detail     = 6;
}

// Live restore from backup. The handler:
//
//   1. Opens the manifest's chunk reader.
//   2. Spawns a localhost NBD server backed by the reader.
//   3. Creates target_path as a qcow2 with backing_file pointing at the
//      NBD URL.
//   4. Streams STARTING_NBD → READY frames and keeps the NBD server
//      alive until the operator's stream closes.
//
// The operator (or a higher-level orchestrator) then runs the existing
// CreateVM / StartVM path against target_path. Reads that can't be
// satisfied from target_path fall through to the NBD source, so the
// VM boots in seconds and data migrates on-demand. Once the operator
// runs `virsh blockpull` (or its `lv` wrapper) the disk is fully
// local and the stream can be closed.
//
// Auto-define-and-start (opt-in via auto_start): when set, the daemon
// reconstructs the domain and boots it against the overlay so the operator
// needn't run virsh by hand. This is now safe because BackupSnapshot
// embeds the source VM's VMSpec in the root-disk manifest (vm_spec_json);
// the operator can also supply/override a spec. Without auto_start the
// behavior is unchanged (NBD + overlay only).
message RestoreLiveRequest {
    string repo_path  = 1;
    string vm_name    = 2;
    string disk_name  = 3;
    string timestamp  = 4;
    // target_path names the overlay file, admin only, and never an existing
    // file. Empty: the daemon picks a fresh file under <data_dir>/disks and
    // reports it as RestoreLiveProgress.target_path.
    string target_path = 5;
    // bind_addr controls the address the NBD server listens on.
    // Empty defaults to "127.0.0.1:0" — localhost-only, ephemeral
    // port. Set to "0.0.0.0:0" for a cluster-internal listener if
    // the operator runs qemu on a different node from the daemon.
    string bind_addr = 6;

    // auto_start: define the domain (pointing at the overlay) and start it.
    bool   auto_start = 7;
    // new_name: rename the restored VM (collision-avoidance). Empty = the
    // manifest/vm_name.
    string new_name   = 8;
    // spec: operator-supplied/override VMSpec. nil = use the manifest's
    // embedded vm_spec_json.
    VMSpec spec       = 9;
    // from_existing: last-resort, pull the spec from an existing vms record
    // when neither spec nor manifest metadata is available.
    bool   from_existing = 10;
    // blockpull: after start, drive blockpull to localize the disk, then
    // tear the NBD server down (self-terminating). Without it the stream
    // stays open until the operator closes it (operator-driven localize).
    bool   blockpull  = 11;
    // without_devices: auto_start only. Start the restored VM without the
    // backed-up VM's PCI passthrough devices; they are removed from its
    // stored spec, and the drop is audited. Without it, a device this host
    // cannot provide refuses the restore.
    bool   without_devices = 12;
}
message RestoreLiveProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        STARTING_NBD  = 1;
        READY         = 2; // qcow2 created + NBD listening; operator may boot a VM
        DONE          = 3; // stream is shutting down; NBD server stopping
        DEFINING      = 4; // domain XML generated + DefineDomain issued
        STARTED       = 5; // StartDomain succeeded; VM booting off the overlay
        BLOCKPULL     = 6; // blockpull in progress (auto_start + blockpull)
        LOCALIZED     = 7; // blockpull complete; disk self-contained; NBD stopping
    }
    Phase  phase   = 1;
    string nbd_url = 2; // populated on STARTING_NBD + READY
    string target_path = 3;
    string status  = 4;
    string vm_name = 5; // populated once the domain is defined/started
}

// WebAuthn second-factor enrolment + login dance. Each
// pair returns/accepts the raw JSON the browser exchanges with
// navigator.credentials.create /.get. The daemon holds the in-flight
// session between Begin and Finish in memory; a Begin without a
// matching Finish within 60s is garbage-collected.
message BeginWebAuthnRegistrationRequest  { string username = 1; string enrollment_code = 2; }
message BeginWebAuthnRegistrationResponse { bytes options_json = 1; }
message FinishWebAuthnRegistrationRequest {
    string username        = 1;
    bytes  attestation_json = 2;
    string enrollment_code = 3;
}
// session_ended: as EnrollTOTPResponse.session_ended.
message FinishWebAuthnRegistrationResponse { string credential_label = 1; bool session_ended = 2; }

message BeginWebAuthnLoginRequest  { string username = 1; }
message BeginWebAuthnLoginResponse { bytes options_json = 1; }
message FinishWebAuthnLoginRequest {
    string username       = 1;
    bytes  assertion_json = 2;
}
message FinishWebAuthnLoginResponse {
    string token      = 1;  // session bearer ("lvs_<id>") minted on a valid assertion
    string username   = 2;
    string role       = 3;
    string expires_at = 4;  // RFC3339 hard expiry
}

// ── Stats ──
message GetVMStatsRequest    { string name = 1; }
message GetHostStatsRequest  { string name = 1; }

// ── Monitoring ──
message ClusterStatus { string cluster_name = 1; int32 hosts_total = 2;
    int32 hosts_active = 3; int32 vms_total = 4; int32 vms_running = 5;
    int32 vms_error = 6; repeated Host hosts = 7;
    // 8 was `repeated Alert alerts` — never populated by any release; health
    // now lives exclusively in GetClusterHealth.
    reserved 8;
    repeated ClusterEvent recent_events = 9; }
message StreamEventsRequest { repeated string event_types = 1; }

// ── Audit ──
message ListAuditLogRequest {
    int32  limit  = 1;
    string target = 2;   // filter: exact target path (empty = any)
    string action = 3;   // filter: exact, or trailing-* prefix glob e.g. "sg.*" (empty = any)
    string user   = 4;   // filter: exact username (empty = any)
    string since  = 5;   // filter: at/after since, as an instant (forms as ExportAuditChainRequest; empty = open)
    string until  = 6;   // filter: up to the end of until (forms as ExportAuditChainRequest; empty = open)
}
message AuditEntry {
    string timestamp = 1;
    string username  = 2;
    string host_name = 3;
    string action    = 4;
    string target    = 5;
    string detail    = 6;
    string result    = 7;
}
message ListAuditLogResponse { repeated AuditEntry entries = 1; }

// Per-VM operational event store (vm_events) — durable, replicated, prunable
// activity history (lifecycle + backup outcomes). Distinct from the audit log.
message ListVMEventsRequest {
    string vm_name = 1;
    int32  limit   = 2;  // default 100, max 1000
    string since   = 3;  // at/after, as an instant (forms as ExportAuditChainRequest); empty = no lower bound
}
message VMEvent {
    string id        = 1;
    string vm_name   = 2;
    string host_name = 3;
    string type      = 4;   // e.g. "backup.failed", "vm.started"
    string result    = 5;   // "ok" | "error"
    string severity  = 6;   // "info" | "warn" | "error"
    string detail    = 7;
    string username  = 8;
    string ts        = 9;   // RFC3339Nano
}
message ListVMEventsResponse { repeated VMEvent events = 1; }

// ── Resource Mappings (#14) ──
message CreateResourceMappingRequest { string name = 1; string description = 2; }
message ListResourceMappingsRequest  {}
message ListResourceMappingsResponse { repeated ResourceMapping mappings = 1; }
message DeleteResourceMappingRequest { string name = 1; }
// AddMappingDevice registers one host's concrete device under a mapping.
// host empty = caller's host. address is the PCI address on that host, or a
// USB device as "usb:<vendor>:<product>" or "usb:<bus>-<port>[.<port>...]".
// A mapping holds PCI devices or USB devices, never both.
message AddMappingDeviceRequest {
    string mapping = 1;
    string host    = 2;
    string address = 3;
    string vendor  = 4;
    string device  = 5;
}
message RemoveMappingDeviceRequest {
    string mapping = 1;
    string host    = 2;
    string address = 3;
}

// ── Notifications (#5) ──
message CreateNotificationTargetRequest { string name = 1; string type = 2; string config = 3; bool enabled = 4; }
message ListNotificationTargetsRequest  {}
message ListNotificationTargetsResponse { repeated NotificationTarget targets = 1; }
message DeleteNotificationTargetRequest { string id = 1; }
message TestNotificationTargetRequest   { string id = 1; }
message CreateNotificationRouteRequest  { string event_pattern = 1; string target_id = 2; string min_severity = 3; bool enabled = 4; }
message ListNotificationRoutesRequest   {}
message ListNotificationRoutesResponse  { repeated NotificationRoute routes = 1; }
message DeleteNotificationRouteRequest  { string id = 1; }

// ── Registry credentials (v23) ──
// OCI/Docker registry logins for private image pulls. Per-user (owned by the
// authenticated caller) or global (operator-managed, cluster-wide).
message RegistryCredential {
    string scope      = 1;  // "user" | "global"
    string owner      = 2;  // username for user scope; "" for global
    string registry   = 3;  // normalized host: docker.io | ghcr.io | registry:5000
    string username   = 4;
    // NOTE: the secret is intentionally absent — List never returns it.
    string created_at = 5;
    string updated_at = 6;
}
// owner is NOT a field: the server uses callerUsername(ctx) for user scope, so a
// caller can never write another user's credential.
message SetRegistryCredentialRequest    { bool global = 1; string registry = 2; string username = 3; string password = 4; }
message ListRegistryCredentialsRequest  { bool all = 1; bool global = 2; }
message ListRegistryCredentialsResponse { repeated RegistryCredential credentials = 1; }
message DeleteRegistryCredentialRequest { bool global = 1; string registry = 2; }

// ── Distributed firewall: cluster/host tiers, ipsets, default-deny (v21) ──
// The per-NIC tier is managed via security_groups + BindSecurityGroups; these
// cover the cluster_default / host_overrides chains, named ipsets, and the
// default-deny policy. The reconciler applies changes within its poll interval
// (or immediately via ReloadFirewall).
message CreateClusterFirewallRuleRequest { FirewallRule rule = 1; }
message ListClusterFirewallRulesRequest  {}
message ListClusterFirewallRulesResponse { repeated FirewallRule rules = 1; }
message DeleteClusterFirewallRuleRequest { string id = 1; }
message CreateHostFirewallRuleRequest    { FirewallRule rule = 1; }
message ListHostFirewallRulesRequest     { string host_name = 1; }  // empty = all hosts
message ListHostFirewallRulesResponse    { repeated FirewallRule rules = 1; }
message DeleteHostFirewallRuleRequest    { string id = 1; }
message CreateIpSetRequest               { string name = 1; repeated string cidrs = 2; }
message ListIpSetsRequest                {}
message ListIpSetsResponse               { repeated IpSet ipsets = 1; }
message DeleteIpSetRequest               { string id = 1; }
message SetFirewallDefaultRequest        { string scope = 1; bool default_deny = 2; }  // scope empty = cluster
message ListFirewallDefaultsRequest      {}
message ListFirewallDefaultsResponse     { repeated FirewallDefault defaults = 1; }

// ── Firewall extras: SYN-flood protection, logging, tag groups ──
// An older daemon answers each of these RPCs Unimplemented.
message GetFirewallSynfloodRequest {
    bool local_only = 1;  // this host's entry only (a peer's fan-out leg)
}
message GetFirewallSynfloodResponse { repeated FirewallSynfloodPolicy policies = 1; }
message SetFirewallSynfloodRequest {
    string scope = 1;  // empty = cluster
    string mode  = 2;  // on | off | inherit (a host scope only)
    uint32 rate  = 3;  // 0 = the default
    uint32 burst = 4;  // 0 = the default
}
message GetFirewallLogPolicyRequest {}
message GetFirewallLogPolicyResponse { repeated FirewallLogPolicy policies = 1; }
message SetFirewallLogPolicyRequest {
    string scope = 1;  // empty = cluster
    string mode  = 2;  // on | off | inherit (a host scope only)
    uint32 rate  = 3;  // 0 = the default
    uint32 burst = 4;  // 0 = the default
}
message ListFirewallLogRequest {
    string              host       = 1;  // empty = every active host
    string              workload   = 2;
    string              since      = 3;  // RFC 3339; empty = no lower bound
    uint32              limit      = 4;
    map<string, uint64> after_seq  = 5;  // per host: only entries after this sequence
    bool                local_only = 6;  // this host only (a peer's fan-out leg)
}
message ListFirewallLogResponse {
    repeated FirewallLogEntry entries = 1;
    map<string, string>       errors  = 2;  // per host that could not be read
}
message ListFirewallTagGroupsRequest  { bool members = 1; }
message ListFirewallTagGroupsResponse { repeated FirewallTagGroup groups = 1; }
message SetFirewallTagGroupRequest    { FirewallTagGroup group = 1; }  // set_by, updated_at and members are ignored
message DeleteFirewallTagGroupRequest { string name = 1; bool force = 2; }
message ListFirewallTagsRequest {
    string kind     = 1;  // vm | container; empty = both
    string workload = 2;  // empty = every workload
    string host     = 3;  // a container's host
}
message ListFirewallTagsResponse { repeated FirewallTags tags = 1; }
// SetFirewallTagsRequest merges server-side: set, then remove.
message SetFirewallTagsRequest {
    string              kind     = 1;  // vm | container
    string              workload = 2;
    string              host     = 3;  // a container's host
    map<string, string> set      = 4;
    repeated string     remove   = 5;
}

// ── Security groups: the per-NIC tier ──
// `lv sg create/rm/rule-add/rule-rm`. These used to write the host's database
// straight from the CLI process, which skipped the daemon's authorization and
// left no audit row (colonelpanik/litevirt#182).
message CreateSecurityGroupRequest     { string name = 1; string stack_name = 2; string project = 3; }  // project: owner; empty = global
message DeleteSecurityGroupRequest     { string id = 1; }  // tombstones the group and its rules
message AddSecurityGroupRuleRequest    { SecurityGroupRule rule = 1; }  // rule.id is ignored
message RemoveSecurityGroupRuleRequest { string id = 1; }  // the RULE id
// ListSecurityGroups is the read twin of the four above: sg.read at the cluster
// root, the same path they check sg.write at. The web UI's security-group pages
// read through it with the session's bearer, so a scoped token or a session
// without sg.read gets the daemon's refusal rather than every group and rule.
message ListSecurityGroupsRequest {
    string stack_name    = 1;  // empty = every group
    bool   include_rules = 2;  // also return every rule of the listed groups
    string project       = 3;  // that project's groups plus the global ones; empty = every group the caller may read
}
message ListSecurityGroupsResponse {
    repeated SecurityGroup     groups = 1;
    repeated SecurityGroupRule rules  = 2;  // only with include_rules; each names its group in sg_id
}

// ── Storage ──
message ListStoragePoolsRequest {}
message ListStoragePoolsResponse { repeated StoragePool pools = 1; }

// CreateStoragePoolRequest registers a new pool on the daemon's host
// and runs the driver's Prepare() hook (mount NFS, log into iSCSI, etc.).
// On success a row lands in `storage_pools`, replicated to the cluster
// via Corrosion. `lv pool create`.
message CreateStoragePoolRequest {
    string name       = 1; // pool name (unique per host)
    string driver     = 2; // local|dir|nfs|iscsi|ceph|zfs|btrfs|lvm-thin
    string source     = 3; // driver-specific (NFS export, Ceph pool, ZFS dataset)
    string target     = 4; // local mount/path override
    map<string,string> options = 5; // driver-specific key/value flags
    string host       = 6; // optional — defaults to caller's host
    string project    = 7; // owning tenant; empty = global/shared (usable by all)
}
message CreateStoragePoolResponse { StoragePool pool = 1; }

message DeleteStoragePoolRequest {
    string name = 1;
    string host = 2; // optional — defaults to caller's host
    string project = 3; // owning tenant (tenancy scoping)
    bool   force = 4; // delete even if VM disks / active schedules still reference it
}
message DeleteStoragePoolResponse {}

message GetStoragePoolRequest {
    string name = 1;
    string host = 2; // optional — defaults to caller's host
}
message GetStoragePoolResponse { StoragePool pool = 1; }

// A file in a (file-based) storage pool — used by the content browser.
message StoragePoolContent {
    string name        = 1; // file name
    string path        = 2; // absolute path on the host (usable as VMSpec.iso)
    int64  size_bytes  = 3;
    string modified_at = 4; // RFC3339
    bool   is_iso      = 5; // .iso extension
    // Set for a replica: the VM and disk it is a replica of, and its time. A
    // listing shows only the replicas of VMs the caller may read, from their
    // records in the pool's replica area; name is what PromoteReplica.replica
    // takes.
    string replica_vm    = 6;
    string replica_disk  = 7;
    string replica_taken = 8;
}
message ListStoragePoolContentsRequest {
    string pool_name = 1;
    string host      = 2; // optional — defaults to caller's host
}
message ListStoragePoolContentsResponse { repeated StoragePoolContent contents = 1; }

// Client-streaming upload of a file (e.g. an ISO) into a file-based pool. The
// first message carries pool_name/host/filename; later messages carry chunks.
message UploadStoragePoolContentRequest {
    string pool_name = 1;
    string host      = 2; // optional — defaults to caller's host
    string filename  = 3; // base name only (no path separators)
    bytes  chunk     = 4;
    // 5 carried a replica record on an earlier build of this branch. Replicas
    // now go only through the peer-only PushReplica, and a header carrying
    // any field the receiver does not know is refused.
    reserved 5;
}
message UploadStoragePoolContentResponse {
    string path       = 1;
    int64  size_bytes = 2;
    reserved 3;
}

// Client-streaming replica push (cross-host replication), peer only. The
// first message is the header (pool_name/host/replica, no chunk); the rest
// carry chunks. The receiver writes a NEW file replica.file into the
// replica area of (replica.project, replica.vm) and its record beside it.
// A dedicated RPC rather than an upload field, so an entry node on an older
// build — which has no handler for it — can never forward one for a user.
message PushReplicaRequest {
    string        pool_name = 1; // header
    string        host      = 2; // header — optional, defaults to the receiver
    ReplicaRecord replica   = 3; // header
    bytes         chunk     = 4;
}
message PushReplicaResponse {
    string path       = 1;
    int64  size_bytes = 2;
    // The receiver recorded the replica's not_point_in_time mark. A receiver
    // on a build that does not know the mark leaves it false, so a sender
    // that set it can tell the mark was dropped.
    bool   not_point_in_time_recorded = 3;
}
// Delete one file from a file-based pool. filename is a base name. A file any
// VM disk on any host uses is refused. (Replicas are pruned with the
// peer-only PruneReplicas, by record, not through this.)
message DeleteStoragePoolContentRequest {
    string pool_name  = 1;
    string host       = 2; // optional — defaults to caller's host
    string filename   = 3;
    // A replica in the pool's replica area, as a listing shows it: the VM it
    // is a replica of (StoragePoolContent.replica_vm). Optional while only one
    // replica the caller may delete has that file name; needed when replicas
    // of several VMs share it (one schedule's fan-out run).
    string replica_vm = 4;
}

// One ISO a VM may name, as the reference VMSpec.iso takes.
message ISOEntry {
    string ref        = 1; // <pool>/<file>
    string pool       = 2;
    string project    = 3; // owning project; empty for the global library
    string name       = 4;
    int64  size_bytes = 5;
    bool   global     = 6; // in the cluster-global library ("isos")
    // Global library in sync mode only: "ok" when this host's copy matches the
    // library, "syncing" while it does not yet, "not in library" for a file the
    // library has no record of (a VM cannot start from it).
    string sync_state = 7;
}
message ListISOsRequest {
    string host    = 1; // optional — defaults to the answering host
    string project = 2; // optional — only this project's libraries (plus the global one)
}
message ListISOsResponse { repeated ISOEntry isos = 1; }

message PullISORequest {
    string ref       = 1; // <pool>/<file>.iso — the library and the name to store it under
    string host      = 2; // optional — the host whose pool receives it; defaults to the answering host
    string url       = 3; // http(s) source; exactly one of url / host_path
    string host_path = 4; // absolute path on that host (Admin: storage.hostpath at /)
    string checksum  = 5; // optional sha256 the copy must match ("sha256:" prefix optional)
}
message PullISOResponse {
    string ref        = 1;
    string sha256     = 2;
    int64  size_bytes = 3;
}

message ISOLibraryMode {
    string mode       = 1; // sync | shared
    string set_by     = 2;
    string updated_at = 3;
    bool   settable   = 4; // false until failover_scope_v1 has latched on every host
}
message SetISOLibraryModeRequest { string mode = 1; }

message FetchISOLibraryFileRequest {
    string name   = 1; // file name in the global library
    string sha256 = 2; // the copy is served only if it matches
}
message FetchISOLibraryFileChunk { bytes chunk = 1; }

// Client-streaming incremental replica push. The first message is the header
// (pool/host/filename/base/total_size); subsequent messages each carry one
// dirty extent (offset,data) written into a new RAW replica. When base is set
// the peer forks the new file from that previous replica (server-side sparse
// copy) and only the dirty extents are streamed over the wire; base="" makes
// it a full push (every allocated extent). The target is a sparse raw file so
// extents apply with a plain WriteAt — no qcow2 writer needed.
message PushReplicaIncrementRequest {
    string pool_name  = 1; // header
    string host       = 2; // header — optional, defaults to caller
    string filename   = 3; // header — new replica base name; must equal replica.file
    string base       = 4; // header — a RECORDED replica of the same disk and schedule to fork from; "" = full
    int64  total_size = 5; // header — raw file virtual size
    int64  offset      = 6; // extent
    bytes  data        = 7; // extent
    ReplicaRecord replica = 8; // header — required: the new replica's record
}
message PushReplicaIncrementResponse {
    string path          = 1;
    int64  bytes_written = 2;
    bool   replica_recorded = 3;
}

// A replica's record. Replicas live in a daemon-owned area of the pool, one
// directory per (project, vm), each file beside its record. Replication
// lists, prunes and forks from, and promotion boots, only files that have a
// record naming the caller's own project and VM — never a file matched by
// name — so a pool every project shares cannot be used to read, overwrite or
// delete another project's replicas or disks.
message ReplicaRecord {
    string project    = 1; // normalized project of the VM
    string vm         = 2;
    string disk       = 3;
    string schedule   = 4; // the schedule that wrote it: "<schedule row vm_name>/<repo>"
    string file       = 5; // "<disk>-<taken>.<format>", a base name in the owner directory
    string format     = 6; // qcow2 | raw
    string taken      = 7; // UTC run time, 20060102-150405
    int64  size_bytes = 8; // set by ListReplicas
    // not_point_in_time is set on a replica copied with qemu-img convert -U
    // after every point-in-time copy failed (a backup session, an external
    // snapshot): it may be inconsistent. Automatic promotion does not use one
    // while a point-in-time replica exists, and by default not at all; manual
    // promotion asks for accept_not_point_in_time. Absent (every replica
    // written before this field, or by a build that does not know it) reads
    // as such replicas always read.
    bool   not_point_in_time = 9;
}
// Peer only. The replica records of one VM in a pool on host.
message ListReplicasRequest {
    string pool_name = 1;
    string host      = 2; // optional — defaults to the receiver
    string project   = 3;
    string vm        = 4;
}
message ListReplicasResponse { repeated ReplicaRecord replicas = 1; }
// Peer only. Keep the newest `keep` replicas one schedule recorded for one disk
// of one VM; delete the older ones, never a file a VM disk references.
message PruneReplicasRequest {
    string pool_name = 1;
    string host      = 2;
    string project   = 3;
    string vm        = 4;
    string disk      = 5;
    string schedule  = 6;
    int32  keep      = 7;
}
message PruneReplicasResponse { int32 deleted = 1; }

// ── Failover promotion (recover a VM from a replica) ──
// RuntimeActionProof is the single-use authorization a coordinator (holding the
// failover lease + local quorum) mints for a dangerous runtime-ownership action
// and carries to the executing host — which does NOT hold the lease — so it can
// VALIDATE the coordinator's assertions (action/target/dest) and claim it once
// before acting (split-brain hardening, v38). Carried in-message (not just an id)
// so validation does not depend on the proof row having replicated yet.
message RuntimeActionProof {
    string id               = 1;
    string action           = 2; // reschedule | promote | relocate | lb_apply
    string target_kind      = 3; // vm | container | lb
    string target_name      = 4;
    string dest_host        = 5;
    string coordinator      = 6;
    string lease_holder     = 7;
    string lease_expires_at = 8;
    int32  quorum_live      = 9;
    int32  quorum_needed    = 10;
    string relocation_token = 11;
    // fence_epoch binds an auto-promote/reschedule proof to the SPECIFIC fence of
    // the old owner that authorizes the cross-host transfer, so the executor can
    // re-verify a proof-grade power-off (never a stale hosts.state=="fenced").
    // Format: "host=<old-owner>;fence_id=<fencing_log id>;ts=<rfc3339>". Empty on
    // a proof minted by a pre-fence_epoch node ⇒ a new executor fails a shared-disk
    // transfer closed. Additive/wire-compatible.
    string fence_epoch      = 12;
    // owner_epoch is the ownership-generation binding for the owning resource
    // (vm/container) where applicable. It is an ABA-breaker: a proof bound to one
    // owner epoch cannot authorize actions after the resource ownership has
    // advanced. Empty on a proof minted by a pre-owner_epoch node ⇒ the executor
    // skips the comparison until owner_epoch_v1 enforcement. Additive/wire-compatible.
    string owner_epoch      = 13;
    // lease_term is the fencing term of the lease incarnation that minted this
    // proof. The executor refuses a proof whose term is below the
    // QUORUM-observed high-water mark for the key, or whose coordinator is not
    // the holder this node recorded at that term. 0 = minted by a pre-v52 node
    // ⇒ refused once lease_term_v1 is enforced, accepted before.
    // Additive/wire-compatible.
    int64  lease_term       = 14;
    // lease_key names WHICH lease's ledger lease_term belongs to. Three
    // subsystems share leader_lease_terms — the failover coordinator, the
    // rebalancer and the dual-run detector — and their term numbers collide by
    // design, so a term is not interpretable without it. The executor validates
    // it against a CLOSED SET and refuses an unknown key: reading a nonexistent
    // ledger yields MAX(term) = 0, which would pass every proof naming it.
    // "" = minted by a pre-v53 node, and pairs with lease_term = 0.
    // Additive/wire-compatible.
    //
    // Validation is NOT mere membership in those three. The key selects the
    // ledger the threshold is computed from, so naming a quieter lease would
    // move the bar; the executor accepts only a key a proof PRODUCER holds,
    // which today is the failover lease alone. It is enforced both where a proof
    // is received and where a term is judged — the reschedule path reads the
    // replicated ROW rather than a carried proof, so the row cannot be trusted
    // on the strength of some other node having checked it.
    string lease_key        = 15;
    // claim_certificate is the recovery-claim certificate that authorizes an
    // ownership-transfer proof (docs/design/recovery-claims.md §3.9): the JSON
    // corrosion.ClaimCertificate, a majority of voters' signed accepts for
    // exactly this binding. Evidence, not a binding field — the executor
    // verifies it offline against the voter set and the cluster CA before it
    // claims the proof, once recovery_claim_v1 is enforced. "" = none.
    // Additive/wire-compatible.
    string claim_certificate = 16;
}

message AcknowledgeLeaseTermTieRequest {
    string key  = 1; // lease key, e.g. "failover"
    int64  term = 2; // the contested term
}
message AcknowledgeLeaseTermTieResponse {
    // acknowledged is false when no such tie was tracked on this node — an
    // already-acknowledged term, a term that never contested, or a node that
    // restarted since. Not an error: the command is idempotent.
    bool acknowledged = 1;
}

message GetLeaseTermHighWaterRequest {
    // key names which leader lease to answer about. Only the keys litevirt
    // itself mints are accepted; an unknown key is InvalidArgument, NOT term 0,
    // because 0 is the sentinel for "no term recorded" and would read as a
    // legitimate answer.
    string key = 1;
}
message GetLeaseTermHighWaterResponse {
    // key echoes the request so a caller can detect a peer answering about a
    // different ledger. A mismatch counts as no answer.
    string key = 1;
    // term is this node's newest LIVE term for key; 0 = none recorded, which is
    // a legitimate answer and counts toward quorum. A node that cannot READ its
    // ledger returns Unavailable instead, so it is counted as silent rather
    // than as agreeing at 0.
    int64 term = 2;
    // holder is the holder recorded at that term; "" when term == 0.
    string holder = 3;
    // lease_holder and lease_expires_at are this node's leader_election row
    // for key (expires_at as RFC3339 UTC); both "" when it has none. A node
    // about to take a lease over reads them as refusal evidence: a peer whose
    // row shows the lease live has seen a renewal the caller has not, because
    // renewals travel only in leader_election, which anti-entropy does not
    // carry. A peer on an older build leaves them empty, which proves nothing
    // either way and is treated as no evidence.
    string lease_holder     = 4;
    string lease_expires_at = 5;
}

// ── Recovery claims and the voter set (docs/design/recovery-claims.md) ──

message RecoveryClaimKey {
    string target_kind = 1;  // vm | container | voter_config | lun | lease_term
    string target_name = 2;  // workload, LUN or lease name; "" for voter_config
    int64  owner_epoch = 3;  // generation being left; config generation for voter_config
    int64  attempt     = 4;
    // incarnation is the workload row's created_at: which incarnation of the
    // name the claim decides for (docs/design/recovery-claims.md §10 item 37).
    // "" is a legacy key, from a coordinator before claim_incarnation_v1
    // latched, and always "" for voter_config.
    string incarnation = 5;
}
message ClaimBallot {
    uint64 round       = 1;
    string coordinator = 2;
    bytes  boot_nonce  = 3;
}
message ClaimVoterMember {
    string name        = 1;
    string incarnation = 2;
}
// VoterConfigValue is a voter_configs row without its certificate: what a
// voter_config claim decides.
message VoterConfigValue {
    int64  generation = 1;
    repeated ClaimVoterMember members = 2;
    string change     = 3;  // genesis | add:<host> | rm:<host> | reset
    string created_by = 4;
    string created_at = 5;
}
// RecoveryClaimValue is what a claim decides: the ActionProof binding fields
// plus the source host for a workload key, or a voter config.
message RecoveryClaimValue {
    string id               = 1;
    string action           = 2;
    string target_kind      = 3;
    string target_name      = 4;
    string dest_host        = 5;
    string coordinator      = 6;
    string relocation_token = 7;
    string fence_epoch      = 8;
    string owner_epoch      = 9;
    int64  lease_term       = 10;
    string lease_key        = 11;
    string source_host      = 12;
    VoterConfigValue voter_config = 13;
    // An iSCSI LUN allocation: the value a key of target_kind "lun" decides.
    LUNAllocationValue lun = 14;
    // A leader-lease term's holder: the value a key of target_kind
    // "lease_term" decides (lease_term_claim_v1).
    LeaseTermClaimValue lease_term_claim = 15;
}
// LeaseTermClaimValue is which node holds one term of one leader lease.
message LeaseTermClaimValue {
    string key    = 1;  // the lease key (failover, rebalancer, ...)
    int64  term   = 2;
    string holder = 3;
}
// LUNAllocationValue is which disk of which VM one allocation of a LUN is.
message LUNAllocationValue {
    string lun        = 1;  // storage.FixedDevice key: target and LUN number
    int64  generation = 2;  // the key's allocation generation
    string claim_id   = 3;  // the create that proposed it
    string vm_id      = 4;  // the VM's uuid
    string vm_name    = 5;
    string disk       = 6;
    string host       = 7;  // the host that ran the create
}
// ClaimAccept is one voter's signed accept.
message ClaimAccept {
    string voter             = 1;
    string voter_incarnation = 2;
    int64  config_generation = 3;
    ClaimBallot ballot       = 4;
    string value_digest      = 5;
    string cert_pem          = 6;
    bytes  signature         = 7;
    RecoveryClaimKey key     = 8;
}
message PrepareRecoveryClaimRequest {
    RecoveryClaimKey key    = 1;
    ClaimBallot ballot      = 2;
    int64 config_generation = 3;
    // supersede is required at attempt > 0 (§3.12): the evidence that the
    // value decided at attempt-1 will never execute.
    RecoveryClaimSupersede supersede = 4;
}
// RecoveryClaimSupersede is the evidence a Prepare at attempt n+1 carries.
message RecoveryClaimSupersede {
    string prior_certificate        = 1;  // JSON certificate that decided attempt n
    RecoveryClaimValue prior_value  = 2;  // the value it decided
    string abandonment              = 3;  // JSON signed abandonment by that value's destination; "" = it was removed
}
// AttestSharedDiskUnusedRequest asks the host a shared disk's row names to
// attest that no domain defined on it uses the disk (review c2b): `lv doctor
// repair-owner` on the host running the VM re-homes the row only then. The
// attesting host records the release, and refuses the start of any domain
// using the path until the VM's own row for the disk names it again.
message AttestSharedDiskUnusedRequest {
    string vm_name   = 1;  // the VM whose disk row names the attesting host
    string disk_name = 2;
    string path      = 3;  // the shared disk's path, as the row records it
    string requester = 4;  // the host the row is re-homed to
}
message AttestSharedDiskUnusedResponse {
    bool   unused = 1;  // no domain defined on the attesting host uses path; released
    string detail = 2;  // when not: which domain uses it
}
// AbandonRecoveryProofRequest asks a recovery destination to sign that it has
// not executed, and never will, the proof a decided claim named (§3.12).
message AbandonRecoveryProofRequest {
    RecoveryClaimKey key = 1;
    string proof_id      = 2;
    string reason        = 3;
    // foreign_only: abandon only a proof this destination can show is NOT the
    // decision of the incarnation key names — the legacy-key bridge's
    // exclusion (docs/design/recovery-claims.md §10 item 37). Refused
    // otherwise, so a decision of this incarnation that may still run, or
    // has run, is never abandoned by it.
    bool foreign_only    = 4;
    // operator_release: the operator's `lv cluster claim-release` of a
    // legacy-held claim. With foreign_only, it lets the destination abandon a
    // proof it claimed and left in progress — the one refusal it overrides —
    // after confirming from its own state that nothing runs it: no start path
    // holds the workload and no live domain or container of its name exists
    // here. Every other refusal stands.
    bool operator_release = 5;
}
// ReleaseLegacyHeldClaimRequest is `lv cluster claim-release <kind>/<name>`:
// release the decision an open ha.claim.legacy_held names for one workload,
// stuck in flight on a live destination (docs/design/recovery-claims.md §10
// item 37).
message ReleaseLegacyHeldClaimRequest {
    string kind = 1;   // vm | container
    string name = 2;
}
message ReleaseLegacyHeldClaimResponse {
    string dest_host = 1;   // the destination that signed the abandonment
    string proof_id  = 2;   // the proof it will never run
    string key       = 3;   // the claim key, rendered
    string detail    = 4;
}
message AbandonRecoveryProofResponse {
    string abandonment = 1;  // JSON corrosion.ClaimAbandonment
}
// PlanDeadHostRemovalRequest is `lv host rm --dead`'s plan (also its
// --dry-run): what the removal would do, and the recoveries it unblocks.
message PlanDeadHostRemovalRequest { string name = 1; }
message StrandedRecovery {
    string kind         = 1;  // vm | container
    string name         = 2;
    string detail       = 3;  // what is stranded and why
    int64  next_attempt = 4;  // the claim attempt its recovery moves to
}
message ForceReconfigureVotersRequest {
    repeated string lost = 1;   // the members of the adopted generation lost for good
    bool   dry_run       = 2;   // run every check and print the plan, change nothing
}
message ForcedFenceEvidence {
    string host      = 1;
    string fence_id  = 2;
    string method    = 3;
    string result    = 4;
    string timestamp = 5;
}
message ForceReconfigureVotersResponse {
    int64  from_generation = 1;
    int64  generation      = 2;   // the forced generation (0 on a dry run)
    repeated string survivors = 3;
    repeated string lost      = 4;
    repeated ForcedFenceEvidence fences = 5;
    int64  import_keys     = 6;   // claim keys the survivors will import
    bool   applied         = 7;
    string detail          = 8;
}
message SignForcedVoterConfigRequest {
    int64  from_generation   = 1;
    VoterConfigValue value   = 2;
    repeated string lost     = 3;
    repeated ForcedFenceEvidence fences = 4;
}
message SignForcedVoterConfigResponse {
    string voter       = 1;
    string incarnation = 2;
    string cert_pem    = 3;
    bytes  signature   = 4;
}
// A workload a host paused itself, as its pause record holds it.
message PausedWorkload {
    string kind        = 1;  // vm | container
    string name        = 2;
    int64  owner_epoch = 3;
    string incarnation = 4;  // the row's created_at at the pause
}
message ConfirmPartitionResumeRequest {
    repeated PausedWorkload workloads = 1;
}
// One voter's view of one paused workload, from its own replica and claim tables.
message PausedWorkloadView {
    string kind          = 1;
    string name          = 2;
    bool   live          = 3;  // a live row exists (for a container: on the caller)
    string host_name     = 4;
    int64  owner_epoch   = 5;
    string incarnation   = 6;
    // accepted_dest names the destination of a recovery-claim value this voter
    // has accepted for the workload at the paused epoch and incarnation
    // (either key form); "" when none.
    string accepted_dest = 7;
}
message ConfirmPartitionResumeResponse {
    string voter        = 1;
    string caller_state = 2;  // the caller's hosts.state in this voter's replica; "absent" when none
    repeated PausedWorkloadView views = 3;
}

message InspectRecoveryClaimRequest {
    string kind        = 1;   // vm | container
    string name        = 2;
    int64  owner_epoch = 3;   // -1 (default when unset by the CLI) = the row's current epoch
    bool   epoch_set   = 4;
}
message RecoveryClaimVoterView {
    string voter              = 1;
    bool   reachable          = 2;
    string error              = 3;
    string promised           = 4;   // ballot, rendered
    string accepted           = 5;
    string value_digest       = 6;
    string proof_id           = 7;
    string dest_host          = 8;
    string source_host        = 9;
    string incarnation        = 10;
    bool   incarnation_ok     = 11;
    string last_refusal       = 12;
    string last_refusal_detail = 13;
    int64  adopted_generation = 14;
}
message RecoveryClaimAttemptView {
    RecoveryClaimKey key = 1;
    repeated RecoveryClaimVoterView voters = 2;
    string decided_digest = 3;   // a digest a majority of members accepted, "" = none
    string decided_dest   = 4;
}
message InspectRecoveryClaimResponse {
    int64  generation = 1;
    repeated RecoveryClaimAttemptView attempts = 2;
    string detail     = 3;
}
message PlanDeadHostRemovalResponse {
    string host              = 1;
    bool   fenced            = 2;  // a proof-grade fence is recorded
    string fence_detail      = 3;
    string fence_command     = 4;  // what to run when it is not
    bool   voter             = 5;  // a member of the adopted voter generation
    int64  voter_generation  = 6;
    repeated StrandedRecovery stranded = 7;
    string host_state        = 8;
}
message PrepareRecoveryClaimResponse {
    bool        promised           = 1;
    ClaimBallot promised_ballot    = 2;  // on refusal: what this voter has promised
    ClaimBallot accepted_ballot    = 3;  // unset if nothing accepted
    RecoveryClaimValue accepted_value = 4;
    string      voter              = 5;
    string      voter_incarnation  = 6;
    string      refusal_reason     = 7;
    string      refusal_detail     = 8;
    // On a promise at an incarnation-scoped key: what this voter accepted at
    // the LEGACY key of the same (kind, name, epoch, attempt), if anything.
    // The promise seals that legacy key here — this voter refuses every later
    // legacy Prepare and Accept at it — so a majority of these reports is
    // everything the legacy key can ever have decided (§10 item 37).
    ClaimBallot legacy_accepted_ballot       = 9;
    RecoveryClaimValue legacy_accepted_value = 10;
}
message AcceptRecoveryClaimRequest {
    RecoveryClaimKey key     = 1;
    ClaimBallot ballot       = 2;
    RecoveryClaimValue value = 3;
    int64 config_generation  = 4;
}
message AcceptRecoveryClaimResponse {
    bool        accepted        = 1;
    ClaimBallot promised_ballot = 2;
    ClaimAccept accept          = 3;
    string      voter           = 4;
    string      refusal_reason  = 5;  // e.g. recovery_claim_owner_reachable
    string      refusal_detail  = 6;  // e.g. "node-3 still reaches node-2 (Ping answered in 4ms)"
}
message GetRecoveryClaimRequest {
    RecoveryClaimKey key = 1;
    // reattest: for a voter_config key whose accept this voter signed with a
    // host certificate a renewal has since replaced, also return the same
    // accept re-signed with its current certificate (reattested). It re-signs
    // only the accept recorded in its own durable claim state, never a value
    // it did not accept. An older build ignores the field.
    bool reattest = 2;
}
message GetRecoveryClaimResponse {
    PrepareRecoveryClaimResponse state = 1;  // promised/accepted ballot and value, voter, incarnation
    ClaimAccept accept                 = 2;
    string last_refusal_reason         = 3;  // this voter's most recent refusal for the key (memory only)
    string last_refusal_detail         = 4;
    int64  adopted_generation          = 5;
    ClaimAccept reattested             = 6;  // with reattest: the accept above, re-signed with the current certificate
}
message ListRecoveryClaimsRequest {
    int64 config_generation = 1;  // the generation the importer is leaving
}
message RecoveryClaimState {
    bool   header             = 1;  // the first message: voter, frozen, adopted_generation
    string voter              = 2;
    bool   frozen             = 3;  // the asked-for generation is sealed or left behind here
    int64  adopted_generation = 4;
    RecoveryClaimKey key      = 5;
    ClaimBallot promised      = 6;
    ClaimBallot accepted      = 7;
    RecoveryClaimValue value  = 8;
    string value_digest       = 9;
}

message GetVoterConfigRequest {}
message VoterMemberStatus {
    string name        = 1;
    string incarnation = 2;  // the incarnation it was admitted with
    string host_state  = 3;  // hosts.state, or "removed"
    bool   reachable   = 4;
    bool   abstaining  = 5;  // its local incarnation does not match its entry
    string detail      = 6;
}
message GetVoterConfigResponse {
    string reporting_host      = 1;
    int64  adopted_generation  = 2;  // 0 = none adopted yet
    int64  latest_generation   = 3;  // highest voter_configs row on this host
    bool   explicit            = 4;  // false = the voter set is derived from host state
    string change              = 5;
    string created_by          = 6;
    string created_at          = 7;
    repeated VoterMemberStatus members = 8;
    repeated string derived_voters     = 9;  // the derived set, shown when not explicit
    bool   gate_open           = 10; // voter_config_v1 has durably latched here
    string genesis_pending     = 11; // why automatic genesis has not written generation 1
}
message ChangeVoterConfigRequest {
    string op      = 1;  // init | add | rm | reset
    string host    = 2;  // add, rm
    repeated string members = 3;  // init: explicit member list (default: the derived set)
    bool   dry_run = 4;  // report the value that would be proposed, change nothing
}
message ChangeVoterConfigResponse {
    int64  generation = 1;
    repeated ClaimVoterMember members = 2;
    string change     = 3;
    bool   applied    = 4;  // false for a dry run
    string detail     = 5;
}

message PromoteReplicaRequest {
    string vm_name     = 1; // VM whose replica to promote
    string target_pool = 2; // optional — pool holding the replica; defaults to the VM's replication schedule
    string target_host = 3; // optional — host holding the replica; defaults to the schedule's resolved host
    string replica     = 4; // optional — exact replica filename; "" = newest
    string new_name    = 5; // optional — promote under a new name (alongside the original)
    bool   force       = 6; // promote even if a VM by that name is still on a healthy host
    bool   no_localize  = 7; // skip blockpull (leaves the live disk backed by the replica — pins it)
    // proof authorizes an AUTOMATED (failover-coordinator) promote when the gate is
    // enforced; nil for operator-driven PromoteReplica. The executing host validates
    // it (dest==self, target==vm, action==promote), upserts it, and claims it
    // single-use before the destructive define+start.
    RuntimeActionProof proof = 8;
    // accept_not_point_in_time promotes a replica recorded as not
    // point-in-time (ReplicaRecord.not_point_in_time). Without it such a
    // promotion is refused with a warning naming this flag
    // (--accept-not-point-in-time).
    bool   accept_not_point_in_time = 9;
    // automated marks a promotion the failover coordinator decided, relayed
    // to the host holding the replica. It only ever narrows what the
    // executor does (a shared data disk is then reattached only behind a
    // proof-grade fence this executor verified); an older coordinator that
    // does not set it gets the manual rule.
    bool   automated = 10;
}
message ResolvePITOverlayRequest {
    string vm_name   = 1;
    string disk_name = 2;
    string action    = 3; // "commit" | "discard" | "" (report only, without confirm)
    bool   confirm   = 4; // false: report the verdict and what would be done, do nothing
    // force_commit commits whatever the verdict says (an expert's override;
    // the backing file must still be the disk's). accept_torn_disk discards
    // the overlay of a disk a commit had begun writing, leaving it
    // inconsistent.
    bool   force_commit     = 5;
    bool   accept_torn_disk = 6;
    // overwrite_newer_writes lets force_commit go ahead on an overlay that is
    // already in the disk (verdict pivoted, or a committed binding): the
    // commit then writes the window's old blocks over everything the guest
    // wrote since. Refused without it, whatever force_commit says.
    bool   overwrite_newer_writes = 7;
}
message ResolvePITOverlayResponse {
    string overlay = 1; // the overlay file
    string disk    = 2; // the disk file
    string binding = 3; // what its binding records, if anything
    bool   done    = 4; // the action was carried out
    string status  = 5;
    // verdict: matches | half-written | pivoted | unknown (pitoverlay.Assess).
    string verdict        = 6;
    string verdict_reason = 7;
    string current        = 8;  // the disk's identity now
    string backing_file   = 9;  // the overlay's backing file
    string if_commit      = 10; // what --commit would do, or why it is refused
    string if_discard     = 11; // what --discard would do, or why it is refused
    string recommendation = 12;
    string overlay_current = 13; // the overlay's own identity now (its modification time)
    // needs_overwrite_newer_writes: a forced commit of this overlay would
    // overwrite the guest's newer writes, and needs overwrite_newer_writes.
    bool   needs_overwrite_newer_writes = 14;
}
message ListSetAsideOverlaysRequest {
    string host    = 1; // "" = the host answering; ignored when vm_name is set
    string vm_name = 2; // only this VM's, answered on its host
}
message SetAsideOverlay {
    string vm_name      = 1;
    string disk_name    = 2;
    string name         = 3; // the file's base name (what removal takes)
    string path         = 4;
    string disk_path    = 5; // the disk it was set aside beside
    string set_aside_at = 6; // from the name, RFC3339; "" when it cannot be read
    int64  size_bytes   = 7;
    string in_use       = 8; // why it cannot be removed now; "" when it can
    // detached: no live disk is at disk_path any more (its VM was deleted,
    // or the disk moved). vm_name, disk_name and owner_vm_uuid are then the
    // owner its binding records, and removal goes by host and path.
    bool   detached      = 9;
    string owner_vm_uuid = 10;
}
message ListSetAsideOverlaysResponse {
    string                   host     = 1;
    repeated SetAsideOverlay overlays = 2;
}
message RemoveSetAsideOverlayRequest {
    string vm_name   = 1;
    string disk_name = 2;
    string name      = 3; // SetAsideOverlay.name
    // A detached overlay (SetAsideOverlay.detached) goes by its host and
    // path instead, with vm_name, disk_name and name empty.
    string host      = 4;
    string path      = 5;
}
message RemoveSetAsideOverlayResponse {
    string host       = 1;
    string path       = 2;
    int64  size_bytes = 3;
}
message ListReplicationCheckpointsRequest {
    string vm_name = 1; // "" = every VM the caller may read
}
message ReplicationCheckpointRow {
    string vm_name     = 1;
    string target_pool = 2; // the row's repo key
    string checkpoint  = 3;
    string updated_at  = 4;
    bool   in_use      = 5; // a live replication schedule uses it
    bool   vm_deleted  = 6; // the VM has no live row
}
message ListReplicationCheckpointsResponse {
    repeated ReplicationCheckpointRow checkpoints = 1;
}
message DeleteReplicationCheckpointRequest {
    string vm_name     = 1;
    string target_pool = 2;
}
message DeleteReplicationCheckpointResponse {
    string checkpoint = 1; // the anchor retired
    // bitmap: what became of the anchor's libvirt bitmap on the VM's host:
    // "dropped", "none" (no VM or no anchor), or why it is left there.
    string bitmap     = 2;
    string host       = 3; // the host that answered (the VM's, when it is live)
}
message PromoteReplicaProgress {
    enum Phase {
        PHASE_UNKNOWN = 0;
        RESOLVING     = 1; // locating the replica + host
        DEFINING      = 2; // overlay created, domain defined
        STARTED       = 3; // VM started off the overlay
        LOCALIZING    = 4; // blockpull localizing the disk
        DONE          = 5;
    }
    Phase  phase     = 1;
    string vm_name   = 2;
    string host      = 3;
    string replica   = 4; // replica filename chosen
    string disk_path = 5; // live overlay path
    string status    = 6;
}

// ── Internal ──
message PingRequest  {}
message PingResponse {
  string host_name = 1;
  string version = 2;
  int32 schema_version = 3;
  // capabilities advertises named split-brain-hardening feature tokens
  // (e.g. "split_brain_gate_v1", "vip_demote_v1") this daemon supports.
  // Read via a FRESH Ping (never stale replicated rows); an old peer returns an
  // empty list and is treated as unsupported. Enforcement of a fail-closed check
  // activates only once every enforcement-relevant member advertises its token.
  repeated string capabilities = 4;
  // wall_clock is the responder's WALL clock (RFC3339 nanos) at the moment it
  // answered — never the HLC. The caller compares it with its own to detect NTP
  // drift, which corrupts LWW conflict resolution. Empty from a peer that
  // predates this field; a caller must read that as "unknown", never as skew.
  string wall_clock = 5;
  // wal_quarantined: this node detected that its own binary is a rollback below
  // a capability token it had ALREADY latched, so it is WAL-quarantined —
  // emitting no replicated writes and advertising nothing. It is a SELF-REPORT
  // of degradation, which is the one direction worth trusting: a node lying
  // about its state claims health, not quarantine. A healthy peer acts on it by
  // recording the isolation (§A), because the quarantined node may not record
  // its own.
  bool wal_quarantined = 6;
  // not_enforcing names capability tokens this node ADVERTISES but does not act
  // on, because their `enforcement.*` / `auth.*` kill-switch is false locally.
  //
  // It exists because `capabilities` deliberately cannot answer this. A node
  // advertises a token so the cluster can LATCH it while its own kill-switch is
  // off, so a cluster can have a token fully latched while any subset of members
  // silently does not enforce it — a state no peer and no operator could observe
  // before this field. For the shared-storage fence that means a cross-host
  // transfer of a shared-disk VM proceeding without the proof-grade fence anyone
  // reading the latch would assume was in force.
  //
  // Like wal_quarantined, this is a SELF-REPORT OF DEGRADATION: the one
  // direction worth trusting, since a node lying about its posture claims to
  // enforce, not to skip. And like wal_quarantined it is DIAGNOSTIC ONLY —
  // consumed by `lv doctor fence` to tell an operator what is not switched on.
  //
  // NOTHING in an enforcement decision path may read this field. The rule in
  // advertisedCapabilities still stands in both directions: a peer's
  // advertisement is not proof it enforces, and this list is not proof it does
  // not. An empty list from a peer that predates the field means "unknown", NOT
  // "everything is enforced" — a caller that cannot tell must say so rather than
  // report all-clear.
  repeated string not_enforcing = 7;
  // posture_reported disambiguates an empty not_enforcing list, which otherwise
  // has two very different meanings: "this node enforces everything it
  // advertises" and "nothing was said". False means UNKNOWN, and a consumer must
  // never read it as all-clear.
  //
  // False has TWO causes and they are not distinguishable on the wire, which is
  // deliberate: the peer predates this field, or it declined to answer THIS
  // caller. Posture is served only to a caller presenting a host certificate,
  // because Ping bypasses the identity interceptor (skipAuth) and this list
  // names which security kill-switches are off — the distributable lv-cli
  // certificate would otherwise read it with no session and no role. Report the
  // ambiguity rather than guessing: naming version skew would send an operator
  // to upgrade a fleet over a credential property of the node they asked from.
  //
  // wall_clock got away without a companion flag because its zero value is not
  // a legal reading; an empty token list is, so it needs one.
  bool posture_reported = 8;
  // release_probation is true while this node is in RELEASE PROBATION: rolled
  // back below a release token none of whose features is recorded used in its
  // own replica, it emits no replicated writes until a voter majority confirms
  // that. Diagnostic and for peers' probation majority only. It is NOT
  // wal_quarantined: the node keeps advertising, and no peer isolates it.
  bool release_probation = 9;
  // voter_generation is the highest voter generation this node has ADOPTED
  // (voter_configs, docs/design/recovery-claims.md §4), 0 when it has adopted
  // none or has not run an adoption pass since it started. A node in release
  // probation compares it with its own: a peer that reports a newer one shows
  // that the voter set this node is counting is stale, so it adopts the newer
  // generation (which its probation pull has just merged) and counts against
  // that instead. A failover coordinator also keeps each peer's reports as
  // evidence of the generation the peer counts its majority over, for the
  // bounded partition-pause hold (docs/design/partition-pause.md §4.2). Read
  // only for those; a generation is adopted only once its certificate
  // verifies, never because a peer reports it. (Tag 10: 9 is taken on another
  // branch too, see the merge checklist.)
  int64 voter_generation = 10;
  // migrate_preconditions: this build checks MigrateVMRequest's expect_*
  // preconditions before it moves a VM. An older owner ignores them and moves the
  // VM unconditionally, so failback skips a VM whose owner does not say so.
  // (Tag 11: 9 and 10 belong to the release token.)
  bool migrate_preconditions = 11;
  // delete_force: this build honours DeleteVMRequest.force (it force-stops a
  // running VM itself, after the delete's own checks, through the stop path that
  // runs hooks and records the operator stop). An older owner ignores the field,
  // so a caller that needs the stop first (lv rm --force, a forwarding entry
  // node) sends StopVM{force} itself when this is false.
  bool delete_force = 12;
  // abort_scoped: this build honours AbortVMOperationRequest.operation_id. An
  // older daemon ignores the field and aborts whatever operation is active, so
  // lv operation abort --operation refuses to send it when this is false.
  bool abort_scoped = 13;
  // nic_list_position: this build reads UpdateVMRequest.nic_by_list_position.
  // An older owner ignores the field and reads every NIC ordinal as a spec
  // index, so an entry node translates the positions for it, or refuses.
  bool nic_list_position = 14;
}

// Ready: application-level readiness. Ping answers "is this daemon's TLS
// endpoint up and what does this BUILD support"; neither question touches the
// database, so a daemon whose DB is wedged answers Ping perfectly while being
// unable to serve a single request. Ready is the probe that does work: it
// performs a trivial local read and says whether it succeeded.
//
// Deliberately a separate RPC rather than another PingResponse field. Ping is
// on the health checker's hot path and already does non-trivial work
// (advertisedCapabilities walks the runtime inventory with enforcement.owner_epoch
// on); the peer probe runs every checkInterval against every peer, and must stay
// cheap enough to run at that rate.
message ReadyRequest {}
message ReadyResponse {
  string host_name = 1;
  // ready is false when this node cannot serve. It is a SELF-REPORT OF
  // DEGRADATION, the direction worth trusting: a node lying about its state
  // claims to be ready, not broken.
  bool ready = 2;
  // not_ready_reason explains a false `ready` for an operator. DIAGNOSTIC ONLY
  // — no decision path may read it, and it is served only to a caller holding a
  // host certificate, because it carries local error text.
  string not_ready_reason = 3;
  // partition_pause is enforcement.partition_pause as THIS run of the daemon
  // holds it: whether it pauses its recoverable workloads on losing the voter
  // majority. A failover coordinator relies on a host's pause only if the
  // host's latest answer to this probe said so (docs/design/partition-pause.md
  // §4.3). It rides on the health probe, not on Ping, because the probe runs
  // every probe interval and the flag changes only with a restart, so the
  // latest answer always comes from the run a coordinator last reached. False
  // from a build that predates the field, which therefore is not relied on.
  bool partition_pause = 4;
  // ha_disarmed is the cluster HA policy as this node's cache holds it, and
  // ha_policy_at that policy row's updated_at exactly as stored ("" when there
  // is no row). ha_known is false until the cache has loaded once; a build
  // that predates the fields answers false for all three.
  bool ha_disarmed = 5;
  string ha_policy_at = 6;
  bool ha_known = 7;
  // pressure is this host's resource pressure as its own sampler grades it
  // (docs/configuration.md, "Resource pressure"). It is ORTHOGONAL to ready: a
  // pressured host still answers ready=true, and keeps its quorum weight.
  // Absent from a build that predates the field and from a host with
  // pressure.enabled false; a reader takes absent as "unknown", never as "ok"
  // and never as a licence to act sooner. A self-report that may only make
  // the cluster more conservative, as ready is.
  HostPressure pressure = 8;
}

// FetchBinary: pull this daemon's binary for peer self-upgrade.
message FetchBinaryRequest {}
message FetchBinaryChunk {
    bytes  chunk          = 1;
    string checksum       = 2; // SHA-256 of the whole binary; set on first chunk
    string version        = 3; // serving daemon's binary version; first chunk
    int32  schema_version = 4; // serving daemon's CurrentSchemaVersion; first chunk
}

// ── Internal: Network Sync ──
message ProvisionNetworkRequest {
    string name       = 1;  // scoped network name (stack_net)
    string config     = 2;  // JSON-serialized compose.NetworkDef
    string net_type   = 3;  // bridge | vxlan | isolated | sriov
    string stack_name = 4;  // owning stack (for DB persistence on remote hosts)
}

// ── Internal: Migration helpers ──
message AnnounceMigratedGuestRequest {
    string vm_name = 1;
}

message EnsureCloudInitRequest {
    string vm_name       = 1;
    string userdata      = 2;
    string networkconfig = 3;
    // The seed's vendor-data, as the source decided it. Unset (a source from
    // before this field) leaves the target to derive it from the VM's spec.
    optional string vendordata = 4;
}

message EnsureDisksRequest {
    string vm_name       = 1;
    repeated DiskStub disks = 2;
    // want_migration_tls asks the target to install its migration-TLS
    // credentials into QEMU's TLS directory before the copy, and to report in
    // migration_tls_ready whether it could.
    bool want_migration_tls = 3;
    // installer_iso_listed: the source sent installer_iso_paths (a source on an
    // older build never sets it). installer_iso_paths are the installer CD-ROM
    // paths the source's domain carries; empty means it carries none.
    // installer_iso_runtime: the domain moves by libvirt runtime migration: the
    // target resolves the VM's ISO itself and returns the file it judged for
    // each path (installer_iso_resolved), which the destination definition the
    // source hands libvirt carries.
    bool installer_iso_listed = 4;
    repeated string installer_iso_paths = 5;
    bool installer_iso_runtime = 6;
    // installer_iso_sha256: for the installer CD-ROM path whose file the
    // source judged for this VM (through its pool), that file's sha256. On a
    // VM's first arrival in a directory another project's pool also maps, the
    // target admits only a file with these very bytes.
    map<string, string> installer_iso_sha256 = 7;
    // migration_network is the source's migration.network (an IPv4 CIDR). When
    // set, the target answers in migration_address with the address of its own
    // that lies in that network, so the migration's data channel can use it.
    // An older target ignores the field and never answers.
    string migration_network = 8;
    // nic_mtu lists each NIC's MTU as resolved from the running definition.
    // The target answers nic_mtu_problem for any NIC whose bridge there has a
    // different MTU.
    repeated NICMTUExpectation nic_mtu = 9;
    // want_network_devices asks for network_devices in the response: a live
    // migration of a VM with a NIC on a managed network lands each such NIC on
    // the device this host serves the network on.
    bool want_network_devices = 10;
}

// NICMTUExpectation is one NIC's resolved MTU on the source and the network
// it attaches to; ordinal is the NIC's position, for the refusal text.
message NICMTUExpectation {
    string network = 1;
    int32  mtu     = 2;
    int32  ordinal = 3;
}

message DiskStub {
    string path       = 1;  // absolute path on target (e.g. /var/lib/litevirt/disks/web-1-root.qcow2)
    int64  size_bytes  = 2;  // size hint for pre-creation (0 = create empty sparse file)
}

// EnsureDisksResponse names the stubs this call created. A path that already
// held a file is skipped and not named, so the cleanup after a failed
// migration removes only these. It replaced google.protobuf.Empty, which has
// no fields: an older target's reply decodes as "created none".
message EnsureDisksResponse {
    repeated string created_paths = 1;
    // migration_tls_ready: the target has migration-TLS credentials installed
    // for QEMU, so the copy can be encrypted. An older target never sets it,
    // which reads as "not ready" and falls back to the plaintext guard.
    //
    // A target that sets it also sends the gRPC response header
    // x-litevirt-migration-ca-sha256: the lowercase hex SHA-256 of the DER of
    // the migration CA its credentials chain to (pki_dir/migration/ca.crt).
    // The source compares it with its own: a storage copy is refused on a
    // mismatch, and a memory-only move stays in libvirt's tunnel. A target
    // that sends no header (an older build, or no CA it can read) is not
    // compared.
    //
    // A target that is not ready because the credentials it holds are
    // unusable (a CA that is not a certificate or not a file, a host
    // certificate the CA did not issue) sends the gRPC response header
    // x-litevirt-migration-tls-unusable with why. The source then refuses a
    // storage copy before it starts, naming the target and the fix.
    bool migration_tls_ready = 2;
    // installer_iso_warning: a stopped VM's move was accepted although this
    // host cannot attach its installer ISO yet (no such library or file here);
    // the VM will not start here until it can. Empty otherwise.
    string installer_iso_warning = 3;
    // installer_iso_resolved: for a runtime migration, each listed installer
    // CD-ROM path → the file this host resolved and judged for it. The source
    // hands libvirt a destination definition with those sources, so qemu here
    // opens this host's file (a link or a library directory can name another
    // file here than on the source). An older target never sets it: the
    // source then migrates the domain unchanged, as before.
    map<string, string> installer_iso_resolved = 4;
    // migration_address: an IPv4 address of this host inside the request's
    // migration_network. Empty when none was asked for, or this host has no
    // address in that network; the source then moves the migration over the
    // address the host is dialed on, and says so.
    string migration_address = 5;
    // cgroup_mode: "v2" or "v1", the cgroup hierarchy this host runs. A runtime
    // migration of a VM with a cpu-shares weight needs it: the source renders
    // the destination definition's <shares> for this host's scale. An older
    // target never sets it ("" = unknown), and the source migrates the domain
    // unchanged, as before.
    string cgroup_mode = 6;
    // vnc_password_unavailable: this host's QEMU cannot do VNC password
    // authentication (a FIPS-mode host has no DES; docs/ui.md "Console
    // passwords"). A live migration onto it moves the guest without its VNC
    // password, which would otherwise fail the guest's start here. An older
    // target never sets it, and none can hold a passworded guest: no password
    // is set before console_password_v1 latches.
    bool vnc_password_unavailable = 7;
    // nic_mtu_problem names the NICs of the request's nic_mtu whose bridge on
    // this host has a different MTU. Empty when every one matches.
    string nic_mtu_problem = 8;
    // network_devices: for want_network_devices, each managed network the
    // VM has a NIC on → the device this host serves it on now (the one it
    // was last provisioned on here; for a network whose move this host has
    // refused, still the previous one). An older target never sets it, and
    // the source then migrates the domain's NICs as they are.
    map<string, string> network_devices = 9;
}

// EnsureFirmwareStateRequest pushes a Secure-Boot/vTPM VM's firmware-state bundle
// (UEFI NVRAM + swtpm tar) to a cold-migration target so libvirt can define the
// domain there with its BitLocker-binding state intact (G1).
message EnsureFirmwareStateRequest {
    string vm_name    = 1;
    string uuid       = 2;  // stable domain UUID → target swtpm dir
    bytes  bundle     = 3;  // firmware-state bundle (same format as the backup/snapshot sidecar)
    string domain_xml = 4;  // if set, DEFINE (shut off) the domain on the target after materializing firmware, so it's startable (G1)
    string source_firmware_fingerprint = 5;  // source's dataDir + OVMF path layout; the verbatim domain_xml is only portable if it matches the target's (G1)
    // attempt_id names this migration attempt. The target records it against
    // the domain and firmware it creates, and RollbackFirmwareState removes
    // them only for the same attempt_id. An older target ignores it.
    string attempt_id = 6;
    // shares_weight: the VM's cpu-shares weight in the user's scale (0 = none to
    // render), as the source knows it. The target re-renders the domain's
    // <shares> for its own cgroup version from this, never from its own replica
    // of the VM row, which may not hold a just-set weight yet. An older source
    // never sets it: the target then defines the XML unchanged, as before.
    int32 shares_weight = 7;
    // libvirt_vars is the stopped VM's libvirt-managed UEFI vars file (a plain
    // UEFI VM: no Secure Boot, no vTPM), with its sha256 in libvirt_vars_sha256.
    // The target writes it durably where libvirt looks for the domain's vars,
    // setting aside any file of the name already there, and answers with the
    // hash it read back. An older target ignores both and answers none.
    bytes  libvirt_vars        = 8;
    string libvirt_vars_sha256 = 9;
}

// EnsureFirmwareStateResponse says what the call created on the target. It
// replaced google.protobuf.Empty, which has no fields: an older target's reply
// decodes as "defined nothing", and the source then leaves the target alone
// and names the domain it may have left there.
message EnsureFirmwareStateResponse {
    // domain_defined: this call materialized the firmware state AND defined
    // the domain, and recorded both under the request's attempt_id.
    bool domain_defined = 1;
    // libvirt_vars_sha256 is the hash of the libvirt_vars file the target wrote
    // and read back; empty when none was sent or the target predates the field.
    // The source removes its own copy only when this equals what it sent.
    string libvirt_vars_sha256 = 2;
}

// RollbackFirmwareStateRequest asks a cold firmware migration's target to
// undefine the domain and wipe the firmware state that EnsureFirmwareState
// created for attempt_id, after that attempt failed before its handoff
// committed. The target removes only what it recorded for that attempt: a
// domain it found already defined, or one a different attempt created, is
// left alone. An older target does not implement it, and the caller treats
// Unimplemented as "nothing removed".
message RollbackFirmwareStateRequest {
    string vm_name    = 1;
    string uuid       = 2;  // the VM's recorded firmware uuid (fwSpec.UUID)
    string attempt_id = 3;  // the attempt_id the source sent to EnsureFirmwareState
}

message RollbackFirmwareStateResponse {
    // removed: the target held this attempt's domain and firmware and
    // removed both. False when it holds nothing of this attempt's.
    bool removed = 1;
}

// The live firmware migration RPCs move a running vTPM / Secure Boot VM. All
// four are peer only, from the source to the target, and every response
// carries the target's domain. An older target answers Unimplemented.

// PrepareLiveFirmwareTargetRequest asks the target to hold a live firmware
// move of attempt_id: it checks its own runtime and the VM's applicability
// against the source's, records the hold and materialises the NVRAM.
message PrepareLiveFirmwareTargetRequest {
    string                vm_name              = 1;
    string                uuid                 = 2;  // the VM's domain uuid
    string                created_at           = 3;  // the row's incarnation
    string                attempt_id           = 4;
    uint32                protocol_version     = 5;  // 1
    FirmwareRuntime       src_runtime          = 6;
    FirmwareApplicability src_applicability    = 7;
    bool                  source_domain_active = 8;  // the source checked its domain is active
    bytes                 nvram                = 9;  // the source NVRAM; UEFI only
}
message PrepareLiveFirmwareTargetResponse {
    FirmwareRuntime       dst_runtime       = 1;
    FirmwareApplicability dst_applicability = 2;
    bool                  swtpm_absent      = 3;  // no swtpm state for the uuid was here at prepare
    TargetDomain          target_domain     = 4;
}

// VerifyLiveFirmwareTargetRequest asks the target, after cutover, whether the
// paused guest's TPM state equals the source's final state. Reads only.
message VerifyLiveFirmwareTargetRequest {
    string vm_name            = 1;
    string uuid               = 2;
    string attempt_id         = 3;
    string src_permall_sha256 = 4;  // empty when the VM has no vTPM
}
message VerifyLiveFirmwareTargetResponse {
    FirmwareVerdict verdict            = 1;
    string          dst_permall_sha256 = 2;
    TargetDomain    target_domain      = 3;
    string          detail             = 4;
}

// ReleaseLiveFirmwareTargetRequest hands the verified guest over: the target
// puts its NIC firewall in force, resumes it and confirms its NVRAM.
message ReleaseLiveFirmwareTargetRequest {
    string vm_name          = 1;
    string uuid             = 2;
    string attempt_id       = 3;
    string src_nvram_sha256 = 4;  // the source's final NVRAM hash; UEFI only
    bytes  nvram_final      = 5;  // the source's final NVRAM; UEFI only
    string created_at       = 6;  // the row's incarnation (an idempotent retry with no hold)
}
message ReleaseLiveFirmwareTargetResponse {
    string          nvram_sha256    = 1;
    bool            nvram_confirmed = 2;  // the target's NVRAM equalled src_nvram_sha256
    TargetDomain    target_domain   = 3;
    FirmwareVerdict verdict         = 4;  // BAD_REQUEST or TARGET_RAN when the release refused
    string          detail          = 5;
}

// AbortLiveFirmwareTargetRequest drops the target's hold of attempt_id. It
// binds to the hold: uuid, created_at and attempt_id must equal the hold's.
// With no hold for the attempt it answers OK and touches nothing.
message AbortLiveFirmwareTargetRequest {
    string            vm_name              = 1;
    string            uuid                 = 2;
    string            created_at           = 3;
    string            attempt_id           = 4;
    FirmwareAbortMode mode                 = 5;
    bool              source_domain_active = 6;
    repeated string   created_stubs        = 7;  // stub disks the move created on the target
}
message AbortLiveFirmwareTargetResponse {
    TargetDomain target_domain = 1;
    string       hold_state    = 2;  // the hold's state when the abort refused; empty with no hold
    bool         refused       = 3;  // the hold was kept
    string       detail        = 4;
}

// FirmwareMoveDoctorAction is the operator's resolution of a parked live
// firmware move (`lv doctor firmware-move`, spec §17 D-5).
enum FirmwareMoveDoctorAction {
    FIRMWARE_MOVE_DOCTOR_ACTION_UNSPECIFIED          = 0;  // show both records, every hash and path
    FIRMWARE_MOVE_DOCTOR_ACTION_ACCEPT_TARGET        = 1;
    FIRMWARE_MOVE_DOCTOR_ACTION_ACCEPT_SOURCE        = 2;
    FIRMWARE_MOVE_DOCTOR_ACTION_ADOPT_TARGET_COPY    = 3;
    FIRMWARE_MOVE_DOCTOR_ACTION_DISCARD_TARGET       = 4;
    FIRMWARE_MOVE_DOCTOR_ACTION_CONFIRM_TARGET_NVRAM = 5;
    FIRMWARE_MOVE_DOCTOR_ACTION_PUSH_SOURCE_NVRAM    = 6;
    FIRMWARE_MOVE_DOCTOR_ACTION_REVERIFY             = 7;
    FIRMWARE_MOVE_DOCTOR_ACTION_RESOLVE_CONDITION    = 8;
}

// FirmwareMoveDoctorRequest shows, or resolves, the live firmware move of a
// VM. Admin only, audited. The node that takes it reads every host's
// records and hands the action to the host whose record it acts on.
message FirmwareMoveDoctorRequest {
    string                   vm_name              = 1;
    FirmwareMoveDoctorAction action               = 2;
    bool                     acknowledge_rollback = 3;  // --acknowledge-rollback
    bool                     stop_target          = 4;  // --stop-target
    string                   accept_nvram_hash    = 5;  // --accept-nvram-hash
    string                   resolve_condition    = 6;  // --resolve: unverified or quarantine
    string                   host                 = 7;  // the host to read or act on; empty: the node that takes it decides
}
message FirmwareMoveDoctorResponse {
    repeated FirmwareMoveHostRecords hosts       = 1;
    string                           outcome     = 2;  // what the action did
    repeated string                  unreachable = 3;  // hosts whose records could not be read
}

// FirmwareMoveHostRecords is one host's records of a VM's live firmware move,
// as on its disk, with the VM's domain there and its state's hashes now.
message FirmwareMoveHostRecords {
    string              host          = 1;
    string              marker_json   = 2;  // the source marker; empty with none
    string              hold_json     = 3;  // the target hold; empty with none
    repeated string     owed_discards = 4;  // owed-discard records, JSON
    repeated string     quarantines   = 5;  // quarantine directories of the VM
    repeated string     retained      = 6;  // retained bundles of the VM
    TargetDomain        domain        = 7;
    map<string, string> hashes        = 8;  // permall_now, nvram_now
    map<string, string> paths         = 9;
    string              error         = 10; // a record or the domain that cannot be read
    string              leftover_json = 11; // the target's leftover record of an owed DISCARD; empty with none
}

// FirmwareMoveDoctorTargetOp is a target's part of an operator's resolution,
// asked by the move's source (the hold's source only).
enum FirmwareMoveDoctorTargetOp {
    FIRMWARE_MOVE_DOCTOR_TARGET_OP_UNSPECIFIED   = 0;
    FIRMWARE_MOVE_DOCTOR_TARGET_OP_STOP          = 1;  // stop the held guest (--stop-target)
    FIRMWARE_MOVE_DOCTOR_TARGET_OP_ADOPT         = 2;  // the hold to verified (paused) or resuming (running)
    FIRMWARE_MOVE_DOCTOR_TARGET_OP_CONFIRM_NVRAM = 3;  // accept the target's NVRAM by its hash
    FIRMWARE_MOVE_DOCTOR_TARGET_OP_PUSH_NVRAM    = 4;  // write the source's final NVRAM
}
message FirmwareMoveDoctorTargetRequest {
    string                     vm_name              = 1;
    string                     uuid                 = 2;
    string                     created_at           = 3;
    string                     attempt_id           = 4;
    FirmwareMoveDoctorTargetOp op                   = 5;
    string                     operator             = 6;  // who asked, for the hold and the audit
    string                     reason               = 7;
    string                     accept_nvram_hash    = 8;
    bytes                      nvram                = 9;  // the source's final NVRAM (PUSH_NVRAM)
    string                     src_nvram_sha256     = 10;
    bool                       acknowledge_rollback = 11;
}
message FirmwareMoveDoctorTargetResponse {
    TargetDomain target_domain   = 1;
    string       hold_state      = 2;  // after the op; empty when the hold is gone
    string       detail          = 3;
    string       permall_sha256  = 4;  // the target's now
    string       nvram_sha256    = 5;  // the target's now
    string       nvram_t0_sha256 = 6;
}

// ReceiveMigrationDiskRequest is one frame of a cold migration's disk copy: a
// STOPPED VM's host-local disk file, streamed by the source to the target over
// the peer connection. The first frame is a header (vm_name, path, size_bytes)
// and carries no data, so authorization precedes any byte reaching disk. Each
// later frame carries one non-zero extent (offset, data), in ascending,
// non-overlapping order; a range no frame covers reads as zeros. The last frame
// carries only sha256: the digest of every (offset, length, data) frame in
// order, which the target checks before the file takes the disk's path.
//
// The target writes only a disk of a VM that does not live there, at a path in
// a disk-artifact root that holds no file — or holds one this host created for
// the same VM's migration — and records the file as the attempt's, so the
// cleanup of a failed attempt (CleanupMigrationArtifacts) removes it. An older
// target does not implement the RPC, and the source refuses the migration.
message ReceiveMigrationDiskRequest {
    string vm_name    = 1;  // header
    string path       = 2;  // header — the disk's recorded path
    int64  size_bytes = 3;  // header — length of the file
    int64  offset     = 4;  // data frame
    bytes  data       = 5;  // data frame
    string sha256     = 6;  // last frame — hex digest of the frames
    // header — the source's estimate of the bytes the file occupies on disk
    // (its allocated blocks), which the target's free-space check reserves.
    // size_bytes is still what the target bounds by the disk's record.
    int64  allocated_bytes = 7;
    // header — the sender is the VM's owner and has confirmed its domain is
    // shut off. The target's copy of the VM row may still say running (a drain
    // stops a running VM moments before the copy, and the stopped write is
    // still replicating), so the target accepts this from the host its row
    // names as the owner, and only from it, in place of a stopped row.
    bool   owner_domain_shut_off = 8;
    // header — check only: the target runs every check it runs before writing
    // (the path, the record, a file already there, free space) and then ends
    // the call, writing nothing. The VM may still be running, so its state is
    // not checked. A drain runs it before it shuts a running VM down.
    bool   check_only = 9;
}

message ReceiveMigrationDiskResponse {
    int64 size_bytes = 1;  // length of the file now at path
}

// CleanupMigrationArtifactsRequest removes the stub disks + cloud-init ISO that
// EnsureDisks/EnsureCloudInit pre-created on a migration target, after the
// migration failed (the VM never got defined there, so they are orphaned).
// CheckCPUCompatibility asks a prospective migration TARGET whether it can run a
// guest requiring cpu_xml (a standalone <cpu> element). The source derives that
// requirement from the VM's live domain XML — for a host-model guest libvirt has
// already expanded it to a concrete model plus feature list — and refuses the
// migration up front rather than letting it abort mid-copy on a destination whose
// CPU is missing instructions the guest is already executing.
//
// Peer-only (host-cert mTLS). Purely advisory and read-only: it decides nothing
// and writes nothing. An older peer does not implement it at all, so the caller
// treats Unimplemented as "cannot verify" and proceeds — the check must never be
// the reason a migration stops working during a rolling upgrade.
message CheckCPUCompatibilityRequest  {
    string cpu_xml = 1;
    string machine = 2;  // the guest's machine type (live <os><type machine>); "" = the hypervisor's default
}
message CheckCPUCompatibilityResponse {
    bool   runnable = 1;  // true = this host can run that guest (identical or superset)
    string verdict  = 2;  // identical | superset | incompatible
    string detail   = 3;  // hypervisor detail when not runnable
}

message CleanupMigrationArtifactsRequest {
    string vm_name              = 1;
    repeated string disk_paths  = 2;  // stub disk files to remove on this (target) host
    bool   remove_cloud_init    = 3;  // also remove the cloud-init ISO for vm_name
    string firmware_uuid        = 4;  // if set, wipe the pushed firmware state (NVRAM+swtpm) for vm_name (G1)
    bool   undefine_domain      = 5;  // if set, undefine a domain this host pre-defined for a failed firmware migration (G1)
    // vm_deleted: vm_name was deleted on the host that owned it, and this host
    // is one it left. Accepted only from a cluster host acting as the system
    // (bearerless peer certificate); every user, admin included, is refused,
    // since only the deleting owner can tell which disks were this
    // incarnation's detaches (and names none for --keep-disks). Remove the VM's owner-epoch
    // marker here, and treat disk_paths as disks detached from the VM while it
    // ran here — each removed only if this host's own replica records it so and
    // nothing still uses it. Refused (ABORTED, retryable) while this host's
    // replica still holds a live row for the name; nothing is touched while a
    // domain of that name is defined here. A host built before this field
    // ignores it and applies the stub rule to disk_paths: it removes a path
    // only if it recorded that path as its own migration stub for vm_name
    // within the stub ledger's TTL, and keeps every other.
    bool   vm_deleted           = 6;
}

message SyncVTEPRequest {
    string network_name = 1;
    string vtep_ip      = 2;
    int32  vni          = 3;
}

message GetVMIPRequest {
    string mac          = 1;
    string network_name = 2;
    // owner_kind selects how the peer resolves the address: "" or "vm" (default,
    // back-compatible) → MAC-based ARP/DHCP lookup; "ct" → resolve owner_name as a
    // container (lxc-info / its interface row). owner_name is the container name.
    string owner_kind = 3;
    string owner_name = 4;
    // lease_only (owner_kind "" or "vm"): answer only from THIS host's dnsmasq
    // lease for mac on network_name's bridge, never from ARP, and set
    // GetVMIPResponse.lease. A VM's host asks the other hosts of a vxlan
    // network, whose DHCP server may run on any of them. A peer on an earlier
    // build ignores it and never sets lease, so its answer is not taken.
    bool lease_only = 5;
}
message GetVMIPResponse {
    string ip = 1;
    // lease: ip is this host's dnsmasq lease for the MAC (lease_only).
    bool lease = 2;
    // lease_expiry: that lease's expiry in Unix seconds; 0 = infinite.
    int64 lease_expiry = 3;
}

message RefreshLBRequest {
    string stack_name = 1;
}

message UpdateFDBRequest {
    int32  vni         = 1;
    string mac         = 2;
    string old_vtep_ip = 3;  // empty = no old entry to remove
    string new_vtep_ip = 4;  // empty = just remove
}

// ── State Sync ──

message TableDigest {
    string name  = 1;
    int32  count = 2;
    string hash  = 3;
    // unresolved_ties is the number of equal-timestamp LWW ties this host is currently
    // tracking for this table with no applicable resolver rule — deliberate, safety-fault
    // divergence (NOT drift). A cross-host hash mismatch on a table with unresolved_ties > 0
    // is expected until `lv doctor repair-owner`; the verify report must not count it as drift.
    int32  unresolved_ties = 4;
    // hash_v2 is the order-invariant digest_v2 table hash. Emitted only when the sender
    // has digest_v2 enabled; compared only when BOTH peers supply it (pairwise negotiation),
    // else the peers fall back to the positional `hash`.
    string hash_v2 = 5;
    // acknowledged_ties is the subset of unresolved_ties an operator has acknowledged on
    // this host (`lv cluster acknowledge-lease-term`). Those rows still differ by design;
    // they no longer drive ha.lww.unresolved. Zero from an older build.
    int32  acknowledged_ties = 6;
    // acknowledged_residual is this host's digest of the table with every
    // acknowledged-tie row replaced by a marker naming only its primary key. Emitted
    // only when every tie this host tracks in the table is acknowledged, and only on a
    // fresh (verification) digest. Equal residuals on every host mean the table
    // differs only by acknowledged ties, which the convergence report counts as
    // converged. Empty means this host cannot vouch for that.
    string acknowledged_residual = 7;
}

message StateDigestResponse {
    string host_name                = 1;
    repeated TableDigest tables     = 2;
    // True when this node's replica is seeded — it holds the cluster's history
    // (corrosion/audit_seeded.go) — and it is not holding its own audit rows. A
    // peer that completes an exchange with it becomes seeded too. An older node
    // sends nothing, which reads as not seeded.
    bool audit_seeded               = 3;
}

// TriggerAntiEntropy kicks an immediate anti-entropy pass (rather than waiting for the
// periodic tick), debounced per node. With all=true the connected host also relays the
// trigger to each active peer (one level, no recursion). Operator- or peer-callable.
message TriggerAntiEntropyRequest { bool all = 1; }
message TriggerAntiEntropyResponse {
    repeated string triggered   = 1; // hosts where a pass ran this call
    repeated string debounced   = 2; // hosts where a pass was skipped (in progress / within cooldown)
    repeated string unreachable = 3; // peers that could not be reached (all=true)
    repeated string unsupported = 4; // peers on an older binary without this RPC (all=true)
}

// GetClusterStateDigest fans GetStateDigest + GetSensitiveStateDigest out to every active
// host (self locally, peers via host-cert relay) so an operator connected to ONE node sees
// cross-host convergence. Operator- or peer-callable.
message ClusterStateDigestResponse {
    repeated StateDigestResponse hosts = 1; // per-host merged (public + sensitive) table digests
    repeated string unreachable        = 2; // active hosts that could not be reached
    repeated string unsupported        = 3; // active hosts on an older binary without this RPC
}

message StateDumpResponse {
    bytes data = 1; // gzipped JSON full-state dump
}

// StateDumpChunk is one slice of the gzipped full-state dump, streamed by
// StreamStateDump so a large dump can't exceed the gRPC max-message size (the
// unary GetStateDump silently failed above ~4 MiB). Reassemble the chunks in
// order to recover the same blob GetStateDump would have returned.
message StateDumpChunk {
    bytes data  = 1; // a contiguous slice of the gzipped dump
    bool  final = 2; // true on the last chunk
}

// TableDumpRequest names the public replicated tables a StreamTableDump should
// carry — the tables whose digests disagreed. The server adds any table a
// requested one needs to merge (a child table's parent, whose rows are the
// authority its merge checks against), refuses a sensitive-lane table, and
// ignores a name it does not replicate. An empty list is refused rather than
// read as "everything"; the full dump is StreamStateDump.
//
// buckets narrows a table to the named buckets of bucket_scheme
// (GetTableBucketDigests): only rows whose bucket key falls in one of them are
// sent, and a child table's authority parent is narrowed to the SAME buckets,
// which is where every parent row those children name lives. A table absent
// from the map, a map entry with no buckets, or a bucket_scheme the server does
// not speak is sent whole. An older server ignores both fields and sends whole
// tables — a superset the merge handles.
message TableDumpRequest {
    repeated string tables = 1;
    map<string, BucketSet> buckets = 2;
    uint32 bucket_scheme = 3;
}

// BucketSet is a list of bucket indexes.
message BucketSet {
    repeated uint32 buckets = 1;
}

// SensitiveStateRequest identifies the peer requesting the secret-bearing
// anti-entropy lane. The server verifies sender against the peer certificate CN.
//
// On StreamSensitiveStateDump, tables (when non-empty) narrows the dump to the
// named sensitive tables, and buckets / bucket_scheme narrow those as on
// TableDumpRequest. An empty tables list is the whole sensitive lane, which is
// also what an older server sends whatever these fields say.
message SensitiveStateRequest {
    string sender = 1;
    repeated string tables = 2;
    map<string, BucketSet> buckets = 3;
    uint32 bucket_scheme = 4;
}

// TableRowsPage is one page of a streamed repair pull (StreamTableRows,
// StreamSensitiveTableRows): at most a bounded number of rows of ONE table,
// gzipped JSON rows in `columns` order. Tables arrive in merge-dependency order
// (workload and operation parents first) and each table's pages contiguously,
// so the receiver can merge page by page and hold only the parent tier whole.
// The last message has final=true and may carry no rows.
message TableRowsPage {
    string table            = 1;
    repeated string columns = 2;
    bytes  rows             = 3; // gzipped JSON array of rows
    int32  row_count        = 4;
    bool   final            = 5;
}

// BucketDigestRequest asks for the bucket digests of the named tables, public
// or sensitive, under bucket scheme `scheme`. sender must match the caller's
// host certificate, as on the sensitive lane.
message BucketDigestRequest {
    string sender = 1;
    repeated string tables = 2;
    uint32 scheme = 3;
}

// BucketDigest is one non-empty bucket's row count and hashes, built exactly
// like TableDigest's over the bucket's rows. hash_v2 is set only when the
// sender's table digest carries one.
message BucketDigest {
    uint32 index   = 1;
    int32  count   = 2;
    string hash    = 3;
    string hash_v2 = 4;
}

// TableBucketDigests is one table's non-empty buckets. bucketed=false means
// the table cannot be bucketed on this host and must be pulled whole.
message TableBucketDigests {
    string name                  = 1;
    bool   bucketed              = 2;
    repeated BucketDigest buckets = 3;
}

// BucketDigestResponse answers in the server's own scheme. A caller that sees
// a scheme or bucket_count other than its own must not compare the buckets.
message BucketDigestResponse {
    uint32 scheme                      = 1;
    uint32 bucket_count                = 2;
    repeated TableBucketDigests tables = 3;
}

// ── Divergence scanner (Phase 0, read-only) ──
//
// DiagnoseDivergence is the operator/admin entrypoint (lv doctor divergence): the
// called daemon fans out to peers, compares per-row metadata + cluster-wide
// semantic invariants, and returns a classified report. ScanSensitiveDivergence
// is the peer-only lane each node answers about its OWN secret-bearing rows,
// returning ONLY domain-separated keyed HMACs (never raw PKs/content).
message DiagnoseDivergenceRequest {
    bool            include_sensitive = 1; // also scan the secret-bearing tables (admin)
    repeated string tables            = 2; // optional filter; empty = all replicated tables
}
message NodeRowMeta {
    string host       = 1;
    string updated_at = 2;
    string row_hash   = 3;
    bool   deleted    = 4;
    string state      = 5;
}
message DivergenceRow {
    string               table    = 1;
    string               pk       = 2; // plaintext PK, or HMAC label for sensitive tables
    string               class    = 3; // DivergenceClass
    repeated NodeRowMeta per_node = 4;
    // tie_acknowledged_on / tie_unacknowledged_on are set only on a row of a
    // table in which some host holds an operator-acknowledged LWW tie ('lv
    // cluster acknowledge-lease-term'). They split the row's hosts by whether
    // that host's verification digest vouches for the table: every tie it
    // tracks there is acknowledged and it supplied an acknowledged residual,
    // the per-host test `lv cluster converge` applies. Table-granular: a host
    // that vouches has acknowledged every tie it tracks in the table.
    // A row is classed acknowledged_tie only when every one of its hosts
    // vouches and every reporting host's residual agrees (so nothing but the
    // acknowledged rows differs); otherwise it keeps its class, and
    // tie_unacknowledged_on names the hosts still to acknowledge.
    repeated string tie_acknowledged_on   = 5;
    repeated string tie_unacknowledged_on = 6;
}
message SemanticViolationPB {
    string          kind   = 1;
    string          key    = 2;
    string          detail = 3;
    repeated string hosts  = 4;
}
message DivergenceReport {
    repeated string              nodes_scanned         = 1; // operator-safe lane: reachable in BOTH samples
    repeated string              nodes_unreachable     = 2; // operator-safe lane failed in some sample
    repeated DivergenceRow       rows                  = 3;
    repeated SemanticViolationPB violations            = 4;
    int32                        samples               = 5; // samples taken (persistence filter)
    // stable is true only when replication was QUIESCENT across the two samples
    // (the reachable node set was identical AND no scanned table's content changed
    // between samples). When false, a reported stuck_different may be lagging
    // backlog rather than a true permanent split — re-run when the cluster settles.
    bool                         stable                = 6;
    // sensitive_unreachable lists hosts whose secret-bearing (HMAC) lane failed in
    // some sample under --include-sensitive — their sensitive tables were NOT
    // scanned, so the sensitive result is partial for them (never silently clean).
    repeated string              sensitive_unreachable = 7;
}

message ScanSensitiveRequest {
    string          sender   = 1; // peer's own host name (verified vs cert CN)
    bytes           scan_key = 2; // per-scan HMAC key — peer-mTLS transported, never logged
    repeated string tables   = 3;
}
message SensitiveRowMetaPB {
    string table      = 1;
    string pk_label   = 2; // HMAC(scan_key, "pk\0"+table+"\0"+pk)
    string row_hash   = 3; // HMAC(scan_key, "row\0"+table+"\0"+v1 encoding)
    string updated_at = 4;
    bool   deleted    = 5;
    // row_hash_v2 is the order-invariant digest_v2 HMAC (over the v2 row encoding). Emitted
    // only when the sender has digest_v2 enabled; the orchestrator compares v2 only when
    // both sides supply it, else falls back to row_hash.
    string row_hash_v2 = 6;
}
message ScanSensitiveResponse {
    string                      host_name = 1;
    repeated SensitiveRowMetaPB rows      = 2;
}

// ── WAL Replication ──

message MutationEntry {
    int64  seq    = 1;
    string hlc    = 2;
    string origin = 3;
    string stmts  = 4; // JSON-encoded []Statement
}

message ReplicateRequest {
    string sender                  = 1;
    int64  after_seq               = 2;
    repeated MutationEntry entries = 3; // mutations to push to the receiver
    string sender_version          = 4; // sender's binary version, e.g. "0.5.2"
    int32  sender_schema_version   = 5; // sender's CurrentSchemaVersion
    // The sender's belief that the RECEIVER is a relay. Relay eligibility comes
    // from hosts.state, which replicates asynchronously, so two nodes can
    // compute different relay sets; a receiver that does not share the sender's
    // belief used to apply the push locally and forward nothing. Absent (false)
    // from a released peer, which reproduces exactly that prior behaviour.
    bool   receiver_is_relay       = 6;
    // sender_capabilities is the capability set the sender advertises at the
    // moment of the push, the same list its Ping returns. A receiver with a
    // release feature in use refuses a sender whose declaration lacks that
    // release token, without dialling it back (an older build sends nothing).
    repeated string sender_capabilities = 7;
}

message ReplicateResponse {
    int64  applied_up_to = 1; // highest seq the receiver applied
}

message AckRequest {
    string sender    = 1;
    int64  acked_seq = 2;
}

// ── VM Logs ──
message GetVMLogsRequest {
    string name   = 1;
    bool   follow = 2;
    int32  lines  = 3;
}
message VMLogChunk { bytes data = 1; }

// ── Host Upgrade ──
message UpgradeHostRequest {
    bytes  chunk       = 1;
    string checksum    = 2;  // SHA-256, set on first message
    string target_host = 3;  // set on first message; empty = self
    bool   force       = 4;  // skip pre-flight blocks (warns still logged)
}
message UpgradeHostResponse {
    string host_name      = 1;
    string old_version    = 2;
    string new_version    = 3;
    string status         = 4;
    string error          = 5;
    int32  schema_version = 6;  // schema version staged/now-present (PreStageUpgrade)
}

// ── Host Uninstall ──
message UninstallHostRequest {
    bool   keep_data   = 1;
    string target_host = 2;
}
message UninstallHostResponse {
    string host_name = 1;
    string status    = 2;
}

// ── Migration TLS ──
message MigrationTLSStatusRequest {
  // local_only answers for the called host alone. The fan-out sets it.
  bool local_only = 1;
}

message MigrationTLSStatusResponse {
  repeated MigrationTLSHostStatus hosts = 1;
}

message MigrationTLSCA {
  // fingerprint is the lowercase hex SHA-256 of the CA certificate's DER.
  string fingerprint = 1;
  google.protobuf.Timestamp not_after = 2;
}

message MigrationTLSHostStatus {
  string host = 1;
  // error is set when the host could not answer; nothing else is then.
  string error = 2;
  bool provisioned = 3;
  // validation_error is why the installer would refuse this set, or empty.
  string validation_error = 4;
  repeated MigrationTLSCA trusted_cas = 5;
  string cert_issuer_fingerprint = 6;
  google.protobuf.Timestamp cert_not_after = 7;
  // allow_unencrypted_storage: this host falls back to plaintext.
  bool allow_unencrypted_storage = 8;
  // install_error is why this host's daemon would refuse to install its set
  // into QEMU's TLS directory (a refused /etc/pki/qemu, an unresolvable QEMU
  // user, a failed validation), or empty. A read-only check: answering
  // installs nothing.
  string install_error = 9;
}

// Internal owner-side create envelope. The entry node resolves placement once;
// the selected owner validates the decision and executes it without forwarding.
message ExecuteCreateVMRequest {
    CreateVMRequest request = 1;
    string resolved_host = 2;
    string placement_fingerprint = 3;
    uint32 hop_count = 4;
}

// ═══════════ Service ═══════════

message AdmitHostRequest {
    string name = 1;
    string address = 2;
    string cert_serial = 3;
}

// AdmitHostResponse carries what the admitting node knows of the name's audit
// chain: the last seq a host under this name wrote, and that row's content hash.
// Both are zero for a name with no history. `lv host add` signs them with the
// cluster CA and hands them to the new machine, whose daemon holds its own audit
// rows until its replica has that row — so a host rebuilt under an old name
// continues its chain instead of starting a second one. Replaces
// google.protobuf.Empty, which is wire-compatible: an older daemon's empty
// response reads as "no history", and an older CLI ignores the fields.
message AdmitHostResponse {
    int64 audit_tail_seq = 1;
    string audit_tail_hash = 2;
    // True when the answering daemon vouches for the position: its replica has
    // caught up with a peer (or it founded a cluster it is alone in), it is not
    // itself holding its own audit rows, and the name's tail is not below a CA
    // retirement it knows of. A daemon that cannot vouch refuses instead, so
    // false means a daemon too old to say — and `lv host add` then leaves any
    // admission record already on the machine alone rather than remove it on a
    // "no history" it cannot trust.
    bool audit_position_proven = 3;
    // incarnation_not_issued is set when a re-admission was written the way
    // the previous release writes it, without a host incarnation, and says
    // why: the host_incarnation release feature could not be used on this
    // node at the moment. Only ever over a tombstone at incarnation 0. Empty
    // when an incarnation was issued, and for a first admission.
    string incarnation_not_issued = 4;
}

// ── Host network configuration (schema v48, §O Tier 1) ──
// Declarative per-host interface intent, rendered by the OWNING host into the
// single litevirt-managed netplan file behind a journaled apply-with-rollback.
message HostNetwork {
    string host_name = 1;
    string name = 2;              // interface name (Linux rules, <=15 chars)
    string kind = 3;              // bridge | bond | vlan | ethernet
    repeated string members = 4;  // bond/bridge member interfaces
    int32 vlan_id = 5;            // vlan only, 1..4094
    string vlan_link = 6;         // vlan only
    string addressing = 7;        // JSON: {dhcp4,dhcp6,addresses,gateway,gateway6,nameservers}
    int32 mtu = 8;
    string bond_mode = 9;         // bond only (default active-backup)
    string lacp_rate = 10;        // bond only
    string hash_policy = 11;      // bond only
    string state = 12;            // desired | applying | applied | rolled_back
    int64 generation = 13;        // count of CONFIRMED applies
    string last_error = 14;
    string created_at = 15;
    string updated_at = 16;
}
message ListHostNetworksRequest { string host_name = 1; } // '' = cluster-wide
message ListHostNetworksResponse { repeated HostNetwork networks = 1; }
message UpsertHostNetworkRequest { HostNetwork network = 1; }
message PlanHostNetworkRequest { string host_name = 1; }
message PlanHostNetworkResponse {
    string rendered = 1;          // the full desired netplan file
    string current = 2;           // the managed file as it is on disk
    bool no_op = 3;               // rendered == current: apply would change nothing
    string cutoff_reason = 4;     // non-empty: apply will refuse without force_interface
    string cluster_interface = 5; // the interface carrying the advertise address
    map<string, string> conflicts = 6; // planned interface -> foreign netplan file defining it
}
message ApplyHostNetworkRequest {
    string host_name = 1;
    // force_interface must NAME the cluster interface to override a
    // self-cutoff refusal — a written confirmation, not a boolean.
    string force_interface = 2;
}
message DeleteHostNetworkRequest { string host_name = 1; string name = 2; }

// ── Isolation epoch / reseed (§A, schema v49) ──
message IsolateHostRequest {
    string name = 1;    // the host to isolate
    string reason = 2;  // rolled_back_latch | manual | schema_forward
}
message HostIsolationStatus {
    string host_name = 1;
    int64 isolation_epoch = 2;  // 0 = not isolated
    string isolation_reason = 3;
}
message ReseedHostRequest {
    string name = 1;    // the isolated host to reseed
    string source = 2;  // healthy peer to reseed FROM ('' = pick any healthy peer)
    // driven_by_peer is set by the healthy peer when it forwards the request to
    // the isolated host. Empty means an operator aimed reseed directly at the
    // isolated node, which is refused: the epoch clear must be peer-written.
    string driven_by_peer = 3;
}
message ReseedHostResponse {
    string host_name = 1;
    string source = 2;         // the peer the state came from
    int64 cleared_epoch = 3;   // the isolation epoch this reseed reconciled
    int32 tables_converged = 4;
}

service LiteVirt {
    // ── Hosts ──
    rpc ListHosts(ListHostsRequest)           returns (ListHostsResponse);
    rpc InspectHost(InspectHostRequest)        returns (Host);
    rpc DrainHost(DrainHostRequest)            returns (stream DrainProgress);
    rpc ShutdownHostWorkloads(ShutdownHostWorkloadsRequest) returns (stream ShutdownProgress);
    rpc UndrainHost(UndrainHostRequest)        returns (Host);
    // FailbackHost moves the VMs a drain moved off the host back to it by live
    // migration, at a bounded rate. Get/SetFailbackPolicy read and change the
    // cluster policy that makes an undrain do it by itself.
    rpc FailbackHost(FailbackHostRequest)      returns (stream FailbackProgress);
    rpc GetFailbackPolicy(google.protobuf.Empty) returns (FailbackPolicyStatus);
    rpc SetFailbackPolicy(SetFailbackPolicyRequest) returns (FailbackPolicyStatus);
    rpc SetHostLabels(SetHostLabelsRequest)    returns (Host);
    rpc FenceHost(FenceHostRequest)            returns (FenceResult);
    rpc GetClusterHealth(GetClusterHealthRequest) returns (ClusterHealth);
    // ResolveHealthCondition marks one open condition resolved on an admin's
    // word, audited: a dual-run condition, which the detector raises again on
    // its next pass if it still holds, or nvram_flush_failed, accepted as a
    // possibly stale UEFI vars store (accept_stale_uefi_vars).
    rpc ResolveHealthCondition(ResolveHealthConditionRequest) returns (ResolveHealthConditionResponse);
    rpc GetFenceReadiness(google.protobuf.Empty)  returns (FenceReadiness);
    // GetFenceSSHStatus is the answering host's view of managed fence SSH
    // (internal/fencessh): every host's row as it holds it, the path a fence
    // from it would take to each, and its last probe of each. With fan_out it
    // also asks every other host for its own view, for the pair matrix
    // `lv doctor fence` prints. DIAGNOSTIC ONLY.
    rpc GetFenceSSHStatus(FenceSSHStatusRequest) returns (FenceSSHStatus);
    rpc RemoveHost(RemoveHostRequest)          returns (RemoveHostResponse);
    // PreflightRemoveHost runs every refusal RemoveHost would give the same
    // request and removes nothing. `lv host rm` calls it before it revokes the
    // host's certificate, so a refused removal leaves the certificate intact.
    rpc PreflightRemoveHost(RemoveHostRequest) returns (google.protobuf.Empty);
    rpc AdmitHost(AdmitHostRequest)            returns (AdmitHostResponse);
    // Host network configuration (v48): intent CRUD runs anywhere (replicated
    // rows); Plan and Apply are forwarded to the OWNING host — they read and
    // mutate its local netplan state.
    rpc ListHostNetworks(ListHostNetworksRequest)   returns (ListHostNetworksResponse);
    rpc UpsertHostNetwork(UpsertHostNetworkRequest) returns (HostNetwork);
    rpc PlanHostNetwork(PlanHostNetworkRequest)     returns (PlanHostNetworkResponse);
    rpc ApplyHostNetwork(ApplyHostNetworkRequest)   returns (google.protobuf.Empty);
    rpc DeleteHostNetwork(DeleteHostNetworkRequest) returns (google.protobuf.Empty);
    // Isolation epoch (v49): isolate is written by a HEALTHY PEER about another
    // host; reseed is forwarded to the isolated host, which pulls a full state
    // dump from a healthy peer and clears its epoch only on verified convergence.
    rpc IsolateHost(IsolateHostRequest)   returns (HostIsolationStatus);
    rpc ReseedHost(ReseedHostRequest)     returns (ReseedHostResponse);
    // PublishCRL hands the cluster a CA-signed certificate revocation list, which
    // replication then carries to every node. `lv host rm` calls it after revoking
    // the removed host's certificate — revocation needs the CA private key, which
    // lives with the operator, so the CRL is minted there and published here.
    //
    // The daemon verifies it against the cluster CA before storing it. That check
    // is not a formality: the list is what decides whether a certificate still
    // opens a peer connection, and an unverified one would let a caller un-revoke
    // themselves by publishing a CRL that simply omits their serial.
    rpc PublishCRL(PublishCRLRequest)          returns (PublishCRLResponse);
    // RevokeReplacedCertificate revokes the certificate a renewal replaced —
    // now, or, when revoking now would leave the newest voter generation
    // without a quorum of unrevoked signatures for a node that adopts it later
    // (docs/design/recovery-claims.md §4.1), as a durable revocation owed that
    // the cluster publishes automatically once it is safe.
    rpc RevokeReplacedCertificate(RevokeReplacedCertificateRequest) returns (RevokeReplacedCertificateResponse);
    rpc RescanHost(RescanHostRequest)          returns (RescanHostResponse);
    rpc ListHostDevices(ListHostDevicesRequest) returns (ListHostDevicesResponse);
    // SupersededDisks lists the disk copies a failover start set aside on a
    // host, and with purge (admin) removes the ones not held.
    rpc SupersededDisks(SupersededDisksRequest) returns (SupersededDisksResponse);
    // KeptDisks lists the disk chains VM deletes kept on a host, and with
    // release (admin) removes one VM's, or one chain, nothing referencing it.
    rpc KeptDisks(KeptDisksRequest) returns (KeptDisksResponse);
    rpc UpgradeHost(stream UpgradeHostRequest) returns (UpgradeHostResponse);
    // PreStageUpgrade stages the new binary and forward-migrates the local
    // state.db schema WITHOUT swapping/re-execing. Run on every node before the
    // rolling UpgradeHost pass so no peer is ever missing schema. Older daemons
    // that lack this RPC return Unimplemented; the CLI then falls back to the
    // single-phase rolling upgrade.
    rpc PreStageUpgrade(stream UpgradeHostRequest) returns (UpgradeHostResponse);
    // FetchBinary streams this daemon's own binary back to the caller so a
    // lagging peer can pull-and-self-upgrade. First chunk carries the SHA-256
    // checksum + version + schema_version.
    rpc FetchBinary(FetchBinaryRequest) returns (stream FetchBinaryChunk);
    rpc UninstallHost(UninstallHostRequest)    returns (UninstallHostResponse);
    rpc ConfigureHost(ConfigureHostRequest)    returns (Host);
    // MigrationTLSStatus reports each host's migration-TLS credentials: the
    // CAs it trusts, which CA issued its certificate, and when they expire.
    // The called daemon answers for itself and asks every other host with
    // local_only set. Read-only; `lv doctor migration-tls` and
    // `lv host rotate-migration-ca` use it.
    rpc MigrationTLSStatus(MigrationTLSStatusRequest) returns (MigrationTLSStatusResponse);

    // ── VMs ──
    rpc CreateVM(CreateVMRequest)     returns (VM);
    rpc ListVMs(ListVMsRequest)       returns (ListVMsResponse);
    rpc InspectVM(InspectVMRequest)   returns (VM);
    rpc ListVMHardware(ListVMHardwareRequest) returns (ListVMHardwareResponse);
    rpc StartVM(StartVMRequest)       returns (VM);
    rpc StopVM(StopVMRequest)         returns (VM);
    rpc RestartVM(RestartVMRequest)   returns (VM);
    rpc DeleteVM(DeleteVMRequest)        returns (google.protobuf.Empty);
    rpc RepairVMOwner(RepairVMOwnerRequest) returns (RepairVMOwnerResponse);
    // FirmwareMoveDoctor shows or resolves a VM's parked live firmware move
    // (`lv doctor firmware-move`). See FirmwareMoveDoctorRequest.
    rpc FirmwareMoveDoctor(FirmwareMoveDoctorRequest) returns (FirmwareMoveDoctorResponse);
    rpc GetRuntimeInventory(GetRuntimeInventoryRequest) returns (RuntimeInventory);
    // CollectOrphanProof answers, for THIS host, "does anything here still claim
    // this address" — every defined domain in every state plus this host's local
    // rows. Peer-only, like GetRuntimeInventory: the sweeper leader gathers it
    // from every host before reclaiming an address in NetBox.
    rpc CollectOrphanProof(OrphanProofRequest) returns (OrphanProofResponse);
    // GetMembershipView answers, for THIS host, "which hosts could be running
    // anything at all" — every `hosts` row it holds, TOMBSTONES INCLUDED, plus
    // its own gossip membership, which is the only source that can name a host
    // with no row anywhere. Peer-only, like CollectOrphanProof, and gathered by
    // the same caller: one membership closure gates both reclaiming an address
    // and binding a prefix. An older peer answers Unimplemented, which is a
    // definite failure the closure treats as "cannot corroborate" — that, not a
    // capability latch, is what makes this safe on a mixed-version cluster.
    rpc GetMembershipView(google.protobuf.Empty) returns (MembershipViewResponse);
    rpc CheckVIPParticipant(CheckVIPParticipantRequest) returns (CheckVIPParticipantResponse);
    rpc RelayCheckVIPParticipant(RelayCheckVIPParticipantRequest) returns (RelayCheckVIPParticipantResponse);
    rpc CheckLBPresent(CheckLBPresentRequest) returns (CheckLBPresentResponse);
    rpc CloneVM(CloneVMRequest)          returns (VM);
    rpc ConvertToTemplate(ConvertToTemplateRequest) returns (VM);
    rpc ExecVM(ExecVMRequest)            returns (ExecVMResponse);
    rpc ConsoleVM(stream ConsoleInput)   returns (stream ConsoleOutput);
    rpc SetVMIP(SetVMIPRequest)          returns (VM);
    rpc SetBootOrder(SetBootOrderRequest) returns (VM);
    rpc RebuildVM(RebuildVMRequest)      returns (VM);
    rpc CutoverVM(CutoverVMRequest)      returns (VM);
    rpc UpdateVM(UpdateVMRequest)         returns (VM);
    // SetVMMemory sets the running balloon target (#4); live for a running VM.
    rpc SetVMMemory(SetVMMemoryRequest)   returns (VM);
    // SetVMLabels replaces a VM's labels/tags. Metadata-only (not in the domain
    // XML), so it applies to running VMs without a redefine.
    rpc SetVMLabels(SetVMLabelsRequest)  returns (VM);
    // PatchVMSpec writes named fields of a desired spec onto a VM's stored
    // spec, on the host that answers. Peer only: the owner of a VM serialises
    // its spec edits, so a deploy entering elsewhere forwards its patch here.
    rpc PatchVMSpec(PatchVMSpecRequest) returns (google.protobuf.Empty);
    rpc AttachDevice(AttachDeviceRequest) returns (VM);
    rpc DetachDevice(DetachDeviceRequest) returns (VM);
    rpc ResizeDisk(ResizeDiskRequest)    returns (VM);
    // SetDiskIO throttles one disk's I/O (live on a running VM, persisted).
    rpc SetDiskIO(SetDiskIORequest)      returns (VM);
    rpc ProxyVNC(stream VNCData)         returns (stream VNCData);
    rpc GetVMLogs(GetVMLogsRequest)      returns (stream VMLogChunk);

    // ── Stacks ──
    rpc DeployStack(DeployStackRequest)       returns (stream DeployProgress);
    rpc DeleteStack(DeleteStackRequest)        returns (stream DeleteProgress);
    rpc ListStacks(google.protobuf.Empty)      returns (ListStacksResponse);
    rpc DiffStack(DiffStackRequest)            returns (DiffStackResponse);
    rpc ExportStack(ExportStackRequest)        returns (ExportStackResponse);

    // ── Migration ──
    rpc MigrateVM(MigrateVMRequest) returns (stream MigrateProgress);
    rpc MoveVolume(MoveVolumeRequest) returns (stream MoveVolumeProgress);
    rpc ReplicateVolume(ReplicateVolumeRequest) returns (stream ReplicateVolumeProgress);
    rpc MigrateStackVolumes(MigrateStackVolumesRequest) returns (stream StackVolumeProgress);

    // ── Images ──
    rpc PullImage(PullImageRequest)            returns (stream PullProgress);
    rpc ListImages(google.protobuf.Empty)      returns (ListImagesResponse);
    rpc DeleteImage(DeleteImageRequest)         returns (google.protobuf.Empty);
    rpc ImportImage(stream ImportImageRequest)  returns (ImportImageResponse);
    rpc PushImage(PushImageRequest)            returns (stream PushImageProgress);
    rpc BuildImage(BuildImageRequest)          returns (BuildImageResponse);
    rpc PruneImages(PruneImagesRequest)        returns (PruneImagesResponse);
    // RemoveImage deletes an image (as DeleteImage) and then removes its files
    // on every host where nothing uses them, reporting each host's outcome:
    // lv image rm.
    rpc RemoveImage(RemoveImageRequest)        returns (RemoveImageResponse);

    // ── Backup ──
    rpc BackupVM(BackupVMRequest)              returns (stream BackupChunk);
    rpc RestoreVM(stream RestoreVMRequest)     returns (VM);

    // ── Import (migrate VMs in from VMware OVA/OVF or Proxmox .conf/vzdump) ──
    rpc ImportVM(stream ImportVMRequest)        returns (stream ImportVMProgress);

    // ── Snapshots ──
    rpc CreateSnapshot(CreateSnapshotRequest)   returns (Snapshot);
    rpc ListSnapshots(ListSnapshotsRequest)     returns (ListSnapshotsResponse);
    rpc RestoreSnapshot(RestoreSnapshotRequest) returns (VM);
    rpc DeleteSnapshot(DeleteSnapshotRequest)   returns (google.protobuf.Empty);

    // ── Networks ──
    rpc CreateNetwork(CreateNetworkRequest)   returns (NetworkInfo);
    rpc GetNetwork(GetNetworkRequest)         returns (NetworkInfo);
    rpc DeleteNetwork(DeleteNetworkRequest)   returns (google.protobuf.Empty);
    rpc ListNetworks(google.protobuf.Empty)   returns (ListNetworksResponse);
    // RekeyBinding recovers a NetBox binding suspended by a MOVED cluster
    // identity fingerprint: it rewrites every owned object's identity under the
    // new fingerprint and resumes allocation. Idempotent and resumable — a
    // partial rewrite leaves the binding suspended for the next run to finish.
    rpc RekeyBinding(RekeyBindingRequest)     returns (google.protobuf.Empty);
    // ResumeBinding lifts a suspension whose cause has been repaired in NetBox.
    // It re-runs the bind-time checks against the binding's pinned prefix facts
    // and refuses while any of them still disagree; it never accepts a changed
    // CIDR. A fingerprint mismatch is the re-key's job, not this one.
    rpc ResumeBinding(ResumeBindingRequest)   returns (google.protobuf.Empty);

    // ── Load Balancers ──
    rpc ListLoadBalancers(google.protobuf.Empty) returns (ListLBResponse);
    rpc InspectLoadBalancer(InspectLBRequest)     returns (LoadBalancer);
    rpc CreateLoadBalancer(CreateLBRequest)       returns (LoadBalancer);
    rpc UpdateLoadBalancer(UpdateLBRequest)       returns (LoadBalancer);
    rpc DeleteLoadBalancer(DeleteLBRequest)       returns (google.protobuf.Empty);
    rpc LBStats(LBStatsRequest)                  returns (LBStatsResponse);
    rpc DrainBackend(DrainBackendRequest)         returns (DrainBackendResponse);
    rpc DisableBackend(DisableBackendRequest)     returns (LoadBalancer);
    rpc EnableBackend(EnableBackendRequest)        returns (LoadBalancer);
    rpc ApplyLB(ApplyLBRequest)                   returns (google.protobuf.Empty);
    rpc RemoveLB(RemoveLBRequest)                 returns (google.protobuf.Empty);
    // LBKeepalivedRunning reports whether THIS host's keepalived for an LB is
    // running (VIP assignable). Used by InspectLoadBalancer to assess a remote
    // LB host's VIP health. Additive: old peers return Unimplemented.
    rpc LBKeepalivedRunning(LBKeepalivedRequest)  returns (LBKeepalivedResponse);

    // ── Users & Auth ──
    rpc Login(LoginRequest)              returns (LoginResponse);
    rpc ListRealms(google.protobuf.Empty) returns (ListRealmsResponse);
    // BeginOIDCLogin is pre-session (no bearer): it only starts a flow; Login
    // completes it on the same node.
    rpc BeginOIDCLogin(BeginOIDCLoginRequest) returns (BeginOIDCLoginResponse);
    rpc Logout(google.protobuf.Empty)    returns (google.protobuf.Empty);
    rpc ListSessions(ListSessionsRequest)   returns (ListSessionsResponse);
    rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty);
    rpc CreateUser(CreateUserRequest)   returns (User);
    rpc ListUsers(google.protobuf.Empty) returns (ListUsersResponse);
    rpc DeleteUser(DeleteUserRequest)    returns (google.protobuf.Empty);
    // MarkUserExternal records, as an administrator's audited decision, that an
    // existing user with no local password is an external-realm (LDAP/OIDC)
    // user, so an external login under that name is not refused for want of
    // evidence. Refused for an account that holds a password. Admin only.
    rpc MarkUserExternal(MarkUserExternalRequest) returns (google.protobuf.Empty);
    // SetUserAccount disables, re-enables, or sets the expiry of an account.
    // Admin only. Refused until the login_policy release feature opens.
    rpc SetUserAccount(SetUserAccountRequest) returns (User);
    // GetLoginPolicy / SetLoginPolicy read and change the cluster-wide
    // mandatory second-factor policy (`lv 2fa policy`). Set is admin only and
    // refused until the login_policy release feature opens.
    rpc GetLoginPolicy(google.protobuf.Empty) returns (LoginPolicy);
    rpc SetLoginPolicy(SetLoginPolicyRequest) returns (LoginPolicy);
    rpc IssueEnrollmentCode(IssueEnrollmentCodeRequest) returns (IssueEnrollmentCodeResponse);
    rpc ListUserVariants(ListUserVariantsRequest) returns (ListUserVariantsResponse);
    rpc ClearIdentityBinding(ClearIdentityBindingRequest) returns (google.protobuf.Empty);
    rpc CreateToken(CreateTokenRequest)  returns (Token);
    rpc RevokeToken(RevokeTokenRequest)  returns (google.protobuf.Empty);
    // Whoami returns the authenticated caller's identity. Authenticated (NOT in
    // skipAuth), so a stale/expired/revoked session bearer yields Unauthenticated
    // — the UI uses it to validate the session cookie and redirect to /login.
    rpc Whoami(google.protobuf.Empty)    returns (WhoamiResponse);
    // CheckPermissions reports, for the CALLER only, whether each named
    // permission gate would admit it — the same RequirePerm question (path,
    // verb, legacy fallback role) the gated RPC asks. Display only: the UI uses
    // it to decide which controls to show, and every gated RPC still runs its
    // own check. An unknown gate name is InvalidArgument.
    rpc CheckPermissions(CheckPermissionsRequest) returns (CheckPermissionsResponse);
    // ChangePassword updates the caller's (or, for admins, a target's) local-realm
    // password after verifying the old one.
    rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
    // ResetAdminPassword replaces the local admin's password hash and records a
    // `user.reset-admin` audit row. Local root only: loopback, this host's own
    // certificate, no bearer. It resets an existing admin and never creates one.
    rpc ResetAdminPassword(ResetAdminPasswordRequest) returns (ResetAdminPasswordResponse);
    rpc ListTwoFactors(ListTwoFactorsRequest) returns (ListTwoFactorsResponse);
    rpc EnrollTOTP(EnrollTOTPRequest)         returns (EnrollTOTPResponse);
    rpc DisableTwoFactor(DisableTwoFactorRequest) returns (google.protobuf.Empty);
    rpc GrantRole(GrantRoleRequest)               returns (GrantRoleResponse);
    rpc RevokeRole(RevokeRoleRequest)             returns (RevokeRoleResponse);
    rpc ListRoleBindings(ListRoleBindingsRequest) returns (ListRoleBindingsResponse);
    rpc NormalizeRoleBindings(NormalizeRoleBindingsRequest) returns (NormalizeRoleBindingsResponse);
    rpc GetVMOperation(GetVMOperationRequest) returns (GetVMOperationResponse);
    rpc AbortVMOperation(AbortVMOperationRequest) returns (AbortVMOperationResponse);
    rpc ReleaseHostReservation(ReleaseHostReservationRequest) returns (ReleaseHostReservationResponse);
    rpc BeginWebAuthnRegistration(BeginWebAuthnRegistrationRequest)   returns (BeginWebAuthnRegistrationResponse);
    rpc FinishWebAuthnRegistration(FinishWebAuthnRegistrationRequest) returns (FinishWebAuthnRegistrationResponse);
    rpc BeginWebAuthnLogin(BeginWebAuthnLoginRequest)                 returns (BeginWebAuthnLoginResponse);
    rpc FinishWebAuthnLogin(FinishWebAuthnLoginRequest)               returns (FinishWebAuthnLoginResponse);
    rpc RestoreLive(RestoreLiveRequest) returns (stream RestoreLiveProgress);
    rpc BindSecurityGroups(BindSecurityGroupsRequest) returns (google.protobuf.Empty);
    rpc ReloadFirewall(google.protobuf.Empty) returns (FirewallStatus);
    // SetNICGuard replaces one VM NIC's anti-spoofing policy (the NIC guard);
    // ListNICGuards reports every NIC of a VM (or of every VM) with its policy
    // and the source addresses the guard lets it use.
    rpc SetNICGuard(SetNICGuardRequest)     returns (NICGuard);
    rpc ListNICGuards(ListNICGuardsRequest) returns (ListNICGuardsResponse);
    // GetFirewallEnforcement reports whether per-NIC rules are enforced or
    // only observed, and each host's would-drop counters;
    // SetFirewallEnforcement switches it (admin).
    rpc GetFirewallEnforcement(GetFirewallEnforcementRequest) returns (FirewallEnforcementStatus);
    rpc SetFirewallEnforcement(SetFirewallEnforcementRequest) returns (FirewallEnforcementStatus);
    // ResetFirewallWouldDrops restarts every host's would-drop totals from now
