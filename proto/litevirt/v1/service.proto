    rpc ListFirewallTags(ListFirewallTagsRequest)                   returns (ListFirewallTagsResponse);
    rpc SetFirewallTags(SetFirewallTagsRequest)                     returns (FirewallTags);

    // ── Security groups: the per-NIC tier ──
    rpc CreateSecurityGroup(CreateSecurityGroupRequest)             returns (SecurityGroup);
    rpc DeleteSecurityGroup(DeleteSecurityGroupRequest)             returns (google.protobuf.Empty);
    rpc AddSecurityGroupRule(AddSecurityGroupRuleRequest)           returns (SecurityGroupRule);
    rpc RemoveSecurityGroupRule(RemoveSecurityGroupRuleRequest)     returns (google.protobuf.Empty);
    rpc ListSecurityGroups(ListSecurityGroupsRequest)               returns (ListSecurityGroupsResponse);
    rpc DeleteStoragePoolContent(DeleteStoragePoolContentRequest) returns (google.protobuf.Empty);

    // ── ISO libraries (docs/storage.md, "Installer ISOs") ──
    // A VM names its installer ISO as <pool>/<file>.iso. ListISOs lists what
    // the caller may name on a host: its projects' libraries, then the
    // cluster-global library "isos".
    rpc ListISOs(ListISOsRequest)                       returns (ListISOsResponse);
    // PullISO copies an ISO into a library from a URL (the image-pull limits
    // apply) or, for an Admin, from a host path. A copy, never a link.
    rpc PullISO(PullISORequest)                         returns (PullISOResponse);
    // GetISOLibraryMode / SetISOLibraryMode: where the global library lives —
    // "sync" (a verified copy on every host) or "shared" (one pool on shared
    // storage). Setting it needs the admin role and failover_scope_v1.
    rpc GetISOLibraryMode(google.protobuf.Empty)        returns (ISOLibraryMode);
    rpc SetISOLibraryMode(SetISOLibraryModeRequest)     returns (ISOLibraryMode);
    // Peer-only: stream this host's copy of a global-library file whose sha256
    // matches, so another host can sync it.
    rpc FetchISOLibraryFile(FetchISOLibraryFileRequest) returns (stream FetchISOLibraryFileChunk);
    // Incremental replica push (dirty extents into a raw replica on a peer pool).
    rpc PushReplicaIncrement(stream PushReplicaIncrementRequest) returns (PushReplicaIncrementResponse);
    // Peer only: one VM's replica records in a pool (promotion, incremental fork
    // base, and a sender's proof that the receiver records replicas).
    rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse);
    // Peer only: a full replica, written and recorded in the replica area.
    rpc PushReplica(stream PushReplicaRequest) returns (PushReplicaResponse);
    // Peer only: prune one schedule's recorded replicas of one disk.
    rpc PruneReplicas(PruneReplicasRequest) returns (PruneReplicasResponse);

    // ── Internal ──
    rpc Ping(PingRequest) returns (PingResponse);
    // Application-level readiness — see ReadyResponse. Ping says the endpoint is
    // up; Ready says the daemon can actually do something.
    rpc Ready(ReadyRequest) returns (ReadyResponse);

    // ── Internal: Network Sync ──
    rpc ProvisionNetwork(ProvisionNetworkRequest)  returns (google.protobuf.Empty);
    rpc SyncVTEP(SyncVTEPRequest)                  returns (google.protobuf.Empty);
    rpc GetVMIPRemote(GetVMIPRequest)              returns (GetVMIPResponse);
    rpc RefreshLB(RefreshLBRequest)                returns (google.protobuf.Empty);
    rpc UpdateFDB(UpdateFDBRequest)                returns (google.protobuf.Empty);

    // ── Internal: Migration helpers ──
    rpc EnsureCloudInit(EnsureCloudInitRequest)    returns (google.protobuf.Empty);
    rpc EnsureDisks(EnsureDisksRequest)            returns (EnsureDisksResponse);
    rpc EnsureFirmwareState(EnsureFirmwareStateRequest) returns (EnsureFirmwareStateResponse);
    rpc RollbackFirmwareState(RollbackFirmwareStateRequest) returns (RollbackFirmwareStateResponse);
    rpc CleanupMigrationArtifacts(CleanupMigrationArtifactsRequest) returns (google.protobuf.Empty);
    // Live firmware migration (peer only): see PrepareLiveFirmwareTargetRequest
    // and the three after it.
    rpc PrepareLiveFirmwareTarget(PrepareLiveFirmwareTargetRequest) returns (PrepareLiveFirmwareTargetResponse);
    rpc VerifyLiveFirmwareTarget(VerifyLiveFirmwareTargetRequest)   returns (VerifyLiveFirmwareTargetResponse);
    rpc ReleaseLiveFirmwareTarget(ReleaseLiveFirmwareTargetRequest) returns (ReleaseLiveFirmwareTargetResponse);
    rpc AbortLiveFirmwareTarget(AbortLiveFirmwareTargetRequest)     returns (AbortLiveFirmwareTargetResponse);
    // FirmwareMoveDoctorTarget is a target's part of `lv doctor firmware-move`,
    // asked by the move's source (peer only).
    rpc FirmwareMoveDoctorTarget(FirmwareMoveDoctorTargetRequest)   returns (FirmwareMoveDoctorTargetResponse);
    // ReceiveMigrationDisk takes one host-local disk file of a STOPPED VM that is
    // being cold-migrated here, as a client stream. See ReceiveMigrationDiskRequest.
    rpc ReceiveMigrationDisk(stream ReceiveMigrationDiskRequest) returns (ReceiveMigrationDiskResponse);
    rpc CheckCPUCompatibility(CheckCPUCompatibilityRequest) returns (CheckCPUCompatibilityResponse);
    // Peer only: a live migration of vm_name to this host has completed;
    // announce the gateway of each of its networks from this host's bridge.
    rpc AnnounceMigratedGuest(AnnounceMigratedGuestRequest) returns (google.protobuf.Empty);

    // ── Internal: State Sync ──
    rpc GetStateDigest(google.protobuf.Empty)      returns (StateDigestResponse);
    // AcknowledgeLeaseTermTie records that an operator has seen a contested
    // lease term on THIS node and drops it from the node's unresolved-tie
    // register. Both claims stay in the ledger; only the evidence tracking is
    // cleared, and the acknowledgement itself is written to the audit log.
    //
    // Per-node by design and deliberately NOT peer-callable: the register is
    // node-local, and a node must not acknowledge its own contest. An operator
    // acknowledges on each host the ha.lww.unresolved condition names.
    rpc AcknowledgeLeaseTermTie(AcknowledgeLeaseTermTieRequest) returns (AcknowledgeLeaseTermTieResponse);

    // GetLeaseTermHighWater reports this node's newest lease term for a key.
    // Peer-callable, read-only, no side effects. It is the quorum read
    // barrier's input: an executor fans this out before validating a proof, so
    // its rejection threshold is quorum-observed rather than its own
    // possibly-stale replica. It must never itself invoke the barrier.
    rpc GetLeaseTermHighWater(GetLeaseTermHighWaterRequest) returns (GetLeaseTermHighWaterResponse);
    rpc GetStateDump(google.protobuf.Empty)         returns (StateDumpResponse);
    // StreamStateDump is the chunked replacement for GetStateDump: it streams
    // the gzipped dump in bounded slices so it survives at scale. GetStateDump
    // is retained for mixed-version clusters — a new client falls back to it
    // when a peer doesn't implement the stream.
    rpc StreamStateDump(google.protobuf.Empty)      returns (stream StateDumpChunk);
    // StreamTableDump is StreamStateDump restricted to the named public tables,
    // so anti-entropy repairs a mismatched table without pulling every other
    // one. Peer-only, like StreamStateDump. A caller falls back to
    // StreamStateDump when a peer answers Unimplemented (an older build).
    rpc StreamTableDump(TableDumpRequest)           returns (stream StateDumpChunk);
    // Sensitive state sync is peer-mTLS only. It carries secret-bearing tables
    // intentionally excluded from GetStateDump/StreamStateDump and is not an
    // operator or REST surface.
    rpc GetSensitiveStateDigest(SensitiveStateRequest) returns (StateDigestResponse);
    rpc StreamSensitiveStateDump(SensitiveStateRequest) returns (stream StateDumpChunk);
    // GetTableBucketDigests returns per-bucket digests of the named tables so
    // anti-entropy pulls only the buckets of a mismatched table that disagree
    // (docs/design/ae-incremental.md). Peer-only (sender must match the host
    // certificate). An older build answers Unimplemented and the caller pulls
    // whole tables.
    rpc GetTableBucketDigests(BucketDigestRequest) returns (BucketDigestResponse);
    // StreamTableRows is StreamTableDump as bounded pages instead of one blob:
    // the server reads each table a page at a time and the client merges each
    // page as it arrives (docs/design/ae-incremental.md). Peer-only, like
    // StreamTableDump. An older build answers Unimplemented and the caller
    // falls back to StreamTableDump.
    rpc StreamTableRows(TableDumpRequest) returns (stream TableRowsPage);
    // StreamSensitiveTableRows is the sensitive lane's paged pull; the sender
    // must match the host certificate, as for StreamSensitiveStateDump.
    rpc StreamSensitiveTableRows(SensitiveStateRequest) returns (stream TableRowsPage);
    // TriggerAntiEntropy kicks an immediate (debounced) anti-entropy pass; GetClusterStateDigest
    // fans digests out to all active hosts. Both back `lv cluster converge` (accelerate + verify).
    rpc TriggerAntiEntropy(TriggerAntiEntropyRequest) returns (TriggerAntiEntropyResponse);
    rpc GetClusterStateDigest(google.protobuf.Empty) returns (ClusterStateDigestResponse);

    // ── Internal: recovery claims (docs/design/recovery-claims.md §3) ──
    // Single-decree Paxos per claim key. Peer-only: the caller must present a
    // known host certificate, and a ballot must name its sender. A voter
    // replies only after the state its reply depends on is committed.
    rpc PrepareRecoveryClaim(PrepareRecoveryClaimRequest) returns (PrepareRecoveryClaimResponse);
    rpc AcceptRecoveryClaim(AcceptRecoveryClaimRequest) returns (AcceptRecoveryClaimResponse);
    // Read-only: a voter's recorded state for one key, its incarnation and
    // its last refusal. Peer- or operator-callable; it changes nothing.
    rpc GetRecoveryClaim(GetRecoveryClaimRequest) returns (GetRecoveryClaimResponse);
    // The bulk form of GetRecoveryClaim a member of a new voter generation
    // imports from (§4.4). Peer-only. The first message is a header saying
    // whether the asked-for generation is frozen on this voter.
    rpc ListRecoveryClaims(ListRecoveryClaimsRequest) returns (stream RecoveryClaimState);
    // AbandonRecoveryProof: peer-only. A recovery destination signs that it has
    // not executed, and never will, a proof a decided claim named — refused if
    // it may already have (§3.12).
    rpc AbandonRecoveryProof(AbandonRecoveryProofRequest) returns (AbandonRecoveryProofResponse);
    // AttestSharedDiskUnused: peer-only. The host a shared disk's row names
    // attests, under its start lock, that no domain defined on it uses the
    // disk, and records the release (review c2b).
    rpc AttestSharedDiskUnused(AttestSharedDiskUnusedRequest) returns (AttestSharedDiskUnusedResponse);
    // ReleaseLegacyHeldClaim is `lv cluster claim-release <kind>/<name>`
    // (admin): the decision an open ha.claim.legacy_held names, stuck in
    // flight on a live destination, is abandoned by that destination once it
    // has confirmed nothing there runs it. Refused when the destination does
    // not answer; `lv host rm --dead` is the way out for a dead one.
    rpc ReleaseLegacyHeldClaim(ReleaseLegacyHeldClaimRequest) returns (ReleaseLegacyHeldClaimResponse);
    // PlanDeadHostRemoval reports what `lv host rm --dead` would do.
    rpc PlanDeadHostRemoval(PlanDeadHostRemovalRequest) returns (PlanDeadHostRemovalResponse);
    // ForceReconfigureVoters is `lv cluster voter force-reconfigure` (§4.6):
    // the audited break-glass for a voter generation whose majority is gone for
    // good. Run against one survivor, which drives the rest; refused while a
    // majority is actually reachable.
    rpc ForceReconfigureVoters(ForceReconfigureVotersRequest) returns (ForceReconfigureVotersResponse);
    // SignForcedVoterConfig: peer-only. A survivor checks the forced
    // generation for itself, seals the generation it replaces, and signs.
    rpc SignForcedVoterConfig(SignForcedVoterConfigRequest) returns (SignForcedVoterConfigResponse);
    // InspectRecoveryClaim is `lv cluster claim <kind>/<name>` (§5.4): every
    // member's recorded state for a workload's claim keys, and its last refusal.
    rpc InspectRecoveryClaim(InspectRecoveryClaimRequest) returns (InspectRecoveryClaimResponse);
    // ConfirmPartitionResume: peer-only, read-only. A host that paused
    // workloads on losing the voter majority asks each voter, before it
    // resumes any, what that voter's OWN replica and claim tables say about
    // the caller and each workload (docs/design/partition-pause.md §3.5).
    rpc ConfirmPartitionResume(ConfirmPartitionResumeRequest) returns (ConfirmPartitionResumeResponse);

    // ── Voter set (colonelpanik/litevirt#251 step 2, §4) ──
    // GetVoterConfig reports the connected host's adopted voter generation and
    // each member's state (`lv cluster voter ls`).
    rpc GetVoterConfig(GetVoterConfigRequest) returns (GetVoterConfigResponse);
    // ChangeVoterConfig decides the next generation: init, add, rm or reset,
    // one member per generation (`lv cluster voter init|add|rm|reset`).
    rpc ChangeVoterConfig(ChangeVoterConfigRequest) returns (ChangeVoterConfigResponse);

    // ── Divergence scanner (Phase 0) ──
    // DiagnoseDivergence: operator/admin entrypoint; the called daemon fans out
    // and returns a classified cross-node divergence report. ScanSensitiveDivergence:
    // peer-mTLS only — each node returns HMAC'd metadata for its own secret rows.
    rpc DiagnoseDivergence(DiagnoseDivergenceRequest) returns (DivergenceReport);
    rpc ScanSensitiveDivergence(ScanSensitiveRequest)  returns (ScanSensitiveResponse);

    // ── Internal: WAL Replication ──
    rpc PushMutations(ReplicateRequest)             returns (ReplicateResponse);
    rpc AckMutations(AckRequest)                   returns (google.protobuf.Empty);

    // ──: Rebalancer (placement engine v2) ──
    rpc ListRebalanceProposals(ListRebalanceProposalsRequest) returns (ListRebalanceProposalsResponse);
    rpc RunRebalance(RunRebalanceRequest)                     returns (RunRebalanceResponse);
    rpc ApproveRebalanceProposal(ApproveRebalanceProposalRequest) returns (RebalanceProposal);
    rpc RejectRebalanceProposal(RejectRebalanceProposalRequest)   returns (RebalanceProposal);

    // ──: SPICE console info ──
    rpc GetSpiceInfo(GetSpiceInfoRequest) returns (GetSpiceInfoResponse);
    // ProxySpice carries ONE SPICE channel connection (a SPICE client opens
    // several) between the caller and the VM's SPICE listener on its host's
    // 127.0.0.1, forwarded to the owning host as ProxyVNC is. The VM name is
    // in the "x-vm-name" metadata. The bytes are relayed unchanged: the
    // client presents the console's password (GetSpiceInfoResponse.password)
    // itself. `lv spice --launch` / `--listen` use it.
    rpc ProxySpice(stream SpiceData) returns (stream SpiceData);

    // ── Upgrade safety: pre-flight ──
    rpc PreflightUpgrade(PreflightUpgradeRequest) returns (PreflightUpgradeResponse);

    // ── federation ──
    // ListRegions returns the distinct region labels in use across hosts.
    // RegionStatus rolls up host + VM counts per region.
    // CrossRegionMigrate is a thin wrapper around MigrateVM that refuses
    // when source/target hosts are in the same region; when
    // include_disks=true, it drives ReplicateVolume per disk to the
    // target host before starting the live migration.
    rpc ListRegions(ListRegionsRequest)                returns (ListRegionsResponse);
    rpc RegionStatus(RegionStatusRequest)              returns (RegionStatusResponse);
    rpc CrossRegionMigrate(CrossRegionMigrateRequest)  returns (stream MigrateProgress);

    // GetFailoverScope reports the cluster-wide failover_scope policy as the
    // answering host's replica holds it, with every region's voting strength.
    // SetFailoverScope changes it (admin). With scope "region" a host is
    // fenced and recovered only by a quorum of its own region's voters, and
    // recovery stays in its region (docs/design/region-scoped-failover.md).
    // SetFailoverScope refuses until failover_scope_v1 has durably latched
    // and while any voter is unreachable from the answering host.
    rpc GetFailoverScope(google.protobuf.Empty)       returns (FailoverScopeStatus);
    rpc SetFailoverScope(SetFailoverScopeRequest)     returns (FailoverScopeStatus);

    // GetVRRPTransport reports the load balancers' VRRP transport as the
    // answering host renders it, and the cluster-wide policy behind it.
    // SetVRRPTransport records the operator's choice (admin), "unicast" or
    // "multicast", which every host then renders. It refuses until
    // failover_scope_v1 has durably latched, "unicast" refuses until
    // vrrp_unicast_v1 has, and both refuse while any voter is unreachable.
    rpc GetVRRPTransport(google.protobuf.Empty)       returns (VRRPTransportStatus);
    rpc SetVRRPTransport(SetVRRPTransportRequest)     returns (VRRPTransportStatus);

    // GetHAPolicy reports the cluster HA policy (armed or disarmed) and its
    // confirmation; SetHAPolicy changes it (admin). While disarmed, no host is
    // fenced and no workload is recovered automatically.
    rpc GetHAPolicy(google.protobuf.Empty)            returns (HAPolicyStatus);
    rpc SetHAPolicy(SetHAPolicyRequest)               returns (HAPolicyStatus);

    // RestoreRelay clears a relay-health demotion now (admin;
    // colonelpanik/litevirt#175): it writes the host's relay_demoted row back
    // to demoted=false, replicated and audited, and with hold_seconds > 0
    // keeps the failover lease holder from demoting it again until the hold
    // runs out. Refuses until relay_health_v1 has durably latched.
    rpc RestoreRelay(RestoreRelayRequest)             returns (RestoreRelayResponse);
    // GetRelayHealth lists every host with a relay demotion row or an
    // operator hold (viewer): demoted or restored, since when and why, and
    // any hold with its expiry.
    rpc GetRelayHealth(google.protobuf.Empty)         returns (RelayHealthStatus);
    // GetUpgradeStatus reports, as the answering host sees them, every
    // capability token latched here, whether each blocks a rollback, and for
    // each release token which of its features have been used cluster-wide
    // (`lv cluster upgrade-status`, docs/upgrades.md). Viewer.
    rpc GetUpgradeStatus(google.protobuf.Empty)       returns (UpgradeStatus);
    // HoldsReleaseFeatureUse answers, for a peer, whether this replica holds the
    // used record of one release feature. A first use waits for every
    // replication recipient to answer yes before the feature writes anything.
    // Peer mTLS only.
    rpc HoldsReleaseFeatureUse(ReleaseFeatureUseQuery) returns (ReleaseFeatureUseHeld);

    // ── anycast services ──
    // service_endpoints map a logical name (e.g. "api.litevirt.local")
    // to N (ip, region) pairs. The embedded DNS server round-robins
    // among them so a multi-region frontend surfaces under one name
    // without external anycast routing.
    rpc UpsertServiceEndpoint(UpsertServiceEndpointRequest) returns (ServiceEndpoint);
    rpc ListServiceEndpoints(ListServiceEndpointsRequest)   returns (ListServiceEndpointsResponse);
    rpc DeleteServiceEndpoint(DeleteServiceEndpointRequest) returns (google.protobuf.Empty);

    // ── snapshot scheduler ──
    // BackupSchedule rows live in the `backup_schedules` Corrosion
    // table; the leader-gated minute-tick scheduler dispatches each
    // matching row through BackupSnapshot.
    rpc CreateBackupSchedule(CreateBackupScheduleRequest) returns (BackupSchedule);
    rpc ListBackupSchedules(ListBackupSchedulesRequest)   returns (ListBackupSchedulesResponse);
    rpc DeleteBackupSchedule(DeleteBackupScheduleRequest) returns (google.protobuf.Empty);

    // Replication schedules share the backup_schedules table (type='replication')
    // and the same minute-tick scheduler; each matching row replicates the VM's
    // disk to target_pool. See ReplicationSchedule.
    rpc CreateReplicationSchedule(CreateReplicationScheduleRequest) returns (ReplicationSchedule);
    rpc ListReplicationSchedules(ListReplicationSchedulesRequest)   returns (ListReplicationSchedulesResponse);
    rpc DeleteReplicationSchedule(DeleteReplicationScheduleRequest) returns (google.protobuf.Empty);
    // PromoteReplica brings an inert replica online: defines+starts the VM
    // against an overlay backed by the chosen replica on the host that holds
    // it, then localizes via blockpull. Disaster recovery after host loss.
    rpc PromoteReplica(PromoteReplicaRequest) returns (stream PromoteReplicaProgress);
    // ResolvePITOverlay decides, as an admin, what happens to a point-in-time
    // copy overlay that could not be verified against its disk and holds the
    // VM: commit it into the disk, or discard it. Without confirm it only says
    // what it would do. Audited. lv resolve-pit-overlay.
    rpc ResolvePITOverlay(ResolvePITOverlayRequest) returns (ResolvePITOverlayResponse);
    // ListSetAsideOverlays lists the point-in-time overlays set aside
    // (<overlay>.orphan-<time>) beside the disks of a host's VMs, answered on
    // that host (the VM's host when vm_name is set). Per-VM read.
    rpc ListSetAsideOverlays(ListSetAsideOverlaysRequest) returns (ListSetAsideOverlaysResponse);
    // RemoveSetAsideOverlay removes one set-aside overlay and its binding, on
    // the VM's host; refused while it is in use. Admin, audited.
    rpc RemoveSetAsideOverlay(RemoveSetAsideOverlayRequest) returns (RemoveSetAsideOverlayResponse);
    // ListReplicationCheckpoints lists the live incremental-replication
    // checkpoint rows. Per-VM read.
    rpc ListReplicationCheckpoints(ListReplicationCheckpointsRequest) returns (ListReplicationCheckpointsResponse);
    // DeleteReplicationCheckpoint retires one checkpoint row (the next run of
    // its chain is a full copy); refused while a live schedule uses it.
    // Admin, audited.
    rpc DeleteReplicationCheckpoint(DeleteReplicationCheckpointRequest) returns (DeleteReplicationCheckpointResponse);

    // ── tamper-evident audit log ──
    // VerifyAuditChain walks each host's audit sub-chain (a row's
    // prev_hash links to the previous row from the SAME host, because
    // N daemons appending concurrently can never form one linear
    // chain) and confirms each content_hash matches the
    // SHA-256(prev_hash || canonical(row)) recomputation.
    //
    // It also checks what a hash alone cannot: the ECDSA signature
    // over each row, its host sequence number, and the signed chain
    // heads. A hash break is corruption or a crude edit; a bad
    // signature is an edit by someone without the host's key and
    // survives a reseal; a seq gap is a deleted run of rows; a
    // truncated host is a tail that was cut off entirely.
    //
    // It does not stop at the first problem — one id says nothing
    // about whether the rest of the log was rewritten too — so every
    // finding is reported and `tampered` summarises whether any of
    // them is evidence of interference. Unsigned rows are NOT: every
    // cluster upgrading to signing has a log full of them.
    //
    // ExportAuditChain emits a JSON blob containing the rows in a
    // time-range — suitable for WORM offload to S3 Object Lock /
    // an immutable tape vault.
    rpc VerifyAuditChain(google.protobuf.Empty)         returns (VerifyAuditChainResponse);
    rpc ExportAuditChain(ExportAuditChainRequest)       returns (ExportAuditChainResponse);
    rpc RetireAuditKey(RetireAuditKeyRequest)           returns (RetireAuditKeyResponse);

    // ── tenancy ──
    // Projects are hierarchical buckets for VMs / volumes / etc.
    // Quotas gate VM admission against (vcpu, mem, disk, nics).
    // The "_default" project is implicit — operators only touch
    // these RPCs when they're carving multi-tenancy.
    rpc CreateProject(CreateProjectRequest)         returns (Project);
    rpc ListProjects(google.protobuf.Empty)         returns (ListProjectsResponse);
    rpc GetProject(GetProjectRequest)               returns (Project);
    rpc DeleteProject(DeleteProjectRequest)         returns (google.protobuf.Empty);
    rpc SetProjectQuota(SetProjectQuotaRequest)     returns (ProjectQuota);
    rpc GetProjectQuota(GetProjectQuotaRequest)     returns (ProjectQuota);
    rpc GetProjectUsage(GetProjectUsageRequest)     returns (ProjectUsage);

    // Internal owner-side endpoint appended for wire-order stability.
    rpc ExecuteCreateVM(ExecuteCreateVMRequest) returns (VM);

    // ── project admission authority (F2 second half / D1) ──
    // PEER-ONLY. Reserve-then-verify makes two concurrent admissions agree only
    // once both reservations are VISIBLE to both deciders; corrosion is eventually
    // consistent, so two nodes that have not yet exchanged operation rows can still
    // both admit. These route the PROJECT-QUOTA half of an admission to the
    // project's authority holder, so every quota decision for one project is made
    // by ONE node against a view that already contains its own grants.
    //
    // Host capacity is NOT delegated: it is already serialized by the target host's
    // owner, which is the only node that reserves against it.
    rpc ReserveProjectCapacity(ReserveProjectCapacityRequest) returns (ReserveProjectCapacityResponse);
    rpc ReleaseProjectCapacity(ReleaseProjectCapacityRequest) returns (google.protobuf.Empty);

    // ── destination-owned migration host admission ──
    // PEER-ONLY. A migration's HOST admission belongs to the DESTINATION daemon:
    // only it can probe its own runtime inventory, and replicated capacity
    // observations degrade to DB-only arithmetic exactly when they are missing,
    // stale, or unreadable — so a source-side decision silently loses the final
    // target-local safety gate. The source obtains this lease before stopping a
    // container or beginning a VM transfer, holds it across the whole move, and
    // releases it on every return path. The destination refuses a request naming
    // any host but itself, runs full local host admission (fresh inventory,
    // ownership conditions, runtime-only load), persists a durable reservation
    // operation, and returns its id as the lease. Release is idempotent and only
    // ever terminates a capacity operation targeting the local host.
    rpc ReserveHostCapacity(ReserveHostCapacityRequest) returns (ReserveHostCapacityResponse);
    rpc ReleaseHostCapacity(ReleaseHostCapacityRequest) returns (google.protobuf.Empty);

    // ── Import leftovers on shared pools (peer-only) ──
    //
    // A host re-importing over a file in a pool it shares with other hosts asks
    // them whether their own placement record shows that file as a leftover of
    // a dead import of theirs, unchanged since. The answer comes from the
    // answering host's record alone: it never opens a path the caller names.
    rpc ImportLeftoverStatus(ImportLeftoverStatusRequest) returns (ImportLeftoverStatusResponse);

    // ── iSCSI LUN holders (peer-only) ──
    //
    // An iscsi pool is one LUN: every disk created on it IS that LUN, and a
    // create takes it by a voter-majority claim (target_kind "lun"). A LUN
    // already decided for another create is free again only once that create
    // is proven gone: the creating host is asked which VMs hold the LUN — in
    // its replica, and in a create of its own still in flight.
    rpc LUNHolders(LUNHoldersRequest) returns (LUNHoldersResponse);
    // ISCSILUNHolds is `lv host lun-holds [host]`: the durable holds a host
    // keeps on iSCSI LUNs whose claim a rebuild or recreate there moved,
    // including records it cannot read. With discard (admin, audited) —
    // `lv host lun-hold discard <lun>` — it moves the records naming that LUN
    // (or that token or file) aside, to iscsi-lun-holds/discarded/, and
    // reloads the holds without a restart.
    rpc ISCSILUNHolds(ISCSILUNHoldsRequest) returns (ISCSILUNHoldsResponse);

    // ── Re-create judgement (peer-only) ──
    //
    // A rebuild or a rolling recreate of a VM with an installer ISO places the
    // new VM before it tears the old one down, and asks the host placement
    // chose to judge the spec as its create there will — as the relayed
    // caller, with the VM's own ISO grant — so a refusal leaves the VM intact.
    // A host on an older build answers Unimplemented; its create judges no
    // installer ISO.
    rpc PreflightRecreateVM(PreflightRecreateVMRequest) returns (google.protobuf.Empty);
}

// Pre-flight check before `lv host upgrade`. Surfaces in-flight work,
// lease holdings, and other conditions that would make a daemon restart
// unsafe. Always advisory — operators can pass --force to ignore.
message PreflightUpgradeRequest  {
    string target_host = 1;   // empty = local host
}
message PreflightUpgradeResponse {
    bool   ok       = 1;       // true if no blocking conditions found
    string host     = 2;
    repeated PreflightFinding findings = 3;
}
message PreflightFinding {
    string severity = 1;       // "block" | "warn"
    string code     = 2;       // machine-readable category
    string message  = 3;       // human-readable detail
}

// SpiceData is a chunk of one SPICE channel's byte stream (ProxySpice).
message SpiceData { bytes data = 1; }

message GetSpiceInfoRequest  { string vm_name = 1; }
// The SPICE listener is bound to the VM host's 127.0.0.1, so host:port is
// reachable only on that host itself (or through a tunnel to it). A client
// elsewhere reaches it through ProxySpice.
message GetSpiceInfoResponse {
    string host = 1;       // host the VM runs on (its address, NOT where SPICE listens)
    int32  port = 2;       // SPICE TCP port (libvirt-assigned) on that host's 127.0.0.1
    string uri  = 3;       // convenience: "spice://<host>:<port>"
    // The password the VM's SPICE console requires ("" when it requires
    // none; docs/ui.md "Console passwords"). Returned only to a caller that
    // passed the vm.console check, and never logged.
    string password = 4;
    // warning: why a SPICE client may be unable to connect on the VM's host
    // ("" when nothing is known), e.g. a FIPS-mode kernel, under which
    // spice-server cannot make the RSA key every SPICE link needs. Nothing is
    // refused because of it; VNC still works.
    string warning = 5;
}

// ── Rebalancer messages ──

message RebalanceProposal {
    string id            = 1;
    string vm_name       = 2;
    string src_host      = 3;
    string dst_host      = 4;
    string policy        = 5;
    double expected_gain = 6;     // % score improvement
    string status        = 7;     // pending | approved | applied | rejected | expired
    string proposed_at   = 8;
    string applied_at    = 9;
    string expires_at    = 10;
    string detail        = 11;
}

message ListRebalanceProposalsRequest {
    string status_filter = 1;     // empty = all
    // limit caps the page size. 0 means the server default; the server also
    // applies a hard ceiling, so the response can never outgrow the gRPC
    // message limit however large the table is.
    int32  limit         = 2;
    // offset pages through older proposals, newest first.
    int32  offset        = 3;
}
message ListRebalanceProposalsResponse {
    repeated RebalanceProposal proposals = 1;
    // total_count is how many proposals match status_filter, ignoring
    // limit/offset, so a caller can tell a full page from the whole table.
    int32 total_count = 2;
    // truncated is true when more rows match past this page.
    bool  truncated   = 3;
}

message RunRebalanceRequest {
    bool dry_run = 1;             // dry_run=true forces DryRun mode regardless of per-VM config
}
message RunRebalanceResponse {
    int32 proposals_emitted = 1;
}

message ApproveRebalanceProposalRequest { string id = 1; }
message RejectRebalanceProposalRequest  {
    string id     = 1;
    string reason = 2;
}

// ── federation messages ──

message ListRegionsRequest  {}
message ListRegionsResponse { repeated string regions = 1; }

message RegionStatusRequest  { string region = 1; } // empty = all regions
message RegionStatusResponse { repeated RegionStatus statuses = 1; }
message RegionStatus {
    string name           = 1;
    int32  host_count     = 2;
    int32  active_hosts   = 3;
    int32  vm_count       = 4;
    string last_updated   = 5;  // RFC3339, max(updated_at) across hosts in the region
}

// FailoverScopeStatus is the failover_scope policy and every region's voting
// strength, as the answering host sees them.
message FailoverScopeStatus {
    string scope      = 1;  // "cluster" (default) | "region"
    string set_by     = 2;  // principal of the last change; "" when never set
    string updated_at = 3;  // "" when never set
    // settable is false until failover_scope_v1 has durably latched on the
    // answering host; SetFailoverScope refuses until then.
    bool   settable   = 4;
    repeated FailoverScopeRegion regions = 5;
}

// FailoverScopeRegion is one region's voting strength.
message FailoverScopeRegion {
    string name             = 1;
    int32  hosts            = 2;  // every host in the region, whatever its state
    int32  workers          = 3;  // hosts that can hold workloads (not witnesses)
    int32  voters           = 4;  // the region's members of the voter set
    int32  voting_witnesses = 5;
    int32  quorum           = 6;  // floor(voters/2)+1
    // can_fence_own is false for a region with fewer than three voters: under
    // region scope it cannot fence one of its own hosts, so they have no
    // automatic failover.
    bool   can_fence_own    = 7;
}

message SetHAPolicyRequest {
    string state            = 1;  // "armed" | "disarmed"
    string reason           = 2;
    // fence_down_hosts lets an arm proceed although hosts it would fence are
    // down.
    bool   fence_down_hosts = 3;
}

message HAPolicyStatus {
    string state  = 1;  // "armed" | "disarmed"
    string set_by = 2;  // "" when there is no row
    string at     = 3;  // the row's updated_at as stored; "" when there is no row
    string reason = 4;
    repeated HAVoterAnswer       voters          = 5;
    repeated string              would_be_fenced = 6;
    bool                         first_use_paid  = 7;
    repeated HARegionConfirmation regions        = 8;
}

// HAVoterAnswer is one voter's latest Ready answer about the HA policy.
message HAVoterAnswer {
    string host         = 1;
    bool   ha_known     = 2;
    bool   ha_disarmed  = 3;
    string ha_policy_at = 4;
    bool   confirmed    = 5;
    // status is the voter in the peer veto's vocabulary: confirmed, stale,
    // unknown, older row, newer row, or not counted live.
    string status       = 6;
}

// HARegionConfirmation is whether a majority of a region's voters confirmed
// the policy (region failover scope).
message HARegionConfirmation {
    string region    = 1;
    bool   confirmed = 2;
}

message SetFailoverScopeRequest {
    string scope = 1;  // "cluster" | "region"
}

// VRRPTransportStatus is the load balancers' VRRP transport as the answering
// host renders it, and the cluster-wide policy it follows.
message VRRPTransportStatus {
    string transport  = 1;  // "unicast" | "multicast": what this host renders
    string policy     = 2;  // the operator's choice; "" when never set
    string set_by     = 3;  // principal of the last change; "" when never set
    string updated_at = 4;  // "" when never set
    // latched: vrrp_unicast_v1 has latched on some host (its latch row) or
    // durably on the answering host.
    bool   latched    = 5;
    // settable is false until failover_scope_v1 has durably latched on the
    // answering host.
    bool   settable   = 6;
}

message SetVRRPTransportRequest {
    string transport = 1;  // "unicast" | "multicast"
}

message RestoreRelayRequest {
    string host         = 1;
    int64  hold_seconds = 2;  // 0: no hold
}

message RelayHealthEntry {
    string host       = 1;
    bool   demoted    = 2;
    string since      = 3;  // RFC 3339: when the current state began
    string reason     = 4;
    string hold_until = 5;  // RFC 3339, empty with no hold in force
    string hold_by    = 6;
}

message RelayHealthStatus {
    repeated RelayHealthEntry hosts = 1;
    bool latched = 2;  // relay_health_v1 has latched: demotions are in use
}

message RestoreRelayResponse {
    string host        = 1;
    bool   was_demoted = 2;  // the host was demoted before this call
    string hold_until  = 3;  // RFC 3339, empty with no hold
}

// UpgradeStatus is the answering host's view of the capability latches and the
// release features recorded as used.
message UpgradeStatus {
    // release_token is the release token of the answering host's build.
    string release_token = 1;
    repeated UpgradeToken tokens = 2;
    repeated ReleaseFeatureStatus features = 3;
    // wal_quarantined is true while the answering host emits no replicated
    // writes; quarantine_reason says why.
    bool   wal_quarantined   = 4;
    string quarantine_reason = 5;
    // The rollout summary the status opens with: how many hosts run a build
    // that advertises release_token, which do not (with their build version),
    // and how many declared features wait for it.
    int32  hosts_total      = 6;
    int32  hosts_on_release = 7;
    repeated LaggingHost lagging = 8;
    int32  features_waiting = 9;
    // release_probation is true while the answering host is in release
    // probation (its replicated writes refused until a voter majority confirms
    // no use); probation_reason says why.
    bool   release_probation = 10;
    string probation_reason  = 11;
    // refused_peers are the peers this host is refusing replication from
    // because they cannot keep a release feature in use.
    repeated string refused_peers = 12;
    // self_upgrade_skipped names each pre-release peer build the automatic
    // self-upgrade declined to follow, with how to upgrade to it.
    repeated string self_upgrade_skipped = 13;
}

// LaggingHost is a host not yet on the answering host's release.
message LaggingHost {
    string name    = 1;
    string version = 2;  // its reported build version, "" if unknown
    string reason  = 3;  // "not advertising <token>" | "unreachable"
}

// UpgradeToken is one capability token latched on the answering host.
message UpgradeToken {
    string name      = 1;
    bool   durable   = 2;  // the latch's marker is on disk
    bool   mandatory = 3;  // no config flag
    // rollback_rule is the marker's rollback rule ("safe_if_unused") or "".
    string rollback_rule = 4;
    // blocks_rollback is true when rolling a host back to the build directly
    // below this token would quarantine it. Always for a token with no rule;
    // always for the first release token, because every build below it
    // predates rollback rules; for a later release token, once one of its
    // features is used.
    bool   blocks_rollback = 5;
    // blocks_rollback_rule_aware is the same question for a target build that
    // reads rollback rules: false for a safe_if_unused token none of whose
    // features is used, true otherwise.
    bool   blocks_rollback_rule_aware = 6;
}

// ReleaseFeatureStatus is one release feature: declared by this build, or
// recorded as used under a token this build does not know.
message ReleaseFeatureStatus {
    string token         = 1;
    string name          = 2;
    string description   = 3;  // "" for a feature this build does not declare
    bool   used          = 4;
    string recorded_by   = 5;  // the host that last recorded the use (every writing host re-records it)
    string recorded_at   = 6;
    bool   declared      = 7;  // this build declares the feature
}

message ReleaseFeatureUseQuery {
    string token   = 1;
    string feature = 2;
}

message ReleaseFeatureUseHeld {
    bool held = 1;
    // in_release_probation: the answering host is in release probation, so it
    // applies nothing pushed to it and cannot come to hold a new record until
    // its probation lifts (lv cluster upgrade-status shows why it has not).
    bool in_release_probation = 2;
}

// CrossRegionMigrate refuses when source/target hosts are in the
// same region; otherwise it forwards to MigrateVM. The stream surface
// matches MigrateVM's so existing UI code can be reused.
//
// When include_disks=true, the server drives ReplicateVolume per
// disk to the target host's local storage before starting the
// migration. The streamed progress carries MigratePhase=COPY during
// the replication step.
message CrossRegionMigrateRequest {
    string vm_name      = 1;
    string target_host  = 2;   // host in the destination region
    bool   live         = 3;   // mirror MigrateVM.live
    bool   include_disks = 4;  // mirror MigrateVM.include_disks
    // target_pool, when set, names the storage pool on target_host to
    // place replicated disks into. Empty = the default pool.
    string target_pool   = 5;
}

// anycast services.
message ServiceEndpoint {
    string service_name = 1;
    string ip           = 2;
    string region       = 3;
    int32  weight       = 4;
}
message UpsertServiceEndpointRequest {
    string service_name = 1;
    string ip           = 2;
    string region       = 3;
    int32  weight       = 4;
}
message ListServiceEndpointsRequest {
    string service_name = 1;   // empty = list all services
}
message ListServiceEndpointsResponse {
    repeated ServiceEndpoint endpoints = 1;
}
message DeleteServiceEndpointRequest {
    string service_name = 1;
    string ip           = 2;
}

// ── snapshot scheduler messages ──

message BackupSchedule {
    string vm_name        = 1;   // identity key; sentinel for non-vm scopes (@pool:X / @project:Y / @cluster)
    string repo           = 2;   // logical repo name resolved via daemon backup_repos config
    string cron           = 3;   // 5-field standard cron, e.g. "0 2 * * *"
    int32  keep_last      = 4;
    int32  keep_daily     = 5;
    int32  keep_weekly    = 6;
    int32  keep_monthly   = 7;
    int32  keep_yearly    = 8;
    bool   enabled        = 9;
    string last_run_at    = 10;  // RFC3339; "" = never run
    string last_run_err   = 11;  // "" = success
    string scope          = 12;  // "vm" | "pool" | "cluster" | "project" (default "vm")
    string pool_name      = 13;  // set when scope = "pool"
    string project_name   = 14;  // set when scope = "project"
}

message CreateBackupScheduleRequest {
    string vm_name        = 1;   // set when scope = "vm" (or empty + scope)
    string repo           = 2;
    string cron           = 3;
    int32  keep_last      = 4;
    int32  keep_daily     = 5;
    int32  keep_weekly    = 6;
    int32  keep_monthly   = 7;
    int32  keep_yearly    = 8;
    bool   enabled        = 9;
    string scope          = 10;  // "vm" (default) | "pool" | "cluster" | "project"
    string pool_name      = 11;  // required when scope = "pool"
    string project_name   = 12;  // required when scope = "project"
}
message ListBackupSchedulesRequest  {}
message ListBackupSchedulesResponse {
    repeated BackupSchedule schedules = 1;
}
message DeleteBackupScheduleRequest {
    string vm_name      = 1;
    string repo         = 2;
    string scope        = 3;   // "vm" (default) | "pool" | "cluster" | "project"
    string pool_name    = 4;
    string project_name = 5;
}

// ── replication schedule messages ──
message ReplicationSchedule {
    string vm_name       = 1;   // identity key; sentinel for non-vm scopes
    string cron          = 2;
    string target_pool   = 3;   // destination pool (also the row's repo key)
    string target_host   = 4;   // "" = shared-pool/auto healthy-peer selection
    int32  keep_replicas = 5;   // 0 = keep all
    bool   enabled       = 6;
    string scope         = 7;   // "vm" (default) | "pool" | "cluster" | "project"
    string pool_name     = 8;   // set when scope = "pool"
    string project_name  = 9;   // set when scope = "project"
    string last_run_at   = 10;  // RFC3339; "" = never run
    string last_run_err  = 11;  // "" = success
    bool   incremental   = 12;  // transfer only dirty extents (raw replicas); full-copy fallback
    bool   auto_promote  = 13;  // failover may promote the freshest replica on host loss
    int64  bwlimit_bytes_per_sec = 14;  // 0 = unlimited
}
message CreateReplicationScheduleRequest {
    string vm_name       = 1;
    string cron          = 2;
    string target_pool   = 3;
    string target_host   = 4;   // optional — explicit target host
    int32  keep_replicas = 5;
    bool   enabled       = 6;
    string scope         = 7;
    string pool_name     = 8;
    string project_name  = 9;
    bool   incremental   = 10;
    bool   auto_promote  = 11;
    // bwlimit_bytes_per_sec: unset keeps the stored limit, 0 clears it.
    optional int64 bwlimit_bytes_per_sec = 12;
}
message ListReplicationSchedulesRequest  {}
message ListReplicationSchedulesResponse { repeated ReplicationSchedule schedules = 1; }
message DeleteReplicationScheduleRequest {
    string vm_name     = 1;
    string target_pool = 2;   // the row's repo key
    string scope       = 3;
    string pool_name   = 4;
    string project_name = 5;
}

// ── audit chain messages ──

message VerifyAuditChainResponse {
    int32  rows_checked = 1;
    string broken_at_id = 2;   // empty if chain intact
    string error        = 3;   // non-empty if the verify itself failed

    // Signature-level findings, appended so a pre-v45 client still reads
    // fields 1-3 and still reports a hash break — it just cannot see these.
    // The list entries are "rowid: reason", one per affected row.

    // Rows carrying no signature: written before signing existed, or while
    // enforcement.audit_signature was off. Chain-checked only, and NOT
    // tampering — reporting them as such on every upgraded cluster would
    // train operators to ignore this command.
    int32 unsigned_rows = 4;
    // Signed rows this verifier had no keyring to check. Not a finding
    // about the rows, a gap in what the verifier could see.
    int32 unverifiable_rows = 5;
    // Signatures that failed against the published certificate for their
    // key. The signal that survives a reseal: rewriting a row's hash
    // cannot produce a matching signature.
    repeated string bad_signature = 6;
    // Rows whose key has no trustworthy published certificate — never
    // published, or one that does not chain to the cluster CA.
    repeated string unknown_key_id = 7;
    // Breaks in a host's sequence numbering, which is how the deletion of
    // a whole run of rows shows up.
    repeated string seq_gaps = 8;
    // Rows that blanked their own content_hash to pose as a pre-chain
    // reset point, which used to silently re-base everything after them.
    repeated string laundered = 9;
    // Rows with no host name. They belong to no sub-chain and so cannot
    // be chain-verified at all.
    int32 unattributed_rows = 10;
    // Hosts whose signed chain head attests to more rows than the log
    // holds — the tail was cut off.
    repeated string truncated_hosts = 11;
    // True when any finding is evidence of deliberate interference, so a
    // client does not have to re-derive that rule and get it wrong.
    bool tampered = 12;
    // Rows signed by a key past the sequence at which it was retired.
    // Rotation happens precisely when a key may be in someone else's hands,
    // so a signature from it after that boundary is either an attacker or a
    // node still running with the superseded key installed.
    repeated string retired_key_use = 13;
    // Hosts whose chain does not hash to what their own signed head says.
    // This is what catches a row rewritten and re-signed by someone holding
    // a key that has since been rotated out: the signature verifies and the
    // sequence numbers are untouched, and only the head — signed by the
    // successor key they do not have — disagrees.
    repeated string head_mismatch = 14;
    // Unsigned rows appearing AFTER the authoring host's first signed row.
    // Distinct from unsigned_rows, which is ordinary pre-enforcement history:
    // a host cannot un-adopt a key, so a row here was either inserted straight
    // into the table — the cheapest forgery, since the content hash is unkeyed
    // — or written by a node that lost its key and kept going.
    repeated string unsigned_after_signed = 15;
    // Hosts holding a published signing certificate that never recorded an
    // adoption, long enough ago that a starting daemon would have.
    //
    // This is what reports a host that cannot read its own signing key. Such a
    // host publishes its CERTIFICATE on purpose, so its unsigned rows read as
    // evidence rather than as ordinary history — but it cannot SIGN the adoption
    // record a contract requires, so it fell between the two rules and its rows
    // were reported clean everywhere. A key that cannot be read is the state an
    // attacker arranges, which is why it must not be the quiet one.
    repeated string never_adopted = 16;
    // True when part of the log could not be checked — the THIRD outcome,
    // between intact and tampered.
    //
    // Every consumer needs this and none of them should re-derive it. When
    // never_adopted stopped feeding `tampered` — it is inferred from a row any
    // peer can write, so it cannot be evidence of interference — the CLI learned
    // the new outcome and the web UI and the REST poller did not, and both went
    // straight back to reporting a host that cannot sign as a clean chain. A
    // verdict field that means "not a pass" has to travel with the verdict field
    // that means "not tampering".
    bool unverified = 17;
    // Hosts that are not signing NOW, as "host: N unsigned rows": the host's
    // most recent row is unsigned and it holds no signing contract. Not a
    // finding. It is what tells an operator whether unsigned_rows is history
    // from before signing was switched on (no host listed) or a host that is
    // still not signing (enforcement.audit_signature off, or an older build).
    // An older daemon never sets it, so an empty list says nothing on its own.
    repeated string not_signing_hosts = 18;
    // Rows with a NUL byte in a hashed field, as "rowid: host: reason". The
    // content hash is injective only over NUL-free rows, so such a row's hash
    // and signature do not determine its content: a different row verifies
    // the same. A current daemon never writes one. Feeds `unverified`, not
    // `tampered` — an older build may have written the row verbatim.
    repeated string ambiguous_rows = 19;
    // What kind of break broken_at_id is, so a client can name it rather than
    // calling every broken link an edit:
    //   "content"  - the row does not hash to its own stored content_hash,
    //                even against its own stored prev_hash: it was edited.
    //   "forked"   - the row hashes correctly against its own stored prev_hash,
    //                which is empty: it opens a second chain under a host name
    //                that already has one (a rebuilt host appending before its
    //                history arrived). Still a finding.
    //   "unlinked" - the row hashes correctly against its own stored prev_hash,
    //                but that is not the hash of the row before it: a row
    //                before it was deleted or rewritten, or the chain branched.
    // Empty when broken_at_id is, and from a daemon older than this field,
    // which a client reads as "content" — the only label it used to have.
    string broken_at_kind = 20;
    // Rows on a host whose audit chain forked (a second genesis) whose
    // stored prev_hash is the hash of no row of that host one seq before
    // them: the row before each was deleted. Its two chains interleave by
    // seq, so such a deletion leaves no seq gap; this names it.
    repeated string orphaned_rows = 21;
    // True when tampered is set and the only finding is a forked chain: a
    // second chain opened under a host name that already had one, with no
    // edited, deleted or forged row found. Still a failure; it only changes
    // how a client names it. Absent from an older daemon, which a client
    // reads as false and so keeps the tampered wording.
    bool forked = 22;
}

// RetireAuditKey retires a host's audit signing key ON ITS BEHALF.
//
// The daemon signs its own retirement whenever an operator turns
// enforcement.audit_signature off, so the routine rollback needs no RPC. This is
// for a host that cannot speak for itself: its key is lost or unreadable, the
// machine is gone, or it is being decommissioned. Left alone, such a host keeps
// a published certificate declaring its rows are signed, and every unsigned row
// it wrote is reported as evidence on every node with no way to close it out.
//
// Must be sent to the node holding the cluster CA private key: signing on
// another host's behalf means minting a certificate with that host's CN, which
// is precisely what holding the CA authorises.
// Two-phase, because the cluster CA private key lives in the OPERATOR's config
// directory (~/.config/litevirt/pki), not in a daemon's PKI directory. A daemon
// therefore cannot mint a certificate to sign with, and — more to the point —
// should not have to: the CA never needs to be on a node at all.
//
// Phase 1 sends host_name alone. The daemon answers with the key that would be
// retired and the sequence to retire it at, and writes nothing.
// Phase 2 sends the certificate the operator minted for that host plus two
// signatures over exactly those values. The daemon verifies them against the
// cluster CA and records the result; it never sees a private key.
message RetireAuditKeyRequest {
    string host_name = 1;
    // PEM of a certificate minted by the CA holder with this host's CN.
    string cert_pem = 2;
    // Signature retiring the host's key at the sequence phase 1 reported.
    string signature = 3;
    // Signature retiring the minted certificate itself, at the same sequence.
    // Without it the certificate created to END a signing contract would stand
    // as a new one, claiming the host signs with a key nobody holds.
    string self_signature = 4;
    // Which of the host's live signing keys to retire.
    //
    // Required only when it has more than one, which happens whenever a rotation
    // could not complete — and that is exactly when an operator needs this
    // command. Without a selector the server refused ("retire them one at a
    // time") while offering no way to name one, so the only documented remedy
    // for a stuck host was unreachable.
    string key_id = 8;
    // Operator-chosen retirement boundary, overriding the one the server derives.
    //
    // The escape hatch for a poisoned chain head. The server refuses to retire from
    // a replica that a signed head says is behind, and it counts heads signed by the
    // key being retired on purpose — a host's heads are signed by its own keys, so
    // excluding them is what let a stale replica pin a boundary below rows that were
    // legitimately signed. The cost is that whoever holds a leaked key can publish
    // one head at any sequence and make retirement refuse on every node forever:
    // heads are append-only, tombstones are inert, and the anti-entropy guard
    // refuses rewrites, so the claim cannot be withdrawn.
    //
    // Completing a retirement still requires a certificate minted with the cluster
    // CA private key, and both phase-2 signatures must cover this exact value, so
    // setting it grants nobody a capability they did not already have.
    //
    // optional, for presence rather than a zero sentinel: 0 is a meaningful boundary
    // — "this key signed nothing valid", the right answer for a key believed leaked
    // from the moment it was minted — and a plain int64 could not tell that apart
    // from "not supplied".
    optional int64 at_seq = 5;
    // The retirement, signed with the cluster CA PRIVATE KEY.
    //
    // This is what carries standing. A lifecycle record is honoured only from the key
    // itself or from the cluster CA — anything else is a signer speaking about a key
    // that is not its own, which is how a leaked, already-retired key could retire its
    // own successor and silently switch a host's tamper-evidence off. Retiring a host
    // that cannot sign for itself is exactly what holding ca.key authorises, so the CA
    // says so directly rather than through a minted leaf that has to be argued into
    // standing.
    string ca_signature = 7;
    // Permit an at_seq BELOW the boundary the server derives.
    //
    // Lowering a boundary is the unrecoverable direction: lifecycle records are
    // append-only and the earliest verified retirement stands, so every row between
    // the supplied sequence and the real extent of the chain becomes a permanent
    // retired-key finding on every node. Raising one cannot condemn anything. The
    // two are not the same operation and are not confirmed the same way — a
    // mistyped sequence is otherwise indistinguishable from a deliberate one.
    bool force = 6;
}
message RetireAuditKeyResponse {
    // The key that was retired, and the sequence it was retired at. Rows the key
    // signed up to there stay verifiable — retirement is a validity window, never
    // a deletion.
    string retired_key_id = 1;
    int64  retired_at_seq = 2;
}

message ExportAuditChainRequest {
    // Time bounds, both inclusive, compared as instants: RFC3339 (any offset),
    // a date or coarser, or a duration ago (corrosion.ParseTimeWindow; until
    // runs to the end of the unit it names). Unparseable is InvalidArgument.
    // Empty since/until means "from the beginning" / "to the end".
    //
    // A window that starts mid-chain exports a fragment whose first row links
    // to a row outside it, which cannot be re-verified. Narrow the window to
    // answer a question about a period; export the whole chain to attest to it.
    string since = 1;
    string until = 2;
    // Opaque cursor from a previous response's next_cursor. Empty starts at the
    // beginning.
    //
    // The export is paginated because it is one unary message against a 64 MiB
    // server send cap, and a chain large enough to matter exceeds it. Without
    // paging the only workaround is a since/until window — which produces
    // exactly the fragment that cannot be re-verified, so the failure quietly
    // converts a complete attestation into a useless one.
    string cursor = 3;
    // Audit rows per page. 0 uses the server default.
    int32 limit = 4;
}
message ExportAuditChainResponse {
    // JSON blob — caller writes this to a WORM destination
    // (S3 Object Lock, immutable filesystem, etc.). Format:
    // {"rows": [{"id":..,"timestamp":..,..,"content_hash":..,"seq":..},...]}
    //
    // The FIRST page (empty request cursor) also carries the state a verifier
    // needs and cannot derive from the rows: "chain_heads", "signing_keys",
    // "key_lifecycle" and "ca_pem". Later pages carry rows only.
    string json     = 1;
    int32  row_count = 2;
    // Non-empty when more rows remain; pass it back as request.cursor.
    string next_cursor = 3;
}

// ── tenancy messages ──

message Project {
    string name        = 1;
    string display     = 2;
    string parent_name = 3;
    string created_at  = 4;
    string updated_at  = 5;
}

message CreateProjectRequest {
    string name        = 1;
    string display     = 2;
    string parent_name = 3;
}
message ListProjectsResponse  { repeated Project projects = 1; }
message GetProjectRequest     { string name = 1; }
message DeleteProjectRequest  { string name = 1; }

message ProjectQuota {
    string project_name    = 1;
    int32  vcpu_limit       = 2;
    int32  mem_mib_limit    = 3;
    int32  disk_gib_limit   = 4;
    int32  nic_limit        = 5;
    int32  public_ip_limit  = 6;
    int32  backup_gib_limit = 7;
}
message SetProjectQuotaRequest { ProjectQuota quota = 1; }
message GetProjectQuotaRequest { string project_name = 1; }

message ProjectUsage {
    string project_name = 1;
    int32  vcpu_used    = 2;
    int32  mem_mib_used = 3;
    int32  disk_gib_used = 4;
    int32  nic_used     = 5;
    int32  vm_count     = 6;
    int32  public_ips_used = 7; // NICs with a non-private address
    int32  backup_gib_used = 8; // summed manifest size across the project's VMs
}
message GetProjectUsageRequest { string project_name = 1; }

// Delegated project-quota admission (peer-only). The caller sends the epoch it
// believes is current; the holder refuses a request stamped with a stale epoch
// rather than deciding under an authority it no longer holds, so a fenced
// ex-holder's in-flight admissions cannot slip through after a takeover.
message ReserveProjectCapacityRequest {
    string project         = 1;
    string method          = 2;  // originating RPC name, recorded in the journal
    int32  cpu_delta       = 3;  // positive grow only; ≤0 needs no reservation
    int32  mem_mib_delta   = 4;
    int64  authority_epoch = 5;  // epoch the CALLER believes is current
    string principal       = 6;  // originating end-user, preserved for audit
    // What this admission is about to create, as "vm:<name>" / "ct:<name>". The
    // holder keeps a RELEASED lease counted until this resource is visible in its
    // own replica — the winner commits on its own node, so without that the holder
    // under-counts until replication catches up and hands the same quota out twice.
    string resource_id     = 7;
    // workload_host completes the identity: container names are unique only per
    // HOST, so without it a same-named container elsewhere could retire a charge
    // that is still owed. Ignored for VMs (cluster-unique names).
    string workload_host   = 8;
    // The ABSOLUTE post-commit counted size, not the delta. A grow's row is
    // already visible at its old size, so the holder retires the released lease
    // only once the workload CONTRIBUTES this much — presence alone would free
    // the lease instantly while usage still counted the smaller spec.
    int32  want_cpu        = 9;
    int32  want_mem_mib    = 10;
    // The other two dimensions a project quota bounds, reserved on the SAME
    // lease. Checking them with an unserialized read just before the insert left
    // them enforceable one request at a time: concurrent creates each saw a view
    // without the other's claim, both fit the remaining budget, and both
    // committed over the limit.
    int32  disk_gib_delta  = 11;
    int32  nic_delta       = 12;
    int32  want_disk_gib   = 13;
    int32  want_nic        = 14;
}
message ReserveProjectCapacityResponse {
    string lease_id        = 1;  // holder-local operation id, passed back to release
    int64  authority_epoch = 2;  // epoch the grant was actually made under
}
message ReleaseProjectCapacityRequest {
    string project  = 1;
    string lease_id = 2;
}

message ReserveHostCapacityRequest {
    string host          = 1;  // MUST name the destination daemon itself
    string project       = 2;
    string method        = 3;  // originating RPC name, recorded in the journal
    string principal     = 4;  // originating end-user, preserved for audit
    string resource_id   = 5;  // "vm:<name>" / "ct:<name>" — the workload moving in
    int32  cpu_delta     = 6;  // positive grow only; ≤0 reserves nothing
    int32  mem_mib_delta = 7;
    // The two admission-intent facts, named independently (see admissionIntent):
    // new_residency gates on fresh local inventory even at zero delta;
    // vm_overhead charges the per-domain qemu overhead to HOST figures only.
    bool   new_residency = 8;
    bool   vm_overhead   = 9;
}
message ReserveHostCapacityResponse {
    // Destination-local operation id; passed back to ReleaseHostCapacity. Empty
    // when the admission passed safety but reserved nothing (zero delta).
    string lease_id = 1;
}
message ReleaseHostCapacityRequest {
    string lease_id = 1;
}

// ── Shared-storage fence readiness (diagnostic) ──
//
// Declared at the END of this file deliberately: protoc-gen-go indexes messages
// by declaration order, so inserting these beside ClusterHealth renumbered every
// message after them and turned a two-message addition into a 4,300-line
// generated diff. Appending keeps every existing index stable.
// One host's shared-storage-fence posture, as it reported for itself.
message FenceHostPosture {
    string host = 1;
    // reachable=false means the host did not answer a fresh Ping, so its posture
    // is UNKNOWN and must not be read as either enforcing or not.
    bool   reachable = 2;
    // enforcing is meaningful only when reachable AND posture_known. A host
    // running a binary that predates PingResponse.not_enforcing cannot report
    // its kill-switch at all.
    bool   enforcing = 3;
    bool   posture_known = 4;
    string detail = 5;
}

// FenceReadiness answers one question: if a shared-disk VM had to move hosts
// right now, would the proof-grade fence actually run?
//
// It is a DIAGNOSTIC, never an input to a fencing decision. The reason it must
// exist as its own read is that neither half of the answer was observable:
// capability_latched is visible in the mesh, but the per-node kill-switch is
// local config, so a cluster could show a fully latched token while members
// silently skipped the fence.
message FenceReadiness {
    // capability_latched: shared_storage_fence_v1 is latched ON THE RESPONDING
    // NODE. The latch is per-node state (internal/health.Checker's activated map
    // plus its marker files), so this is NOT proof every peer has latched: during
    // a rollout one node can latch before another finishes its own sweep. A peer
    // that has not latched will take the legacy path however its config flag
    // reads, and that is not visible from here — see FenceReadiness's
    // known-limits note.
    bool capability_latched = 1;
    // enforced_everywhere: every host is reachable, reported its posture, and has
    // its enforcement.shared_storage_fence flag ON. False when ANY host is not
    // enforcing OR its posture is unknown — "we cannot tell" is never reported as
    // all-clear.
    //
    // It covers the per-host CONFIG half only. The other half of
    // sharedStorageFenceActive — each peer's own latch — has no wire
    // representation, so true here means "nothing is switched off", not "every
    // node will fence".
    bool enforced_everywhere = 2;
    // Workloads that would be exposed: a VM with a disk on shared storage
    // (nfs/ceph/rbd/iscsi), which a second host can open and write.
    //
    // Counted from the RESPONDING NODE'S replicated vm_disks rows. A VM created
    // on a peer whose disk rows have not replicated here yet is not counted, so
    // a zero is "none that this node knows of", not "none exist".
    int32 vms_with_shared_disk = 3;
    // A few affected VM names, for the operator to recognise. Not exhaustive.
    repeated string sample_vms = 4;
    repeated FenceHostPosture hosts = 5;
    string generated_at = 6;   // RFC3339
    // recent_fences: the newest fencing_log rows from the last
    // fenceReadinessRecentWindow, newest first and capped. Each carries the
    // ASSURANCE of what it established — corrosion.FenceAssurance, the same
    // classification the shared-storage gate uses — because the stored result
    // writes "fenced" both for an IPMI power-off that was observed off and for
    // an SSH poweroff nobody checked. DIAGNOSTIC ONLY.
    repeated FenceEvent recent_fences = 7;
    // recovery_claim_latched: recovery_claim_v1 is latched ON THE RESPONDING
    // NODE (Latched, never Enforced — the same per-node caveat as
    // capability_latched).
    bool recovery_claim_latched = 8;
    // recovery_claim_hosts: every host's recovery-claim posture, witnesses
    // included (a witness runs a failover coordinator). enforcing=false with
    // posture_known=true is a host that reports enforcement.recovery_claim
    // off, or that does not advertise recovery_claim_v1 at all — after the
    // latch, either one is the uncertified second owner the token exists to
    // prevent. An older build reads a missing key as false and is NOT
    // WAL-quarantined for it, which is how a rolled-back host lands here.
    // DIAGNOSTIC ONLY.
    repeated FenceHostPosture recovery_claim_hosts = 9;
}

// FenceEvent is one fencing_log row, labelled with what it established.
message FenceEvent {
    string host = 1;
    string method = 2;
    string result = 3;     // as stored: fenced | partial | manual-confirmed
    // assurance: verified | operator-confirmed | requested | assumed |
    // awaiting-confirmation | failed | unknown. See corrosion.FenceAssurance.
    string assurance = 4;
    string timestamp = 5;  // RFC3339
    string detail = 6;
}

// ── Import leftovers on shared pools ──
//
// Appended at the end of the file, like the fence messages above, so existing
// message indexes stay stable.
// One file in the pool, as the asking host sees it.
message ImportLeftoverFile {
    // A plain file name in the pool's directory: no '/', not "." or "..".
    string name     = 1;
    uint64 ino      = 2;
    int64  size     = 3;
    int64  mtime_ns = 4;
    // 0 where the asking host's platform reports none.
    int64  ctime_ns = 5;
}
message ImportLeftoverStatusRequest {
    // The pool, by name, as both hosts know it (a shared pool).
    string pool = 1;
    repeated ImportLeftoverFile files = 2;
}
message ImportLeftoverStatusResponse {
    // The names, among those asked, that the answering host's record shows a
    // dead import of its own left there, in exactly the asked state.
    repeated string dead = 1;
}

// LUNHoldersRequest asks a host which VMs hold any of the named LUNs.
message LUNHoldersRequest {
    // LUN keys (storage.FixedDevice), at most 64.
    repeated string luns = 1;
    // The incarnation a rebuild or a recreate replaces — name and created_at,
    // both or neither. Only that incarnation's own disk rows hold nothing
    // against the asker; no name alone exempts anything.
    string replaced_name       = 2;
    string replaced_created_at = 3;
    // A moved claim's hold (its token) the asker needs to know this host still
    // keeps on every asked LUN: the create of a re-created VM, taking its LUN
    // over, asks the host that moved the claim before it goes on.
    string hold_token          = 4;
}
message LUNHolder {
    string lun       = 1;
    string vm_name   = 2;
    string disk_name = 3;
    // The VM's host as recorded; for an in-flight create, the answering host.
    string host_name = 4;
    // A create on the answering host holds it and has not committed yet.
    bool   in_flight = 5;
    // The VM's uuid, where the answering host knows it.
    string vm_id     = 6;
    // The VM reads the LUN as its disk's base (a linked clone), not as its disk.
    bool   backing   = 7;
    // The incarnation (created_at) of the VM whose row holds the LUN; empty for
    // an in-flight create or a domain.
    string vm_created_at = 8;
}
message LUNHoldersResponse {
    repeated LUNHolder holders = 1;
    // The host that answered. The asker counts the answer only from the host
    // it asked.
    string answered_by = 2;
    // The answering host still keeps the hold the request's hold_token names,
    // on every asked LUN.
    bool hold_present = 3;
}

// ISCSILUNHoldsRequest lists, or with discard moves aside, a host's iSCSI LUN
// holds (`lv host lun-holds`, `lv host lun-hold discard`).
message ISCSILUNHoldsRequest {
    string host    = 1;  // "" = the host answering
    // A LUN key (iscsi:<target>/lun<n>), a hold's token, or a record's file
    // name: every record it names is moved aside. Admin only.
    string discard = 2;
}
message ISCSILUNHold {
    string file                = 1;  // the record, under <data_dir>/iscsi-lun-holds/
    string token               = 2;
    string vm_name             = 3;
    map<string, string> luns   = 4;  // LUN key → disk name
    string run_host            = 5;  // where the re-created VM runs
    string since               = 6;  // RFC3339
    string replaced_created_at = 7;
    string new_created_at      = 8;  // the re-created incarnation, once learnt
    bool   active              = 9;  // its re-create is still running on this host
    string error               = 10; // set when the record cannot be read; the rest is empty
}
message ISCSILUNHoldsResponse {
    string                host      = 1;
    repeated ISCSILUNHold holds     = 2;
    repeated string       discarded = 3;  // the records this request moved aside
    // Why the holds cannot be read, if they cannot: while it is set the host
    // answers no LUN question.
    string                load_error = 4;
}

// PreflightRecreateVMRequest is the spec of a VM about to be re-created on the
// answering host, as the asking host classified it (iso_scope included).
message PreflightRecreateVMRequest {
    VMSpec spec = 1;
}

// ── Managed fence SSH status (diagnostic) ──
//
// Appended at the end, like the fence readiness messages, so every existing
// message keeps its index.

// FenceSSHStatusRequest: fan_out asks the answering host to collect every
// other live host's own view as well. reevaluate (admin only) has every host
// answering run one fresh sync of its fence ssh agent, which evaluates its
// sshd anew (no cached evaluation) and logs in to it, before it answers; the
// fan-out passes it on. An older host ignores it and answers
// evaluated_for_request=false.
//
// reevaluate_hosts narrows reevaluate: empty, every answering host
// re-evaluates; else only the named ones do (the fan-out sends reevaluate
// only to named peers and reads the others plainly). The answering host,
// when not named, still marks its own node reevaluate_outcome "not asked",
// so a reader can tell it knows reevaluate. A name no host has is ignored.
message FenceSSHStatusRequest {
    bool fan_out                      = 1;
    bool reevaluate                   = 2;
    repeated string reevaluate_hosts  = 3;
}

// FenceSSHPeer is one host as the reporting host holds and reaches it.
message FenceSSHPeer {
    string host           = 1;
    // row: verified | unverified | missing | retired. Only a verified row is
    // rendered or pinned; a host with any other row except missing is never
    // fenced without its pin, so it is refused.
    string row            = 2;
    // Why the row does not verify, or the host's own reason it does not
    // accept the managed fence key.
    string row_detail     = 3;
    bool   accepting      = 4;
    bool   ever_accepting = 5;
    int64  generation     = 6;
    string cert_serial    = 7;  // the certificate that signed the row
    string address        = 8;  // the certificate address its key is accepted from
    // path: how a fence from the reporting host reaches it — managed,
    // legacy-pinned, legacy-unpinned, refused, or self.
    string path           = 9;
    string path_detail    = 10;
    bool   probed         = 11;
    bool   probe_ok       = 12;
    string probe_detail   = 13;
    string probed_at      = 14; // RFC3339
}

// FenceSSHNode is one host's own view.
message FenceSSHNode {
    string host                = 1;
    // reachable=false: the host did not answer, and its view is unknown.
    bool   reachable           = 2;
    string error               = 3;
    string mode                = 4;  // its enforcement.fence_ssh: managed | auto | legacy
    string last_error          = 5;  // its agent's last sync failure
    repeated FenceSSHPeer peers = 6;
    // evaluated_for_request: with reevaluate, this host's agent ran a sync
    // that STARTED after this request reached it, evaluated its sshd in that
    // sync (no cached or failed evaluation), and published its row or found
    // it identical, before it answered. false is no proof either way: an
    // older host, a timeout, a failed sync, or no reevaluate asked.
    bool evaluated_for_request = 7;
    // reevaluate_outcome: set by a host whose build knows reevaluate, every
    // time the request carries it: "proved" when evaluated_for_request is
    // true, else why its re-evaluation proved nothing (it timed out, its sync
    // failed, sshd could not be evaluated, no row was published), or "not
    // asked" from the answering host when reevaluate_hosts leaves it out.
    // Empty: the host predates reevaluate, or (a peer) was not asked. Only
    // the host itself sets it, never the origin of a fan-out on a peer's
    // behalf.
    string reevaluate_outcome = 8;
}

message FenceSSHStatus {
    repeated FenceSSHNode nodes = 1;
    string generated_at         = 2;  // RFC3339
}
